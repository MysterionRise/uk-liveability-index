[project]
name = "lix-core"
version = "0.3.2"
description = "UK Liveability Index: shared paths, config, contracts and scoring"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=1.38,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lix_core"]
