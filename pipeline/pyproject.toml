[project]
name = "lix-pipeline"
version = "0.3.2"
description = "UK Liveability Index: fetch, stage and score open data at LSOA level"
requires-python = ">=3.11"
dependencies = [
    "lix-core",
    "polars>=1.38,<2",  # 2.0 changes lazy/streaming defaults; migrate deliberately
    "duckdb>=1.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scipy>=1.13",
    "fastexcel>=0.12",
    "osmium>=4.0",
    "rapidfuzz>=3.9",
    "requests>=2.31",
    "pyarrow>=15.0",
    "tqdm>=4.66",
    "rasterio>=1.4.4",
]

[project.scripts]
lix = "lix_pipeline.cli:main"

[tool.uv.sources]
lix-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lix_pipeline"]
