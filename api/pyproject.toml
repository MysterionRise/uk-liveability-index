[project]
name = "lix-api"
version = "0.3.2"
description = "UK Liveability Index: REST API, AI agent (AG-UI) and MCP server"
requires-python = ">=3.11"
dependencies = [
    "lix-core",
    "polars>=1.38,<2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyproj>=3.6",
    "duckdb>=1.0",
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-ai-slim[ag-ui,anthropic,openai,google]>=2.50",
    "fastmcp>=4.0",
]

[project.scripts]
lix-api = "lix_api.main:run"

[tool.uv.sources]
lix-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lix_api"]
