# Which nations the index covers and what their geography looks like. Nation is data:
# stagers filter with lix_core.codes.in_scope(), validation reads the expected counts
# here, and LIX_NATIONS=E,W narrows the active set (tests, CI and demo builds use a
# subset). Nation codes are the first letter of ONS GSS codes (E01…, W01…, S01…).
#
# `levels` name each tier's regex, the publisher's term, the expected count and the words
# the interface uses (translated in config/i18n/*.yaml under `levels`). `geo` names the
# registry sources the backbone, the point-in-polygon joins and the map tiles read, so a
# nation with its own files (Scotland) needs no code in those places.

country:
  code: UK
  name: United Kingdom
  working_crs: 27700  # British National Grid; every stager works in metres on this grid
  currency: GBP
  locale: en-GB
  postcode_regex: '^[A-Z]{1,2}\d[A-Z\d]? ?\d[A-Z]{2}$'
  bbox: [-8.7, 49.8, 1.8, 60.9]  # lon/lat
  area_key: lsoa21cd  # the key column of every table, whatever a nation calls its areas

nations:
  E:
    name: England
    ctry_cd: E92000001
    input_crs: 27700
    bbox: [-6.5, 49.8, 1.8, 55.9]
    population: [55000000, 60000000]
    levels:
      oa: {regex: '^E00\d{6}$', official: Output Area, label: output area, labels: output areas}
      low: {regex: '^E01\d{6}$', official: LSOA, count: 33755, label: small area, labels: small areas}
      mid: {regex: '^E02\d{6}$', official: MSOA, count: 6856, label: neighbourhood, labels: neighbourhoods}
      upper: {regex: '^E0[6-9]\d{6}$', official: Local authority, label: council, labels: councils}
    geo_builder: geo_ew
    geo:
      low_boundaries: lsoa_boundaries
      mid_boundaries: msoa_boundaries
      centroids: lsoa_centroids
      oa_lookup: oa_lookup
      population: pop_lsoa_mye
      extra: [msoa_names, ruc_2021]
    places_country: England  # OS Open Names COUNTRY value
    # Rural Urban Classification 2021: urban · larger rural (towns) · smaller rural
    ruc_map: {UN1: urban, UF1: urban, RLN1: town, RLF1: town, RSN1: rural, RSF1: rural}
    demo_upper: [E08000035, E06000043]  # Leeds; Brighton and Hove
    theme_gaps: []
  W:
    name: Wales
    ctry_cd: W92000004
    input_crs: 27700
    bbox: [-5.4, 51.3, -2.6, 53.5]
    population: [3000000, 3300000]
    levels:
      oa: {regex: '^W00\d{6}$', official: Output Area, label: output area, labels: output areas}
      low: {regex: '^W01\d{6}$', official: LSOA, count: 1917, label: small area, labels: small areas}
      mid: {regex: '^W02\d{6}$', official: MSOA, count: 408, label: neighbourhood, labels: neighbourhoods}
      upper: {regex: '^W06\d{6}$', official: Local authority, label: council, labels: councils}
    geo_builder: geo_ew
    geo:
      low_boundaries: lsoa_boundaries
      mid_boundaries: msoa_boundaries
      centroids: lsoa_centroids
      oa_lookup: oa_lookup
      population: pop_lsoa_mye
      extra: [msoa_names, ruc_2021]
    places_country: Wales
    ruc_map: {UN1: urban, UF1: urban, RLN1: town, RLF1: town, RSN1: rural, RSF1: rural}
    pseudo_region: true  # NSPL gives Wales one pseudo region (W99999999): the nation is its region
    demo_upper: [W06000015]  # Cardiff
    theme_gaps: []
  S:
    name: Scotland
    ctry_cd: S92000003
    input_crs: 27700
    bbox: [-7.7, 54.6, -0.7, 60.9]
    population: [5300000, 5700000]
    levels:
      oa: {regex: '^S00\d{6}$', official: Output Area 2022, label: output area, labels: output areas}
      low: {regex: '^S01\d{6}$', official: Data Zone 2022, count: 7392, label: data zone, labels: data zones}
      mid: {regex: '^S02\d{6}$', official: Intermediate Zone 2022, count: 1334, label: intermediate zone, labels: intermediate zones}
      upper: {regex: '^S12\d{6}$', official: Council area, count: 32, label: council area, labels: council areas}
    geo_builder: geo_scotland
    geo:
      low_boundaries: sg_dz22_boundaries
      mid_boundaries: sg_iz22_boundaries
      centroids: sg_dz22_centroids
      oa_lookup: nrs_oa22_lookup
      population: nrs_sape
      code_column: dzcode  # the boundary file's code attribute
      simplify_m: 10  # the shapefiles are full resolution; ONS's E/W files are generalised to 20m
      extra: [sg_dz22_lookup, council_names_gd]
    places_country: Scotland
    # Scottish Government urban rural classification 2022, 6-fold (UR6 in the Data Zone
    # lookup): large urban · other urban · accessible small towns · remote small towns ·
    # accessible rural · remote rural. Quoted so the keys stay strings.
    ruc_map: {"1": urban, "2": urban, "3": town, "4": town, "5": rural, "6": rural}
    pseudo_region: true  # NSPL gives Scotland one pseudo region (S99999999)
    demo_upper: [S12000036]  # City of Edinburgh
    theme_gaps: []
  N:
    name: Northern Ireland
    ctry_cd: N92000002
    input_crs: 29902  # NSPL gives BT postcodes on the Irish Grid; stage_nspl recomputes them
    bbox: [-8.2, 54.0, -5.4, 55.4]
    population: [1850000, 2000000]
    levels:
      oa: {regex: '^N20\d{6}$', official: Data Zone 2021, label: data zone, labels: data zones}
      low: {regex: '^N21\d{6}$', official: Super Data Zone 2021, count: 850, label: super data zone, labels: super data zones}
      # The Super Data Zone is its own mid tier: there is no official layer between it
      # and the council (NISRA's 80 district electoral areas are not statistical areas)
      mid: {regex: '^N21\d{6}$', official: Super Data Zone 2021, count: 850, label: super data zone, labels: super data zones}
      upper: {regex: '^N09\d{6}$', official: Local government district, count: 11, label: council, labels: councils}
    geo_builder: geo_ni
    geo:
      low_boundaries: nisra_sdz21_boundaries
      mid_boundaries: nisra_sdz21_boundaries
      centroids: nisra_sdz21_centroids
      oa_lookup: nisra_dz21_lookup
      population: nisra_sdz_mye
      code_column: SDZ2021_cd
      simplify_m: 10
      extra: [council_names_ga]
    places_country: Northern Ireland  # OS Open Names stops at Great Britain; places come from OpenStreetMap
    places_builder: osm
    # NISRA's Urban/Mixed/Rural status of each Super Data Zone (Census 2021 lookups):
    # urban when 90% or more of its people live in a settlement of band A–E, rural
    # when under 10% do, mixed between
    ruc_map: {Urban: urban, Mixed: town, Rural: rural}
    pseudo_region: true  # NSPL: N99999999
    demo_upper: [N09000003]  # Belfast
    # No open school inspection grades or results exist, so education is shown as
    # limited data and left out of the Northern Irish overall score
    theme_gaps: [education]
