# Indicator catalogue, validated by lix_core.config.IndicatorCatalogue.
#
# Each indicator is built per small area (LSOA, data zone, super data zone) by `builder`
# (a function under lix_pipeline.indicators) and normalised to a 0–100 score where higher
# is better: `rank` (a percentile across the build, or within the nation when
# `benchmark: nation`; the default), `scale` (its own 0–1 or 0–100 scale) or
# `threshold` (100 at `good` or better, 0 at `bad` or worse; log scale with log1p).
# role: scored (in the composite) · context (shown, not scored) · diagnostic (QA and
# imputation only). Within an overlap_group at most one indicator is scored in a nation
# (a substitute is scored only where what it replaces is absent), so the same thing is
# never counted twice (e.g. IoD's crime domain vs police.uk rates).
# The method is written up in docs/methodology.md.

themes:
  safety:
    label: Safety
    description: Recorded crime and anti-social behaviour where people live.
  environment:
    label: Environment
    description: Clean air, quiet streets, trees and green space nearby, and flood risk.
  health:
    label: Health services
    description: How easily residents can see a GP, pharmacist or dentist.
  education:
    label: Schools & childcare
    description: Good schools and nurseries within reach.
  transport:
    label: Transport & connectivity
    description: How well an area connects to jobs and services by every mode, and its broadband.
  amenities:
    label: Amenities & nightlife
    description: Shops, cafés, well-run pubs, leisure and culture nearby.
  housing:
    label: Housing & affordability
    description: What homes cost and the condition of the housing stock.
  community:
    label: Community & wellbeing
    description: Income, work and health of the people who live there.
  climate:
    label: Climate
    description: Sunshine, rain and how warm the summers and mild the winters are, from thirty-year averages.

indicators:

  # ----------------------------------------------------------------------- safety
  - id: crime_violence
    theme: safety
    label: Violent and sexual offences
    description: Recorded violence and sexual offences per 1,000 residents a year (36-month average from police.uk and the PSNI; in Ireland the latest year's Garda station counts, statistics under reservation, spread over the station's 2011 sub-district).
    unit: per 1,000 residents a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W, N, I]  # iod_2025 only imputes Greater Manchester
    sources: [police_crime, iod_2025, cso_cja11, cso_garda_subdistricts, garda_station_aliases]
    builder: safety:crime_rate
    params: {types: ["Violence and sexual offences"]}
    log1p: true
    weight: 1.5
    caveats: Rates use residents as the denominator, so town centres with few residents and many visitors score badly. Greater Manchester Police publishes no data; its area is estimated from IoD 2025's crime domain.
    overlap_group: violence_disorder

  - id: crime_burglary
    theme: safety
    label: Burglary
    description: Recorded burglaries per 1,000 residents a year.
    unit: per 1,000 residents a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W, N, I]  # iod_2025 only imputes Greater Manchester
    sources: [police_crime, iod_2025, cso_cja11, cso_garda_subdistricts, garda_station_aliases]
    builder: safety:crime_rate
    params: {types: ["Burglary"]}
    log1p: true

  - id: crime_asb
    theme: safety
    label: Anti-social behaviour
    description: Reported anti-social behaviour incidents per 1,000 residents a year.
    unit: per 1,000 residents a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W, N, I]  # iod_2025 only imputes Greater Manchester
    sources: [police_crime, iod_2025, cso_cja11, cso_garda_subdistricts, garda_station_aliases]
    builder: safety:crime_rate
    params: {types: ["Anti-social behaviour"]}
    log1p: true

  - id: crime_theft
    theme: safety
    label: Robbery, theft and vehicle crime
    description: Robbery, theft from the person, vehicle crime and bicycle theft per 1,000 residents a year.
    unit: per 1,000 residents a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W, N, I]  # iod_2025 only imputes Greater Manchester
    sources: [police_crime, iod_2025, cso_cja11, cso_garda_subdistricts, garda_station_aliases]
    builder: safety:crime_rate
    params: {types: ["Robbery", "Theft from the person", "Vehicle crime", "Bicycle theft"]}
    log1p: true

  - id: crime_damage_disorder
    theme: safety
    label: Criminal damage and public order
    description: Criminal damage, arson and public order offences per 1,000 residents a year.
    unit: per 1,000 residents a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W, N]  # iod_2025 only imputes Greater Manchester
    sources: [police_crime, iod_2025]
    builder: safety:crime_rate
    params: {types: ["Criminal damage and arson", "Public order"]}
    log1p: true
    role: context
    overlap_group: violence_disorder

  - id: road_danger
    theme: safety
    label: Serious road collisions nearby
    description: Road collisions in which someone was killed or seriously injured within 500m of homes, per year (5-year average).
    unit: collisions a year within 500m
    direction: lower_better
    coverage: [E, W, S, N]  # STATS19 covers Great Britain, the PSNI files Northern Ireland
    sources: [stats19, psni_collisions_2021, psni_collisions_2022, psni_collisions_2023, psni_collisions_2024, psni_collisions_2025, nspl]
    builder: common:count_within
    params: {slug: stats19, column: severity, values: [fatal, serious], radius_m: 500, per_years: 5}
    log1p: true
    weight: 0.75
    caveats: Busy roads near homes raise the count whoever was involved. Police forces moved to a new injury-reporting system at different times, which records more injuries as serious.

  - id: iod_crime
    theme: safety
    label: Deprivation index crime domain
    description: Modelled risk of personal and material victimisation (the deprivation index's crime domain).
    unit: score
    direction: lower_better
    benchmark: nation
    coverage: [E, W, S, N]
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks, simd_2020_ranks, simd_2020_indicators, simd_postcode_lookup, nrs_oa22_population, nimdm_2017, osni_soa01_boundaries]
    builder: common:deprivation
    params: {column: crime_score}
    role: diagnostic
    overlap_group: crime

  # ------------------------------------------------------------------ environment
  - id: recorded_crime
    theme: safety
    label: Recorded crime (SIMD)
    description: Recorded crimes per 1,000 residents a year in the Scottish Index of Multiple Deprivation 2020, brought onto 2022 data zones.
    unit: per 1,000 residents a year
    direction: lower_better
    benchmark: nation
    coverage: [S]
    sources: [simd_2020_indicators, simd_postcode_lookup, nrs_oa22_population, nspl]
    builder: common:deprivation
    params: {column: crime_rate_1000}
    log1p: true
    weight: 2.0
    overlap_group: crime
    substitute_for: [crime_violence, crime_burglary, crime_asb, crime_theft]
    caveats: Police Scotland publishes no open street-level data, so the SIMD rate stands in for the four crime indicators; it covers all recorded crime (violence, sexual offences, housebreaking, vandalism, drugs and common assault) and is older than the police.uk window used elsewhere.

  - id: no2
    theme: environment
    label: Nitrogen dioxide (NO₂)
    description: Annual mean background NO₂ where residents live (Defra 1km model; in Ireland, the EEA's 1km map).
    unit: µg/m³
    direction: lower_better
    coverage: [E, W, S, N, I]  # Defra's model in the UK, the EEA's map in Ireland
    sources: [defra_pcm_no2, eea_aq_no2, nspl, te_buildings]
    builder: environment:pcm
    params: {slug: defra_pcm_no2}
    normalise: threshold
    good: 10   # WHO annual guideline
    bad: 30
    overlap_group: air_quality_no2
    caveats: Background concentrations; roadside levels on busy streets are higher. WHO guideline is 10 µg/m³.

  - id: pm25
    theme: environment
    label: Fine particles (PM2.5)
    description: Annual mean background PM2.5 where residents live (Defra 1km model; in Ireland, the EEA's 1km map).
    unit: µg/m³
    direction: lower_better
    coverage: [E, W, S, N, I]  # Defra's model in the UK, the EEA's map in Ireland
    sources: [defra_pcm_pm25, eea_aq_pm25, nspl, te_buildings]
    builder: environment:pcm
    params: {slug: defra_pcm_pm25}
    normalise: threshold
    good: 5    # WHO annual guideline
    bad: 12
    caveats: WHO guideline is 5 µg/m³.

  - id: green_space_access
    theme: environment
    label: Parks and green spaces nearby
    description: Entrances to public parks, gardens and playing fields within a 1km walk, weighted by distance (in Northern Ireland and Ireland, OpenStreetMap parks and pitches).
    unit: index 0–1
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [os_greenspace, osm_ireland, nspl, te_buildings]
    builder: common:access
    params: {slug: os_greenspace, column: function, values: [Public Park Or Garden, Playing Field], radius_m: 1000, cap: 10}
    normalise: scale
    weight: 0.75
    caveats: Counts public parks and playing fields, not open countryside, so villages surrounded by fields and footpaths score lower than they feel. Northern Ireland has no open greenspace product, so its parks, gardens and pitches come from OpenStreetMap and are measured to the site's nearest edge rather than its entrances.

  - id: play_spaces
    theme: environment
    label: Play areas nearby
    description: Entrances to public play spaces within 800m of homes, weighted by distance (in Northern Ireland and Ireland, OpenStreetMap playgrounds).
    unit: index 0–1
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [os_greenspace, osm_ireland, nspl, te_buildings]
    builder: common:access
    params: {slug: os_greenspace, column: function, values: [Play Space], radius_m: 800, cap: 5}
    normalise: scale
    role: context

  - id: allotment_distance
    theme: environment
    label: Distance to nearest allotments
    description: Average straight-line distance from homes to the nearest allotments or community growing space.
    unit: metres
    direction: lower_better
    coverage: [E, W, S, N, I]  # OS Open Greenspace in Great Britain, OpenStreetMap in Northern Ireland
    sources: [os_greenspace, osm_ireland, nspl, te_buildings]
    builder: common:nearest
    params: {slug: os_greenspace, column: function, values: [Allotments Or Community Growing Spaces], beyond_cap: 50000}
    role: context
    caveats: Distance to the site, not whether a plot is free; waiting lists run to years in many towns. Northern Ireland's and Ireland's sites come from OpenStreetMap.

  - id: radon_potential
    theme: environment
    label: Homes in a high radon area
    description: Share of homes in grid squares where more than 10% of homes are expected to exceed the radon action level (the BGS and UKHSA indicative atlas; the EPA's radon map in Ireland).
    unit: "% of homes"
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [bgs_radon_gb, bgs_radon_ni, epa_radon, nspl, te_buildings]
    builder: common:column
    params: {slug: radon, column: high_share}
    role: context
    caveats: Indicative mapping by 1km square (10km in Ireland), not a measurement; the UKHSA postcode lookup or an EPA test gives a home's own level, and high levels can be reduced.

  - id: flood_risk
    theme: environment
    label: Homes at risk of flooding
    description: Share of homes at high or medium risk of flooding from rivers, the sea or surface water (at least a 1% chance a year).
    unit: "% of homes"
    direction: lower_better
    coverage: [E, W, S]  # EA counts in England, NRW risk areas in Wales, SEPA flood maps in Scotland
    sources: [ea_flood_postcode_tool, nrw_fraw_rivers, nrw_fraw_sea, nrw_fraw_surface_water, os_open_uprn, voa_ctsop, nspl, sepa_flood_river, sepa_flood_coastal, sepa_flood_surface_extent, nrs_dwellings_by_band]
    builder: environment:flood_risk
    params: {bands: [high, medium], prefix: any}
    normalise: threshold
    good: 0
    bad: 25
    overlap_group: flooding
    caveats: Each home is rated by the higher of the rivers-and-sea and surface-water assessments, which allow for flood defences; groundwater and sewer flooding are not included. England's counts are addresses, so shops on a flood-prone high street count too. In Wales, NRW publishes risk areas rather than counts, so homes at risk are estimated from the share of an area's property points inside the high and medium areas. Scotland's SEPA maps are read the same way, with the medium band at 1 in 200 a year (looser than the EA's 1 in 100).

  - id: flood_rivers_sea
    theme: environment
    label: Homes at risk from rivers or the sea
    description: Share of homes at high or medium risk of flooding from rivers or the sea alone (at least a 1% chance a year).
    unit: "% of homes"
    direction: lower_better
    coverage: [E, W, S]
    sources: [ea_flood_postcodes, nrw_fraw_rivers, nrw_fraw_sea, os_open_uprn, voa_ctsop, nspl, sepa_flood_river, sepa_flood_coastal, nrs_dwellings_by_band]
    builder: environment:flood_risk
    params: {bands: [high, medium], prefix: res}
    normalise: threshold
    good: 0
    bad: 25
    role: context
    overlap_group: flooding
    caveats: The part of flood risk that comes from rivers and the sea; surface water is the rest. Flood defences are taken into account.

  - id: noise_exposure
    theme: environment
    label: Homes in transport or industrial noise
    description: Share of homes where mapped noise averages 60 dB Lden or more over the day, evening and night (road, rail and aircraft in England; road, rail and industry in Wales; every mapped source in Scotland, Northern Ireland and Ireland).
    unit: "% of homes"
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [defra_noise_road_lden, defra_noise_rail_lden, defra_noise_air_lden, wg_noise_road_lden, wg_noise_rail_lden, wg_noise_industry_lden, sepa_noise_all_lden, daera_noise_r3, nspl, epa_noise_road_agg, epa_noise_road_nat, epa_noise_rail_agg, epa_noise_rail_nat, epa_noise_air_nat, epa_noise_industry_agg, te_buildings]
    builder: environment:percent
    params: {slug: noise, column: share_any_60}
    normalise: threshold
    good: 0
    bad: 40
    overlap_group: noise
    caveats: Each home is read from the 10m noise grid at its postcode and the loudest mapped source counts. England's maps hold road, rail and the sixteen mapped airports, Wales's road, rail and industry, Scotland's consolidated map every source including industry, and Northern Ireland's round 3 (2017) contours road, rail, industry and Belfast City Airport in the Belfast and Derry agglomerations plus the major roads and railways between them. The cut-off is 60 dB Lden, a busy road's level, because minor roads are mapped only inside the larger towns in England.

  - id: road_rail_noise
    theme: environment
    label: Homes in road or rail noise
    description: Share of homes where road or rail noise averages 60 dB Lden or more over the day, evening and night, from the strategic noise maps.
    unit: "% of homes"
    direction: lower_better
    coverage: [E, W, N, I]  # Scotland publishes one consolidated map (see noise_exposure)
    sources: [defra_noise_road_lden, defra_noise_rail_lden, wg_noise_road_lden, wg_noise_rail_lden, daera_noise_r3, nspl, epa_noise_road_agg, epa_noise_road_nat, epa_noise_rail_agg, epa_noise_rail_nat, te_buildings]
    builder: environment:percent
    params: {slug: noise, column: share_road_rail_60}
    normalise: threshold
    good: 0
    bad: 40
    role: context
    overlap_group: noise
    caveats: Each home is read from the 10m noise grid at its postcode. England's maps cover every road inside the larger towns and cities and only major roads elsewhere, while Wales's cover every road, so the cut-off is 60 dB Lden, a busy road's level, rather than the 55 dB at which the Environmental Noise Directive counts people as exposed and at which ordinary streets would count only where they were mapped. Aircraft and industry are not included.

  - id: aircraft_noise
    theme: environment
    label: Homes in aircraft noise
    description: Share of homes where aircraft noise averages 55 dB Lden or more over the day, evening and night, around the sixteen airports England maps, Belfast City Airport, and Dublin, Cork and Shannon.
    unit: "% of homes"
    direction: lower_better
    coverage: [E, N, I]  # Scotland's consolidated map does not separate airports; Wales maps none
    sources: [defra_noise_air_lden, daera_noise_r3, nspl, epa_noise_air_nat, te_buildings]
    builder: environment:percent
    params: {slug: noise, column: share_air_55}
    role: context
    caveats: The 55 dB Lden contours of Heathrow, Gatwick, Stansted, Luton, London City, Southend, Manchester, Liverpool, Birmingham, East Midlands, Leeds Bradford, Newcastle, Bristol, Bournemouth and Southampton for 2021, a year with fewer flights than usual; homes beyond those contours read 0 whatever smaller airfields they hear.

  - id: industrial_noise
    theme: environment
    label: Homes in industrial noise
    description: Share of homes where industrial noise averages 55 dB Lden or more over the day, evening and night, around Wales's mapped sites, in Scotland's five mapped cities, Northern Ireland's two agglomerations and Ireland's mapped sites.
    unit: "% of homes"
    direction: lower_better
    coverage: [W, S, N, I]  # England publishes no industry layer
    sources: [wg_noise_industry_lden, sepa_noise_industry_lden, daera_noise_r3, nspl, epa_noise_industry_agg, te_buildings]
    builder: environment:percent
    params: {slug: noise, column: share_industry_55}
    role: context
    caveats: Mapped only around Wales's industrial sites (2022 round), in Aberdeen, Dundee, Edinburgh, Falkirk and Glasgow, in Belfast and Derry (2017) and around Ireland's licensed industrial sites (EPA round 4); elsewhere in those nations the value is 0 rather than unknown.

  - id: night_noise
    theme: environment
    label: Homes in night-time noise
    description: Share of homes where mapped noise averages 50 dB Lnight or more between 23:00 and 07:00, the level at which the Environmental Noise Directive counts people as exposed at night (road, rail and aircraft in England; road, rail and industry in Wales; every mapped source in Scotland, Northern Ireland and Ireland).
    unit: "% of homes"
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [defra_noise_road_lnight, defra_noise_rail_lnight, defra_noise_air_lnight, wg_noise_road_lnight, wg_noise_rail_lnight, wg_noise_industry_lnight, sepa_noise_all_lnight, sepa_noise_industry_lnight, daera_noise_r3, nspl, epa_noise_road_agg_lnight, epa_noise_road_nat_lnight, epa_noise_rail_agg_lnight, epa_noise_rail_nat_lnight, epa_noise_air_nat_lnight, epa_noise_industry_agg_lnight, te_buildings]
    builder: environment:percent
    params: {slug: noise, column: share_any_night_50}
    normalise: threshold
    good: 0
    bad: 30
    role: context
    overlap_group: noise
    caveats: The night-time companion of the daytime maps, read at each home from the same 10m grids and contours (England's road, rail and airport layers for 2021, Wales's 2022 road, rail and industry layers, Scotland's consolidated 2021 map, Northern Ireland's 2017 contours, Ireland's round 4 contours); the loudest mapped source counts. The 50 dB Lnight cut-off is the Directive's night reporting threshold, so an unmapped minor road reads as quiet here as it does by day.

  - id: coast_distance
    theme: environment
    label: Distance to the coast
    description: Distance from homes to the nearest coast, in kilometres (the high water mark in Great Britain and Ireland, the Northern Ireland outline).
    unit: km
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [os_boundary_line, te_high_water_mark, osni_ni_outline, te_admin_areas, nspl, te_buildings]
    builder: common:nearest
    params: {slug: coastline, max_nearest_m: 200000, scale: 0.001}
    role: context
    caveats: Straight-line distance to the nearest point of the mapped coastline, which runs up estuaries, sea loughs and tidal rivers as far as the high water mark goes (Norwich, Gloucester and Wisbech read under 2 km); a measure of nearness to tidal water, not of beach access. Lakes and inland loughs are not coast.

  - id: sealed_surface
    theme: environment
    label: Built-up land around homes
    description: Share of the land within 500m of homes that satellite land cover classes as built up, meaning buildings, roads and other sealed surfaces (ESA WorldCover, 10m).
    unit: "%"
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [esa_worldcover, nspl, te_buildings]
    builder: common:column
    params: {slug: tree_cover, column: builtup_pct}
    role: context
    caveats: A 10m cell counts as built up when sealed surfaces dominate it, so gardens and verges between houses lower the share; a yes/no map of 2021, not a measure of how sealed each cell is. Water and unmapped cells are left out of the land total.

  - id: protected_nature
    theme: environment
    label: Protected nature nearby
    description: Hectares of land within about 2km of homes protected for nature (Sites of Special Scientific Interest, nature reserves, Special Areas of Conservation and Special Protection Areas; in Ireland, Special Areas of Conservation, Special Protection Areas and Natural Heritage Areas).
    unit: hectares
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [pa_ne_sssi, pa_ne_nnr, pa_ne_lnr, pa_ne_sac, pa_ne_spa, pa_nrw_sssi, pa_nrw_nnr, pa_nrw_lnr, pa_nrw_sac, pa_nrw_spa, pa_naturescot, pa_daera_assi, pa_daera_nnr, pa_daera_sac, pa_daera_spa, pa_npws_sac, pa_npws_spa, pa_npws_nha, lsoa_boundaries, sg_dz22_boundaries, nisra_sdz21_boundaries, cso_sa22_boundaries, nspl, te_buildings]
    builder: common:column
    params: {slug: protected_areas, column: protected_ha}
    role: context
    caveats: Each designation's own boundaries, merged so that land protected twice counts once, and clipped to land, so marine sites are left out; measured over a window with the area of a 2km circle around each home (at most about 1,257 ha) on a 50m grid. Northern Ireland publishes no national layer of local nature reserves, and Ireland's set is its statutory one, without the proposed Natural Heritage Areas of 1995.

  - id: hilliness
    theme: environment
    label: Hilliness around homes
    description: Mean slope of the ground within about 500m of homes, in percent (a 10% slope rises 10m every 100m).
    unit: "% slope"
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [os_terrain_50, osni_dtm_50m, copernicus_dem_glo30, nspl, te_buildings]
    builder: common:column
    params: {slug: terrain, column: hilliness_pct}
    role: context
    caveats: Slope by Horn's method on a 50m grid, from OS Terrain 50 in Great Britain and OSNI's 50m terrain model in Northern Ireland; Ireland's comes from Copernicus GLO-30, a surface model in which buildings and trees add height, so Irish towns and woods read somewhat hillier than the ground is. Flatter is easier on foot and by bike; the colour says nothing better about either.

  - id: elevation
    theme: environment
    label: Height above sea level
    description: Mean height of homes above sea level, in metres, from the 50m terrain grid.
    unit: metres
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [os_terrain_50, osni_dtm_50m, copernicus_dem_glo30, nspl, te_buildings]
    builder: common:column
    params: {slug: terrain, column: elevation_m}
    role: context
    caveats: The height of the 50m cell each home falls in; Ireland's comes from a surface model, which adds the height of buildings and trees. Neither high nor low is better; the colour scale only orders the areas.

  - id: storm_overflow_spills
    theme: environment
    label: Sewage overflow spills nearby
    description: Hours in the year that storm overflows within 2km of homes spilled sewage into rivers and the sea, added up (Environment Agency Event Duration Monitoring).
    unit: hours a year
    direction: lower_better
    coverage: [E]
    sources: [ea_edm_annual, nspl]
    builder: common:sum_within
    params: {slug: storm_overflows, weight: spill_hours, radius_m: 2000}
    role: context
    caveats: The water companies' own monitoring of each overflow's outlet over the latest calendar year, before spills are grouped into counted spills; an overflow whose monitor worked for less than 90% of the year under-reports. A spill reaches the river downstream, which may be further than 2km from the homes counted here. England only, because the Welsh returns go to Natural Resources Wales and Scotland, Northern Ireland and Ireland publish no full annual record.

  - id: bathing_water_distance
    theme: environment
    label: Distance to a bathing water
    description: Distance from homes to the nearest designated bathing water (a beach, lake or river stretch monitored for swimmers), in kilometres.
    unit: km
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [ea_bathing_waters, nrw_bathing_waters, sepa_bathing_waters, daera_bathing_waters, bathing_water_classes_ni, epa_bathing_waters, nspl, te_buildings]
    builder: common:nearest
    params: {slug: bathing_waters, max_nearest_m: 100000, scale: 0.001}
    role: context
    caveats: Straight-line distance to the sampling point (in Northern Ireland the middle of the designated area). Only waters designated for bathing count, so a fine but undesignated beach or lake does not; the search stops at 100km.

  - id: bathing_water_class
    theme: environment
    label: Bathing water quality nearby
    description: Class of the nearest designated bathing water within 10km of homes, from 4 (Excellent) through Good and Sufficient to 1 (Poor), for the latest season.
    unit: class 1–4 (4 = excellent)
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [ea_bathing_waters, nrw_bathing_waters, sepa_bathing_waters, daera_bathing_waters, bathing_water_classes_ni, epa_bathing_waters, nspl, te_buildings]
    builder: common:nearest_attr
    params: {slug: bathing_waters, value: class_score, max_m: 10000}
    role: context
    caveats: The class of the bathing water nearest each home, averaged over the area's homes; an area where fewer than half the homes have one within 10km has no value. Classes rest on four seasons of samples (three for waters designated since 2022), and Northern Ireland's are transcribed from DAERA's yearly announcement.

  - id: river_status
    theme: environment
    label: River and lake health nearby
    description: Status of the nearest river or lake within 2km of homes under the Water Framework Directive, from 5 (High) through Good, Moderate and Poor to 1 (Bad).
    unit: class 1–5 (5 = high)
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [ea_wfd_rivers, ea_wfd_lakes, nrw_wfd_rivers, nrw_wfd_lakes, sepa_wfd_rivers, sepa_wfd_lochs, daera_wfd_status_2018, daera_river_segments, daera_lake_water_bodies, epa_wfd_rivers, epa_wfd_lakes, nspl, te_buildings]
    builder: common:nearest_attr
    params: {slug: water_status, value: class_score, max_m: 2000}
    role: context
    caveats: The status of the river or lake nearest each home, averaged over the area's homes; an area where fewer than half the homes have one within 2km has no value. Ecological status in England (2025), Wales (2024, interim), Northern Ireland (2018, the newest open) and Ireland (2019–2024); overall status in Scotland (2024), the only class SEPA publishes openly. Only the water bodies the agencies classify count, so small streams and ponds do not.

  - id: tree_canopy
    theme: environment
    label: Tree cover around homes
    description: Share of the land within 500m of homes that satellite land cover classes as tree cover (ESA WorldCover, 10m).
    unit: "%"
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [esa_worldcover, nspl, te_buildings]
    builder: common:column
    params: {slug: tree_cover, column: canopy_pct}
    normalise: threshold
    good: 40   # a well-treed suburb; the national median around homes is about 30
    bad: 5
    weight: 0.75
    caveats: A 10m cell counts as tree cover when trees dominate it, so this reads roughly twice Forest Research's canopy survey (which samples points) while ranking wards much the same; single garden trees and hedges are missed. Water and unmapped cells are left out of the land total, so a seafront home is judged on the land behind it.

  - id: light_pollution
    theme: environment
    label: Night-time light
    description: Average night-time radiance within 1km of homes, from the VIIRS satellite annual composite (nW/cm²/sr).
    unit: nW/cm²/sr
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [viirs_vnl, nspl, te_buildings]
    builder: environment:optional_column
    params: {slug: night_lights, column: radiance}
    role: context
    caveats: Brighter means more street and building lighting and so less of a view of the night sky; it tracks density and cuts both ways, which is why it is shown but not scored. The satellite is blind to the blue part of LED light, so newly converted streets read darker than they look.

  - id: iod_outdoors
    theme: environment
    label: Outdoor living environment (deprivation index)
    description: Air quality and road traffic accidents (IoD 2025 and WIMD 2025 sub-domains).
    unit: score
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # IoD in England, WIMD in Wales (see stage/deprivation.py)
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks]
    builder: common:deprivation
    params: {column: outdoors_score}
    role: diagnostic

  # ----------------------------------------------------------------------- health
  - id: hospital_ae_distance
    theme: health
    label: Distance to nearest A&E
    description: Average straight-line distance from homes to the nearest consultant-led emergency department.
    unit: metres
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [ae_sites, nspl, te_buildings]
    builder: common:nearest
    params: {slug: ae_sites, column: type, values: [type1], beyond_cap: 50000}
    normalise: threshold
    good: 5000
    bad: 40000
    log1p: true
    weight: 0.75
    caveats: Scotland's departments come from Public Health Scotland's list; England's and Wales's from OpenStreetMap hospitals tagged with an emergency department, which may include some minor injury units. Homes with nothing within 50km read 50km, the search cap, not a measured distance.

  - id: hospital_distance
    theme: health
    label: Distance to nearest urgent care
    description: Average straight-line distance from homes to the nearest emergency department or minor injury unit.
    unit: metres
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [ae_sites, nspl, te_buildings]
    builder: common:nearest
    params: {slug: ae_sites, column: type, values: [type1, other], beyond_cap: 50000}
    role: context
    caveats: Homes with nothing within 50km read 50km, the search cap, not a measured distance.

  - id: gp_distance
    theme: health
    label: Distance to nearest GP practice
    description: Average straight-line distance from homes to the nearest GP practice.
    unit: metres
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [ods_gp, nspl, phs_gp_practices, bso_gp_list_sizes, osm_ireland, te_buildings]
    builder: health:nearest_gp
    normalise: threshold
    good: 1000
    bad: 8000
    log1p: true

  - id: patients_per_gp
    theme: health
    label: Patients per GP
    description: Registered patients per full-time-equivalent qualified GP at the practices residents actually use.
    unit: patients per FTE GP
    direction: lower_better
    benchmark: nation
    sources: [gp_registrations, gp_workforce]
    builder: health:patients_per_gp
    normalise: threshold
    good: 1500
    bad: 3500
    caveats: Excludes GPs in training; practices reporting under one full-time GP are left out of the average.

  - id: gp_list_size
    theme: health
    label: Patients per GP practice nearby
    description: Registered patients per practice at the GP practices near homes, weighted by distance.
    unit: patients per practice
    direction: lower_better
    coverage: [E, S, N]  # list sizes: NHS England's registrations, Public Health Scotland's and BSO's lists; Wales publishes none
    sources: [ods_gp, gp_registrations, phs_gp_practices, bso_gp_list_sizes, nspl]
    builder: health:gp_list_size
    params: {radius_m: 2000}
    role: context
    caveats: "Patients per practice, not per doctor: a large practice may have many GPs. The honest measure where GP headcounts are not published (everywhere but England)."

  - id: gp_quality
    theme: health
    label: GP practice ratings
    description: CQC ratings of the GP practices residents are registered with, weighted by how many use each.
    unit: rating 0–1 (Good = 0.75)
    direction: higher_better
    benchmark: nation
    sources: [cqc_locations, gp_registrations]
    builder: health:gp_quality
    normalise: threshold
    good: 0.9
    bad: 0.4
    weight: 0.75
    caveats: Most practices are rated Good, and some ratings are several years old.

  - id: care_homes
    theme: health
    label: Well-rated care homes nearby
    description: Beds in care homes rated Good or Outstanding by CQC within 5km, weighted by distance.
    unit: index 0–1
    direction: higher_better
    sources: [cqc_locations, nspl]
    builder: health:care_homes
    params: {radius_m: 5000, cap: 10}
    normalise: scale
    role: context

  - id: pharmacy_distance
    theme: health
    label: Distance to nearest pharmacy
    description: Average straight-line distance from homes to the nearest community pharmacy (NHS lists in Great Britain and Northern Ireland, OpenStreetMap in Wales and Ireland).
    unit: metres
    direction: lower_better
    coverage: [E, W, S, N, I]  # NHSBSA in England, OpenStreetMap in Wales, PHS dispenser list in Scotland
    sources: [nhsbsa_pharmacies, osm_wales, nspl, phs_pharmacies, bso_dispensing, osm_ireland, te_buildings]
    builder: common:nearest
    params: {slug: pharmacies}
    normalise: threshold
    good: 1000
    bad: 8000
    log1p: true
    weight: 0.75
    caveats: Rural GP practices that dispense medicines themselves aren't counted. Welsh pharmacies come from OpenStreetMap, since NWSSP's list is not machine-readable.

  - id: dentist_distance
    theme: health
    label: Distance to nearest NHS dentist
    description: Average straight-line distance from homes to the nearest dental practice (with an NHS contract in the UK; OpenStreetMap in Ireland).
    unit: metres
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [ods_dentists, nspl, phs_dentists, bso_dental, osm_ireland, te_buildings]
    builder: common:nearest
    params: {slug: ods_dentists}
    normalise: threshold
    good: 1500
    bad: 10000
    log1p: true
    weight: 0.5
    caveats: Whether a practice takes new NHS patients isn't published as open data.

  # -------------------------------------------------------------------- education
  - id: primary_school_quality
    theme: education
    label: Good primary schools nearby
    description: Quality of the three nearest state primary schools (Ofsted and results), nearer ones counting more.
    unit: quality 0–1
    direction: higher_better
    benchmark: nation
    coverage: [E]  # Wales publishes no primary results or grades
    sources: [gias, ofsted_schools, ks2_results, nspl]
    builder: education:school_quality_nearby
    params: {phases: [Primary, All-through, Middle deemed primary], results_slug: ks2_results, results_column: ks2_rwm_pct, k: 3, sigma_m: 1500, max_m: 5000}
    normalise: threshold
    good: 0.8
    bad: 0.4
    weight: 1.5
    caveats: Quality blends Ofsted (60%) and key stage 2 results as a percentile (40%); results reflect intake as well as teaching. Distance isn't admission; oversubscribed schools admit by catchment or faith. Not available in Wales, Scotland or Northern Ireland, which publish no primary school results or inspection grades.

  - id: secondary_school_quality
    theme: education
    label: Good secondary schools nearby
    description: Quality of the three nearest state secondary schools (Ofsted and results), nearer ones counting more.
    unit: quality 0–1
    direction: higher_better
    benchmark: nation
    coverage: [E, W, S]  # Wales: the authority's Capped 9 score, broadcast; Scotland: leaver tariff
    sources: [gias, wg_schools, ofsted_schools, ks4_results, wg_ks4_la, nspl, sg_school_roll, sg_attainment]
    builder: education:school_quality_nearby
    params: {phases: [Secondary, All-through, Middle deemed secondary], results_slug: ks4_results, results_column: attainment8, k: 3, sigma_m: 4000, max_m: 15000, la_results_slug: wg_ks4_la, la_results_column: capped9, extra_results: {S: [sg_attainment, tariff_avg]}}
    normalise: threshold
    good: 0.8
    bad: 0.4
    weight: 1.5
    caveats: Quality blends Ofsted (60%) and Attainment 8 as a percentile (40%); Progress 8 isn't published for 2024/25. In Wales, where no per-school results or inspection grades are published, the local authority's Capped 9 points score stands in for every school in it (flagged broadcast_lad). In Scotland quality is each school's average leaver tariff score as a percentile within Scotland; no inspection grades are published as open data.

  - id: school_choice
    theme: education
    label: Choice of good schools
    description: Good state primaries within 2km and secondaries within 5km, weighted by quality and distance.
    unit: index 0–1
    direction: higher_better
    benchmark: nation
    coverage: [E, W, S, N]  # Welsh and Scottish schools count as present but ungraded
    sources: [gias, wg_schools, ofsted_schools, nspl, sg_school_roll, de_schools_primary, de_schools_post_primary]
    builder: education:school_choice
    params: {cap: 4}
    normalise: scale
    weight: 0.5

  - id: primary_results
    theme: education
    label: Primary school results nearby
    description: Share of pupils meeting the expected standard in reading, writing and maths at state primaries within 2km (3-year average), weighted by distance.
    unit: "% of pupils"
    direction: higher_better
    benchmark: nation
    sources: [ks2_results, gias, nspl]
    builder: education:school_results
    params: {slug: ks2_results, column: ks2_rwm_pct, phases: [Primary, All-through, Middle deemed primary], radius_m: 2000}
    role: context
    caveats: Results reflect pupils' backgrounds as well as teaching; progress measures aren't published for 2024/25.

  - id: secondary_results
    theme: education
    label: Secondary school results nearby
    description: Average Attainment 8 score at state secondaries within 5km, weighted by distance.
    unit: Attainment 8
    direction: higher_better
    benchmark: nation
    sources: [ks4_results, gias, nspl]
    builder: education:school_results
    params: {slug: ks4_results, column: attainment8, phases: [Secondary, All-through, Middle deemed secondary], radius_m: 5000}
    role: context
    caveats: Results reflect pupils' backgrounds as well as teaching; Progress 8 isn't published for 2024/25 and 2025/26.

  - id: nursery_access
    theme: education
    label: Good nurseries nearby
    description: Nurseries, pre-schools and school nursery classes within 1km, each weighted by its Ofsted grade and distance.
    unit: index 0–1
    direction: higher_better
    coverage: [E, W, S, N]  # Ofsted in England, OpenStreetMap in Wales, the Care Inspectorate in Scotland
    sources: [ofsted_childcare, osm_wales, gias, wg_schools, nspl, care_inspectorate, sg_school_roll, de_schools_nursery, de_schools_preschool]
    builder: education:nursery_access
    params: {radius_m: 1000, cap: 3}
    normalise: scale
    caveats: Childminders aren't located (Ofsted withholds their addresses). In Wales nurseries come from OpenStreetMap (CIW publishes no provider list) and count as average quality; school nursery classes are included from the Welsh schools list. In Scotland each nursery is weighted by its Care Inspectorate grades.

  # -------------------------------------------------------------------- transport
  - id: connectivity_overall
    theme: transport
    label: Overall connectivity
    description: DfT connectivity score across all modes and destinations.
    unit: score 0–100
    direction: higher_better
    sources: [dft_connectivity]
    builder: common:column
    params: {slug: dft_connectivity, column: tcm_overall}
    # Full marks at a typical suburb's connectivity (75): beyond that, more doesn't count
    normalise: threshold
    good: 75
    bad: 0
    weight: 1.5
    overlap_group: connectivity

  - id: connectivity_public_transport
    theme: transport
    label: Public transport connectivity
    description: DfT connectivity score for public transport to all destinations.
    unit: score 0–100
    direction: higher_better
    sources: [dft_connectivity]
    builder: common:column
    params: {slug: dft_connectivity, column: tcm_overall_public_transport}
    normalise: scale
    scale_max: 100
    role: context
    overlap_group: connectivity

  - id: connectivity_walking
    theme: transport
    label: Walkability
    description: DfT connectivity score for walking to all destinations.
    unit: score 0–100
    direction: higher_better
    sources: [dft_connectivity]
    builder: common:column
    params: {slug: dft_connectivity, column: tcm_overall_walking}
    normalise: scale
    scale_max: 100
    role: context
    overlap_group: connectivity

  - id: cycle_infrastructure
    theme: transport
    label: Cycle tracks and lanes nearby
    description: Kilometres of cycleway, cycle track and painted cycle lane per km² within 1km of homes (OpenStreetMap).
    unit: km per km²
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [osm_england, osm_wales, osm_scotland, osm_ireland, nspl, te_buildings]
    builder: common:sum_within
    params: {slug: osm_network_points, column: kind, values: [cycle_sample], weight: weight, radius_m: 1000, per_km2: true}
    role: context
    overlap_group: connectivity
    caveats: "Cycle infrastructure as OpenStreetMap maps it, which is fuller in cities: cycleways, paths where cycling is designated, and lanes or tracks along a road (a lane on both sides of a street counts once). Shared footways without the designation and quiet streets are not counted."

  - id: street_connectivity
    theme: transport
    label: Street connectivity
    description: Junctions of walkable streets and paths per km² within 1km of homes (OpenStreetMap).
    unit: per km²
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [osm_england, osm_wales, osm_scotland, osm_ireland, nspl, te_buildings]
    builder: common:density_within
    params: {slug: osm_network_points, column: kind, values: [junction], radius_m: 1000}
    role: context
    overlap_group: connectivity
    caveats: A junction is where three or more ends of walkable streets or paths meet, so a T counts and two streets meeting end to end do not; driveways and car-park aisles are left out. A street grid reads high and a cul-de-sac estate low, unless footpaths through the estate are mapped.

  - id: connectivity_cycling
    theme: transport
    label: Cycling connectivity
    description: DfT connectivity score for cycling to all destinations.
    unit: score 0–100
    direction: higher_better
    sources: [dft_connectivity]
    builder: common:column
    params: {slug: dft_connectivity, column: tcm_overall_cycling}
    normalise: scale
    scale_max: 100
    weight: 0.5
    role: context
    overlap_group: connectivity

  - id: access_deprivation
    theme: transport
    label: Access to services (SIMD, NIMDM)
    description: Geographic access domain of the Scottish Index of Multiple Deprivation 2020 (drive and public transport times to GPs, schools, shops, post offices and petrol stations), brought onto 2022 data zones; in Northern Ireland the NIMDM 2017 proximity to services domain.
    unit: score 0–100
    direction: lower_better
    benchmark: nation
    coverage: [S, N]
    sources: [nimdm_2017, simd_2020_ranks, simd_postcode_lookup, nrs_oa22_population, nspl]
    builder: common:deprivation
    params: {column: access_score}
    weight: 1.5
    overlap_group: connectivity
    substitute_for: [connectivity_overall]
    caveats: Stands in for the DfT connectivity metric, which covers England and Wales only; a rank-based score within Scotland, so it says how an area compares with the rest of Scotland.

  - id: station_distance
    theme: transport
    label: Distance to nearest station
    description: Average straight-line distance from homes to the nearest railway, metro or tram stop.
    unit: metres
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [naptan, translink_rail_txc, nspl, nta_gtfs, te_buildings]
    builder: common:nearest
    params: {slug: naptan, column: mode, values: [rail, metro_tram], beyond_cap: 50000}
    normalise: threshold
    good: 800
    bad: 10000
    log1p: true
    weight: 0.75
    role: context
    overlap_group: rail_access
    caveats: Homes with nothing within 50km read 50km, the search cap, not a measured distance.

  - id: ev_charging
    theme: transport
    label: Public charge points nearby
    description: Public electric-vehicle charging sites within 1.5km of homes, on average (OpenStreetMap, ESB on the island of Ireland, Open Charge Map).
    unit: within 1.5km
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [osm_england, osm_wales, osm_scotland, osm_ireland, esb_ev_sites, open_charge_map_gb, open_charge_map_ie, nspl, te_buildings]
    builder: common:count_within
    params: {slug: chargers, radius_m: 1500}
    role: context
    caveats: Counts charging sites, not sockets or their speed, from OpenStreetMap, ESB's network on the island of Ireland and Open Charge Map's openly licensed providers (the last only when a build has a key); the UK's national chargepoint registry closed in 2024.

  - id: rail_service
    theme: transport
    label: Rail service nearby
    description: Annual station entries and exits (ORR) within 2km of homes, weighted by distance and saturating, so a busy station nearby counts more than a halt.
    unit: index 0–1
    direction: higher_better
    sources: [orr_station_usage, orr_station_attributes, nspl]
    builder: common:access
    params: {slug: orr_stations, radius_m: 2000, cap: 10, weight: entries_exits_m}
    normalise: scale
    weight: 0.75
    overlap_group: rail_access
    caveats: Mainline stations only (metro and tram stops count in the distance measure); usage is a proxy for service frequency, which the timetable licence does not allow us to compute.

  - id: bus_frequency
    theme: transport
    label: Bus frequency
    description: Buses an hour (weekdays, 07:00–19:00) at the busiest stop within 400m of homes.
    unit: buses an hour
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [bods_gtfs, bods_gtfs_wales, nspl, bods_gtfs_scotland, translink_metro_txc, translink_ulsterbus_txc, nta_gtfs, te_buildings]
    builder: common:nearby_max
    params: {slug: bods_gtfs, column: per_hour, radius_m: 400}
    normalise: threshold
    good: 12
    bad: 0
    log1p: true
    role: context
    overlap_group: connectivity
    caveats: Timetabled buses on a normal Tuesday. Shown, not scored, because DfT's connectivity score (scored) already covers bus access (ρ ≈ 0.82). Publishing to the Bus Open Data Service is voluntary in Scotland, so some Scottish operators are missing.

  - id: bus_access
    theme: transport
    label: Bus service nearby
    description: Buses an hour (weekdays, 07:00–19:00) at the busiest stop within 400m of homes, from the Transport for Ireland timetables; stands in for the connectivity score Ireland has no equivalent of.
    unit: buses an hour
    direction: higher_better
    coverage: [I]
    sources: [nta_gtfs, te_buildings]
    builder: common:nearby_max
    params: {slug: bods_gtfs, column: per_hour, radius_m: 400}
    normalise: threshold
    good: 12
    bad: 0
    log1p: true
    overlap_group: connectivity
    substitute_for: [connectivity_overall]
    caveats: Timetabled buses on a normal Tuesday, every operator in the national feed. A substitute for the DfT connectivity score, which weighs walking, cycling, driving and public transport to jobs and services; buses alone read thinner.

  - id: gigabit_broadband
    theme: transport
    label: Gigabit broadband
    description: Share of homes that can get gigabit-capable broadband (full fibre or cable).
    unit: "% of homes"
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [ofcom_broadband, comreg_gigabit, cso_sa22_boundaries]
    builder: common:column
    params: {slug: ofcom_broadband, column: gigabit_pct}
    normalise: scale
    scale_max: 100
    weight: 0.75

  - id: slow_broadband
    theme: transport
    label: Homes without decent broadband
    description: Share of homes that can't get 10 Mbit/s broadband from a fixed line or fixed wireless.
    unit: "% of homes"
    direction: lower_better
    sources: [ofcom_broadband]
    builder: common:column
    params: {slug: ofcom_broadband, column: below_uso_pct}
    role: context

  # -------------------------------------------------------------------- amenities
  - id: well_run_pubs
    theme: amenities
    label: Well-run pubs nearby
    description: Pubs within a 15-minute walk that hold a food hygiene rating of 4 or 5 from the last three years, weighted by distance, with a small bonus for real ale, food or outdoor seating.
    unit: index 0–1
    direction: higher_better
    coverage: [E, W, S, N]
    sources: [osm_england, osm_wales, overture_pubs, fsa_fhrs, nspl, osm_scotland, osm_ireland]
    builder: pubs:well_run_pub_access
    params: {radius_m: 1200, cap: 3}
    normalise: scale
    caveats: Hygiene ratings measure how well a pub is run, not the beer or the atmosphere. Scotland's hygiene scheme grades Pass or Improvement Required rather than 0–5 and inspects on a longer cycle, so there a pub counts as well run when it passed within the last five years.

  - id: food_and_drink
    theme: amenities
    label: Cafés and restaurants
    description: Cafés and restaurants within 800m, weighted by distance.
    unit: index 0–1
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [osm_england, osm_wales, nspl, osm_scotland, osm_ireland, te_buildings]
    builder: amenities:osm_access
    params: {values: [cafe, restaurant], radius_m: 800, cap: 6}
    normalise: scale
    overlap_group: high_street

  - id: supermarket_distance
    theme: amenities
    label: Distance to nearest supermarket
    description: Average straight-line distance from homes to the nearest supermarket.
    unit: metres
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [osm_england, osm_wales, nspl, osm_scotland, osm_ireland, te_buildings]
    builder: amenities:osm_nearest
    params: {values: [supermarket]}
    normalise: threshold
    good: 1000
    bad: 10000
    log1p: true

  - id: everyday_services
    theme: amenities
    label: Everyday services within 15 minutes
    description: Share of seven everyday service types (a GP practice, a pharmacy, a supermarket, a primary school, a post office, a park or playground, and frequent public transport) that the typical home has within 1.2 km, about a 15-minute walk in a straight line.
    unit: "%"
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [ods_gp, phs_gp_practices, bso_gp_list_sizes, nhsbsa_pharmacies, phs_pharmacies, bso_dispensing, osm_england, osm_wales, osm_scotland, osm_ireland, gias, wg_schools, sg_school_roll, de_schools_primary, de_schools_post_primary, de_schools_special, os_greenspace, bods_gtfs, bods_gtfs_wales, bods_gtfs_scotland, naptan, nta_gtfs, translink_rail_txc, translink_metro_txc, translink_ulsterbus_txc, nspl, te_buildings]
    builder: amenities:service_mix
    params:
      radius_m: 1200
      services:
        - {name: GP practice, slug: ods_gp}
        - {name: pharmacy, slug: pharmacies}
        - {name: supermarket, slug: osm_pois, key: shop, values: [supermarket]}
        - {name: primary school, slug: schools, column: phase, values: [Primary, Middle deemed primary, All-through]}
        - {name: post office, slug: osm_pois, key: amenity, values: [post_office]}
        - name: park or playground
          any:
            - {slug: os_greenspace, column: function, values: [Public Park Or Garden, Playing Field]}
            - {slug: osm_pois, key: leisure, values: [park, playground]}
        - name: frequent public transport
          any:
            - {slug: bods_gtfs, column: per_hour, min: 2}
            - {slug: naptan, column: mode, values: [rail, metro_tram]}
    role: context
    caveats: Straight-line reach, not walking time, so a river or a railway between home and shop is not seen (a walking network is planned). Frequent transport means a stop with at least two weekday daytime departures an hour or a railway, metro or tram station. Ireland stages no school list, so its homes are measured over the other six types. Irish homes are every building rather than postcode points, so dispersed rural Ireland reads lower than rural Britain.

  - id: library_distance
    theme: amenities
    label: Distance to a library
    description: Mean straight-line distance from homes to the nearest public library (OpenStreetMap).
    unit: metres
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [osm_england, osm_wales, osm_scotland, osm_ireland, nspl, te_buildings]
    builder: amenities:osm_nearest
    params: {values: [library], beyond_cap: 20000}
    role: context
    caveats: Libraries as OpenStreetMap maps them; a council's list may be fuller. The search stops at 20 km; a home with none that close counts as 20 km, and an area whose homes mostly have none is marked as at least that far.

  - id: post_office_distance
    theme: amenities
    label: Distance to a post office
    description: Mean straight-line distance from homes to the nearest post office (OpenStreetMap).
    unit: metres
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [osm_england, osm_wales, osm_scotland, osm_ireland, nspl, te_buildings]
    builder: amenities:osm_nearest
    params: {values: [post_office], beyond_cap: 20000}
    role: context
    caveats: Post offices as OpenStreetMap maps them, counters inside shops included where mapped; Tramore's are not mapped. The search stops at 20 km; a home with none that close counts as 20 km, and an area whose homes mostly have none is marked as at least that far.

  - id: shops
    theme: amenities
    label: Shops nearby
    description: Shops of every kind within 800m, weighted by distance.
    unit: index 0–1
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [osm_england, osm_wales, nspl, osm_scotland, osm_ireland]
    builder: amenities:osm_access
    params: {key: shop, radius_m: 800, cap: 30}
    normalise: scale
    weight: 0.75
    role: context
    overlap_group: high_street

  - id: leisure
    theme: amenities
    label: Sports and fitness facilities
    description: Sports centres and gyms open to the public within 2km, weighted by distance (OpenStreetMap).
    unit: index 0–1
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [osm_england, osm_wales, osm_scotland, nspl, osm_ireland, te_buildings]
    builder: amenities:osm_access
    params: {values: [sports_centre, fitness_centre], radius_m: 2000, cap: 10, exclude: {access: [private, "no"]}}
    normalise: scale
    weight: 0.75
    overlap_group: leisure
    caveats: Mapped facilities, so a town's leisure centre counts once however many halls it has; swimming pools are left out because most mapped ones are private garden pools. Sport England's Active Places register (leisure_facilities) is the cross-check in England.

  - id: leisure_facilities
    theme: amenities
    label: Sports facilities (Active Places)
    description: Sports halls, gyms, pools, studios, courts and pitches open to the public within 2km in Sport England's Active Places register, weighted by distance.
    unit: index 0–1
    direction: higher_better
    sources: [active_places, nspl]
    builder: common:access
    params: {slug: active_places, radius_m: 2000, cap: 10}
    normalise: scale
    role: context
    overlap_group: leisure

  - id: swimming_pool_distance
    theme: amenities
    label: Distance to nearest public pool
    description: Average straight-line distance from homes to the nearest swimming pool open to the public.
    unit: metres
    direction: lower_better
    sources: [active_places, nspl]
    builder: common:nearest
    params: {slug: active_places, column: type, values: [Swimming Pool]}
    role: context

  - id: culture
    theme: amenities
    label: Libraries, cinemas, theatres and museums
    description: Libraries, cinemas, theatres, arts centres, museums and galleries within 2km.
    unit: index 0–1
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [osm_england, osm_wales, nspl, osm_scotland, osm_ireland, te_buildings]
    builder: amenities:osm_access
    params: {values: [library, cinema, theatre, arts_centre, museum, gallery], radius_m: 2000, cap: 3}
    normalise: scale
    weight: 0.75

  - id: listed_buildings
    theme: amenities
    label: Listed buildings nearby
    description: Listed buildings within 1km of homes, per km² (Historic England, Cadw, Historic Environment Scotland and the Department for Communities; in Ireland, the National Inventory of Architectural Heritage at regional rating or above).
    unit: per km²
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [nhle_listed, cadw_listed, hes_listed, dfc_listed, niah_buildings, nspl, te_buildings]
    builder: common:density_within
    params: {slug: heritage, radius_m: 1000}
    role: context
    caveats: A density of protected buildings, as a sign of historic character; it says nothing about the condition of the homes, and Ireland's figure counts the inventory's recommendations rather than the councils' statutory records.

  - id: fast_food
    theme: amenities
    label: Fast-food outlets nearby
    description: Fast-food outlets within 800m.
    unit: index 0–1
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [osm_england, osm_wales, nspl, osm_scotland, osm_ireland]
    builder: amenities:osm_access
    params: {values: [fast_food], radius_m: 800, cap: 15}
    normalise: scale
    role: context

  - id: gambling
    theme: amenities
    label: Betting shops and casinos nearby
    description: Betting shops, gambling venues and casinos within 800m.
    unit: index 0–1
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [osm_england, osm_wales, nspl, osm_scotland, osm_ireland]
    builder: amenities:osm_access
    params: {values: [gambling, casino, bookmaker, lottery], radius_m: 800, cap: 5}
    normalise: scale
    role: context

  # ---------------------------------------------------------------------- housing
  - id: house_price
    theme: housing
    label: Typical house price
    description: Median sale price over the last 12 months, steadied towards the surrounding area where sales are few.
    unit: £
    direction: lower_better
    benchmark: nation
    coverage: [E, W, S, N]
    sources: [price_paid, nspl, ros_house_prices, lps_house_prices_ward, osni_ward12_boundaries]
    builder: housing:median_price
    weight: 2.0
    caveats: Lower prices score as more affordable; the scale reflects price, not value. In Scotland the Registers of Scotland publish annual medians per 2011 data zone (the latest calendar year, about two years behind the Land Registry file), suppressed under five sales; they come onto the 2022 zones through the postcode crosswalk, and a zone without a price takes its intermediate zone's.

  - id: housing_condition
    theme: housing
    label: Housing condition
    description: Housing domain of the deprivation index (homes in poor condition or without central heating; in Scotland, overcrowding and no central heating).
    unit: score
    direction: lower_better
    benchmark: nation
    coverage: [E, W, S, N]  # IoD in England, WIMD in Wales, SIMD in Scotland (see stage/deprivation.py)
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks, simd_2020_ranks, simd_2020_indicators, simd_postcode_lookup, nrs_oa22_population, nimdm_2017, osni_soa01_boundaries]
    builder: common:deprivation
    params: {column: housing_score}

  - id: price_change
    theme: housing
    label: House price change
    description: Change in the median sale price, last 12 months against the 12 months before.
    unit: "%"
    direction: higher_better
    benchmark: nation
    coverage: [E, W, S, N]
    sources: [price_paid, ros_house_prices, lps_house_prices_ward]
    builder: common:column
    params: {slug: price_paid, column: yoy_change_pct}
    role: context
    caveats: Noisy where sales are few; in Scotland and Northern Ireland the change is between calendar years, and a Northern Irish ward whose median is suppressed in either year has none.

  - id: council_tax
    theme: housing
    label: Council tax (council's Band D rate)
    description: The council's annual charge for a Band D home, including county, police, fire and average parish charges; the like-for-like rate every council publishes.
    unit: £ a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W, S]
    sources: [council_tax, wg_council_tax, sg_council_tax]
    builder: housing:council_tax
    params: {band: d}
    weight: 0.5
    caveats: The same for every neighbourhood in a council area; a home's bill depends on its band. Welsh bands are derived from each authority's average band D using the statutory ratios.

  - id: domestic_rates
    theme: housing
    label: Domestic rates (typical home)
    description: Annual domestic rates bill for a home at the area's median capital value, from the regional rate and the council's district rate (Northern Ireland).
    unit: £ a year
    direction: lower_better
    benchmark: nation
    coverage: [N]
    sources: [ni_domestic_rates, lps_capital_value_bands, osni_soa01_boundaries, nspl]
    builder: housing:domestic_rates
    weight: 0.5
    substitute_for: council_tax
    caveats: Northern Ireland charges rates on a home's capital value rather than council tax by band; the bill shown is for a home at the middle of the area's 2016 value mix, so it moves with local values as well as the poundage.

  - id: council_tax_typical
    theme: housing
    label: Council tax (typical home here)
    description: What a typical home in the area pays in council tax, each band's charge weighted by how many of the area's homes are in that band.
    unit: £ a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # the VOA stock by band; Scotland publishes three band groups only
    sources: [council_tax, wg_council_tax, voa_ctsop]
    builder: housing:council_tax_typical
    role: context
    caveats: Uses the council's charge per band and the area's band mix, so an area of band A terraces reads about two thirds of the council's Band D rate; discounts and exemptions are not included.

  - id: price_to_income
    theme: housing
    label: Price to local income
    description: Typical house price divided by the area's mean net household income.
    unit: years of income
    direction: lower_better
    benchmark: nation
    sources: [price_paid, msoa_income]
    builder: housing:price_to_income
    role: context
    caveats: Income is a model-based estimate for the wider area (MSOA), for 2022–23.

  - id: new_builds
    theme: housing
    label: Homes built since 2000
    description: Share of homes built in 2000 or later.
    unit: "% of homes"
    direction: higher_better
    sources: [voa_ctsop]
    builder: common:share
    params: {slug: voa_ctsop, numerator: [built_2000_on], denominator: dwellings}
    role: context

  - id: period_homes
    theme: housing
    label: Homes built before 1919
    description: Share of homes built before 1919.
    unit: "% of homes"
    direction: higher_better
    sources: [voa_ctsop]
    builder: common:share
    params: {slug: voa_ctsop, numerator: [built_pre_1919], denominator: dwellings}
    role: context

  - id: lower_band_homes
    theme: housing
    label: Homes in council tax bands A–B
    description: Share of homes in the two lowest council tax bands (the cheapest homes in 1991 values).
    unit: "% of homes"
    direction: higher_better
    sources: [voa_ctsop]
    builder: common:share
    params: {slug: voa_ctsop, numerator: [band_a, band_b], denominator: dwellings}
    role: context

  # -------------------------------------------------------------------- community
  - id: income_deprivation
    theme: community
    label: Income deprivation
    description: Share of residents on low incomes (income domain of the nation's deprivation index).
    unit: rate
    direction: lower_better
    benchmark: nation
    coverage: [E, W, S, N]
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks, wimd_2025_indicators, simd_2020_ranks, simd_2020_indicators, simd_postcode_lookup, nrs_oa22_population, nimdm_2017, osni_soa01_boundaries]
    builder: common:deprivation
    params: {column: income_score}
    overlap_group: income_work
    caveats: In Wales the rate is WIMD 2025's "people in income deprivation" indicator (StatsWales), the measure behind the domain score.

  - id: employment_deprivation
    theme: community
    label: Employment deprivation
    description: Share of working-age residents involuntarily out of work (employment domain of the nation's deprivation index).
    unit: rate
    direction: lower_better
    benchmark: nation
    coverage: [E, W, S, N, I]
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks, wimd_2025_indicators, simd_2020_ranks, simd_2020_indicators, simd_postcode_lookup, nrs_oa22_population, nimdm_2017, osni_soa01_boundaries, pobal_hp_2022, cso_sa22_boundaries]
    builder: common:deprivation
    params: {column: employment_score}
    role: context
    overlap_group: income_work
    caveats: In Wales the rate is WIMD 2025's "working age people in employment deprivation" indicator (StatsWales), the measure behind the domain score.

  - id: claimant_rate
    theme: community
    label: Claimant rate
    description: Residents claiming unemployment-related benefits, as a share of those aged 16–64 (latest month).
    unit: "% of 16–64s"
    direction: lower_better
    sources: [claimant_count, census_ts007a]
    builder: community:claimant_rate
    log1p: true
    role: context
    overlap_group: income_work
    caveats: Not scored because it tracks IoD income deprivation closely (ρ≈0.9), but it is far more recent (monthly). Includes Universal Credit claimants in low-paid work who must look for more.

  - id: household_income
    theme: community
    label: Household income
    description: Mean net household income in the wider area (MSOA), before housing costs.
    unit: £ a year
    direction: higher_better
    sources: [msoa_income]
    builder: housing:msoa_income
    params: {column: income_net}
    role: context
    overlap_group: income_work

  - id: pobal_deprivation
    theme: community
    label: Affluence and deprivation (Pobal HP index)
    description: The Pobal HP relative deprivation index of the Electoral Division from Census 2022 (unemployment, education, social class, lone parents, tenure and overcrowding), higher meaning more affluent; a Small Area takes its division's value.
    unit: score
    direction: higher_better
    benchmark: nation
    coverage: [I]
    sources: [pobal_hp_2022, cso_sa22_boundaries]
    builder: common:deprivation
    params: {column: pobal_index}
    normalise: rank
    substitute_for: [income_deprivation]
    caveats: Published for Electoral Divisions (about 1,500 people); the Small Area version is licensed. Stands in for the income deprivation share, which Ireland does not publish below county level.

  - id: health_deprivation
    theme: community
    label: Health and disability
    description: Premature death, illness and disability (health and disability domain of the nation's deprivation index).
    unit: score
    direction: lower_better
    benchmark: nation
    coverage: [E, W, S, N]
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks, simd_2020_ranks, simd_2020_indicators, simd_postcode_lookup, nrs_oa22_population, nimdm_2017, osni_soa01_boundaries]
    builder: common:deprivation
    params: {column: health_score}
    overlap_group: population_health
    caveats: Built to account for age, unlike self-reported health, which flatters areas of young adults.

  - id: life_expectancy
    theme: community
    label: Life expectancy
    description: Life expectancy at birth in the wider area (MSOA), the mean of men and women, 2019–23.
    unit: years
    direction: higher_better
    sources: [life_expectancy]
    builder: common:msoa
    params: {slug: life_expectancy, column: le_mean}
    role: context
    overlap_group: population_health
    caveats: Shown, not scored, because IoD's health domain (scored) measures much the same at a finer scale.

  - id: good_health
    theme: community
    label: Good health (self-reported)
    description: Residents describing their health as good or very good (Census 2021; Census 2022 in Scotland).
    unit: "%"
    direction: higher_better
    coverage: [E, W, S]
    sources: [census_ts037, scotland_census_2022]
    builder: community:census_share
    params: {table: census_ts037, numerator: [very_good_health, good_health]}
    role: context
    overlap_group: population_health
    caveats: Not adjusted for age, so student areas look healthiest.

  - id: imd
    theme: community
    label: Index of multiple deprivation
    description: Overall deprivation score; not scored because its domains overlap other indicators. In Ireland it is Pobal's HP index with its sign flipped, so higher means more deprived there too.
    unit: score
    direction: lower_better
    benchmark: nation
    coverage: [E, W, S, N, I]
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks, simd_2020_ranks, simd_2020_indicators, simd_postcode_lookup, nrs_oa22_population, nimdm_2017, osni_soa01_boundaries, pobal_hp_2022, cso_sa22_boundaries]
    builder: common:deprivation
    params: {column: imd_score}
    role: context

  - id: population_density
    theme: community
    label: Population density
    description: Residents per square kilometre (Census 2021; Census 2022 in Scotland).
    unit: people per km²
    direction: lower_better
    coverage: [E, W, S, N]
    sources: [census_ts006, scotland_census_2022, sg_dz22_boundaries, nisra_census_2021_p1]
    builder: common:column
    params: {slug: census_ts006, column: persons_per_square_kilometre}
    role: context

  - id: households_with_children
    theme: community
    label: Households with dependent children
    description: Share of households with dependent children (Census 2021; Census 2022 in Scotland).
    unit: "%"
    direction: higher_better
    coverage: [E, W, S]
    sources: [census_ts003, scotland_census_2022]
    builder: community:census_share
    params:
      table: census_ts003
      numerator:
        - single_family_household_married_or_civil_partnership_couple_dependent_children
        - single_family_household_cohabiting_couple_family_with_dependent_children
        - single_family_household_lone_parent_family_with_dependent_children
        - other_household_types_with_dependent_children
    role: context

  - id: aged_65_plus
    theme: community
    label: Residents aged 65 and over
    description: Share of residents aged 65 or over (Census 2021; Census 2022 in Scotland).
    unit: "%"
    direction: higher_better
    coverage: [E, W, S, N]
    sources: [census_ts007a, scotland_census_2022, nisra_census_2021_p1]
    builder: community:census_share
    params:
      table: census_ts007a
      numerator: [aged_65_to_69_years, aged_70_to_74_years, aged_75_to_79_years, aged_80_to_84_years, aged_85_years_and_over]
    role: context

  - id: owner_occupied
    theme: community
    label: Owner-occupied homes
    description: Share of households that own their home outright or with a mortgage (Census 2021; Census 2022 in Scotland).
    unit: "%"
    direction: higher_better
    coverage: [E, W, S]
    sources: [census_ts054, scotland_census_2022]
    builder: community:census_share
    params: {table: census_ts054, numerator: [owned]}
    role: context

  - id: no_car
    theme: community
    label: Households without a car
    description: Share of households with no car or van (Census 2021; Census 2022 in Scotland).
    unit: "%"
    direction: higher_better
    coverage: [E, W, S]
    sources: [census_ts045, scotland_census_2022]
    builder: community:census_share
    params: {table: census_ts045, numerator: [no_cars_or_vans_in_household]}
    role: context

  - id: sustainable_commute
    theme: community
    label: Walk, cycle or public transport to work
    description: Share of workers commuting on foot, by bike or by public transport (Census 2021, during COVID-19 restrictions; Census 2022 in Scotland).
    unit: "%"
    direction: higher_better
    coverage: [E, W, S]
    sources: [census_ts061, scotland_census_2022]
    builder: community:census_share
    params:
      table: census_ts061
      numerator: [underground_metro_light_rail_tram, train, bus_minibus_or_coach, bicycle, on_foot]
    role: context

  # ---------------------------------------------------------------------- climate
  # HadUK-Grid 1km thirty-year averages 1991–2020, sampled at homes (stage/climate.py).
  # Thresholds are provisional until the first four-nation build sets them from the
  # 10th and 90th percentiles of areas (#122).
  - id: sunshine
    theme: climate
    label: Sunshine
    description: Hours of bright sunshine a year, averaged over 1991–2020 (HadUK-Grid, 1km).
    unit: hours a year
    direction: higher_better
    sources: [haduk_grid, nspl]
    builder: environment:optional_column
    params: {slug: climate, column: sunshine_hours}
    normalise: threshold
    good: 1750
    bad: 1250
    weight: 1.0
    caveats: A 1km grid interpolated from sunshine recorders, so hills and coasts are smoothed; thirty-year averages say what is usual, not what any year brought.

  - id: wet_days
    theme: climate
    label: Wet days
    description: Days a year with at least 1mm of rain, averaged over 1991–2020.
    unit: days a year
    direction: lower_better
    sources: [haduk_grid, nspl]
    builder: environment:optional_column
    params: {slug: climate, column: rain_days}
    normalise: threshold
    good: 120
    bad: 200
    weight: 1.0
    overlap_group: rain
    caveats: Counts days, not amounts, so a drizzly place reads wetter than one with the same rainfall in fewer downpours; rainfall in millimetres is shown beside it.

  - id: summer_warmth
    theme: climate
    label: Summer warmth
    description: Mean daily maximum temperature in June to August, averaged over 1991–2020 (°C).
    unit: °C
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [haduk_grid, nspl, met_eireann_temp_9120, te_buildings]
    builder: environment:optional_column
    params: {slug: climate, column: summer_tmax}
    normalise: threshold
    good: 21
    bad: 16
    weight: 0.75
    overlap_group: summer
    caveats: Warmer counts as better here; the days above 25°C are shown beside it for anyone who would rather not have them.

  - id: winter_mildness
    theme: climate
    label: Winter mildness
    description: Mean daily minimum temperature in December to February, averaged over 1991–2020 (°C).
    unit: °C
    direction: higher_better
    coverage: [E, W, S, N, I]
    sources: [haduk_grid, nspl, met_eireann_temp_9120, te_buildings]
    builder: environment:optional_column
    params: {slug: climate, column: winter_tmin}
    normalise: threshold
    good: 3
    bad: 0
    weight: 0.75
    overlap_group: winter
    caveats: Night-time lows, which drive frost and heating bills; coasts and cities read milder than the hills behind them.

  - id: rainfall_total
    theme: climate
    label: Annual rainfall
    description: Average rainfall a year, 1991–2020, from Met Éireann's 1 km grid; stands in for wet days, which Met Éireann publishes no grid of.
    unit: mm a year
    direction: lower_better
    coverage: [I]
    sources: [met_eireann_rr_9120, te_buildings]
    builder: environment:optional_column
    params: {slug: climate, column: rainfall_mm}
    normalise: threshold
    good: 800
    bad: 1600
    overlap_group: rain
    substitute_for: [wet_days]
    caveats: Total rainfall, not how often it rains; the thresholds follow the UK wet-day ones (120 and 200 days correspond to about 800 and 1,600 mm across the UK grid).

  - id: rainfall
    theme: climate
    label: Rainfall
    description: Rainfall a year in millimetres, averaged over 1991–2020.
    unit: mm a year
    direction: lower_better
    coverage: [E, W, S, N, I]
    sources: [haduk_grid, nspl, met_eireann_rr_9120, te_buildings]
    builder: environment:optional_column
    params: {slug: climate, column: rainfall_mm}
    role: context
    overlap_group: rain

  - id: air_frost_days
    theme: climate
    label: Days of air frost
    description: Days a year when the air temperature falls below 0°C, averaged over 1991–2020.
    unit: days a year
    direction: lower_better
    sources: [haduk_grid, nspl]
    builder: environment:optional_column
    params: {slug: climate, column: air_frost_days}
    role: context
    overlap_group: winter

  - id: summer_days
    theme: climate
    label: Summer days
    description: Days a year when the temperature reaches 25°C, averaged over 1991–2020.
    unit: days a year
    direction: higher_better
    sources: [haduk_grid, nspl]
