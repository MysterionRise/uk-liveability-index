# Indicator catalogue, validated by lix_core.config.IndicatorCatalogue.
#
# Each indicator is built per England LSOA by `builder` (a function under
# lix_pipeline.indicators) and normalised to a 0–100 score where higher is better:
# `rank` (England percentile, the default), `scale` (its own 0–1 or 0–100 scale) or
# `threshold` (100 at `good` or better, 0 at `bad` or worse; log scale with log1p).
# role: scored (in the composite) · context (shown, not scored) · diagnostic (QA and
# imputation only). Within an overlap_group at most one indicator is scored, so the
# same thing is never counted twice (e.g. IoD's crime domain vs police.uk rates).
# The method is written up in docs/methodology.md.

themes:
  safety:
    label: Safety
    description: Recorded crime and anti-social behaviour where people live.
  environment:
    label: Environment
    description: Clean air, quiet streets, trees and green space nearby, and flood risk.
  health:
    label: Health services
    description: How easily residents can see a GP, pharmacist or dentist.
  education:
    label: Schools & childcare
    description: Good schools and nurseries within reach.
  transport:
    label: Transport & connectivity
    description: How well an area connects to jobs and services by every mode, and its broadband.
  amenities:
    label: Amenities & nightlife
    description: Shops, cafés, well-run pubs, leisure and culture nearby.
  housing:
    label: Housing & affordability
    description: What homes cost and the condition of the housing stock.
  community:
    label: Community & wellbeing
    description: Income, work and health of the people who live there.

indicators:

  # ----------------------------------------------------------------------- safety
  - id: crime_violence
    theme: safety
    label: Violent and sexual offences
    description: Recorded violence and sexual offences per 1,000 residents a year (36-month average).
    unit: per 1,000 residents a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # iod_2025 only imputes Greater Manchester
    sources: [police_crime, iod_2025]
    builder: safety:crime_rate
    params: {types: ["Violence and sexual offences"]}
    log1p: true
    weight: 1.5
    caveats: Rates use residents as the denominator, so town centres with few residents and many visitors score badly. Greater Manchester Police publishes no data; its area is estimated from IoD 2025's crime domain.
    overlap_group: violence_disorder

  - id: crime_burglary
    theme: safety
    label: Burglary
    description: Recorded burglaries per 1,000 residents a year.
    unit: per 1,000 residents a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # iod_2025 only imputes Greater Manchester
    sources: [police_crime, iod_2025]
    builder: safety:crime_rate
    params: {types: ["Burglary"]}
    log1p: true

  - id: crime_asb
    theme: safety
    label: Anti-social behaviour
    description: Reported anti-social behaviour incidents per 1,000 residents a year.
    unit: per 1,000 residents a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # iod_2025 only imputes Greater Manchester
    sources: [police_crime, iod_2025]
    builder: safety:crime_rate
    params: {types: ["Anti-social behaviour"]}
    log1p: true

  - id: crime_theft
    theme: safety
    label: Robbery, theft and vehicle crime
    description: Robbery, theft from the person, vehicle crime and bicycle theft per 1,000 residents a year.
    unit: per 1,000 residents a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # iod_2025 only imputes Greater Manchester
    sources: [police_crime, iod_2025]
    builder: safety:crime_rate
    params: {types: ["Robbery", "Theft from the person", "Vehicle crime", "Bicycle theft"]}
    log1p: true

  - id: crime_damage_disorder
    theme: safety
    label: Criminal damage and public order
    description: Criminal damage, arson and public order offences per 1,000 residents a year.
    unit: per 1,000 residents a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # iod_2025 only imputes Greater Manchester
    sources: [police_crime, iod_2025]
    builder: safety:crime_rate
    params: {types: ["Criminal damage and arson", "Public order"]}
    log1p: true
    role: context
    overlap_group: violence_disorder

  - id: road_danger
    theme: safety
    label: Serious road collisions nearby
    description: Road collisions in which someone was killed or seriously injured within 500m of homes, per year (5-year average).
    unit: collisions a year within 500m
    direction: lower_better
    sources: [stats19, nspl]
    builder: common:count_within
    params: {slug: stats19, column: severity, values: [fatal, serious], radius_m: 500, per_years: 5}
    log1p: true
    weight: 0.75
    caveats: Busy roads near homes raise the count whoever was involved. Police forces moved to a new injury-reporting system at different times, which records more injuries as serious.

  - id: iod_crime
    theme: safety
    label: IoD 2025 crime domain score
    description: Modelled risk of personal and material victimisation (2021–2023 data).
    unit: score
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # IoD in England, WIMD in Wales (see stage/deprivation.py)
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks]
    builder: common:deprivation
    params: {column: crime_score}
    role: diagnostic
    overlap_group: crime

  # ------------------------------------------------------------------ environment
  - id: no2
    theme: environment
    label: Nitrogen dioxide (NO₂)
    description: Annual mean background NO₂ where residents live (Defra 1km model).
    unit: µg/m³
    direction: lower_better
    sources: [defra_pcm_no2, nspl]
    builder: environment:pcm
    params: {slug: defra_pcm_no2}
    normalise: threshold
    good: 10   # WHO annual guideline
    bad: 30
    overlap_group: air_quality_no2
    caveats: Background concentrations; roadside levels on busy streets are higher. WHO guideline is 10 µg/m³.

  - id: pm25
    theme: environment
    label: Fine particles (PM2.5)
    description: Annual mean background PM2.5 where residents live (Defra 1km model).
    unit: µg/m³
    direction: lower_better
    sources: [defra_pcm_pm25, nspl]
    builder: environment:pcm
    params: {slug: defra_pcm_pm25}
    normalise: threshold
    good: 5    # WHO annual guideline
    bad: 12
    caveats: WHO guideline is 5 µg/m³.

  - id: green_space_access
    theme: environment
    label: Parks and green spaces nearby
    description: Entrances to public parks, gardens and playing fields within a 1km walk, weighted by distance.
    unit: index 0–1
    direction: higher_better
    sources: [os_greenspace, nspl]
    builder: common:access
    params: {slug: os_greenspace, column: function, values: [Public Park Or Garden, Playing Field], radius_m: 1000, cap: 10}
    normalise: scale
    weight: 0.75
    caveats: Counts public parks and playing fields, not open countryside, so villages surrounded by fields and footpaths score lower than they feel.

  - id: play_spaces
    theme: environment
    label: Play areas nearby
    description: Entrances to public play spaces within 800m of homes, weighted by distance.
    unit: index 0–1
    direction: higher_better
    sources: [os_greenspace, nspl]
    builder: common:access
    params: {slug: os_greenspace, column: function, values: [Play Space], radius_m: 800, cap: 5}
    normalise: scale
    role: context

  - id: flood_risk
    theme: environment
    label: Homes at risk of flooding
    description: Share of homes at high or medium risk of flooding from rivers, the sea or surface water (at least a 1% chance a year).
    unit: "% of homes"
    direction: lower_better
    coverage: [E, W]  # EA postcode counts in England, NRW risk areas in Wales
    sources: [ea_flood_postcode_tool, nrw_fraw_rivers, nrw_fraw_sea, nrw_fraw_surface_water, os_open_uprn, voa_ctsop, nspl]
    builder: environment:flood_risk
    params: {bands: [high, medium], prefix: any}
    normalise: threshold
    good: 0
    bad: 25
    overlap_group: flooding
    caveats: Each home is rated by the higher of the rivers-and-sea and surface-water assessments, which allow for flood defences; groundwater and sewer flooding are not included. England's counts are addresses, so shops on a flood-prone high street count too. In Wales, NRW publishes risk areas rather than counts, so homes at risk are estimated from the share of an area's property points inside the high and medium areas.

  - id: flood_rivers_sea
    theme: environment
    label: Homes at risk from rivers or the sea
    description: Share of homes at high or medium risk of flooding from rivers or the sea alone (at least a 1% chance a year).
    unit: "% of homes"
    direction: lower_better
    coverage: [E, W]
    sources: [ea_flood_postcodes, nrw_fraw_rivers, nrw_fraw_sea, os_open_uprn, voa_ctsop, nspl]
    builder: environment:flood_risk
    params: {bands: [high, medium], prefix: res}
    normalise: threshold
    good: 0
    bad: 25
    role: context
    overlap_group: flooding
    caveats: The part of flood risk that comes from rivers and the sea; surface water is the rest. Flood defences are taken into account.

  - id: road_rail_noise
    theme: environment
    label: Homes in road or rail noise
    description: Share of homes where road or rail noise averages 60 dB Lden or more over the day, evening and night, from the strategic noise maps.
    unit: "% of homes"
    direction: lower_better
    coverage: [E, W]
    sources: [defra_noise_road_lden, defra_noise_rail_lden, wg_noise_road_lden, wg_noise_rail_lden, nspl]
    builder: environment:percent
    params: {slug: noise, column: share_any_60}
    normalise: threshold
    good: 0
    bad: 40
    caveats: Each home is read from the 10m noise grid at its postcode. England's maps cover every road inside the larger towns and cities and only major roads elsewhere, while Wales's cover every road, so the cut-off is 60 dB Lden, a busy road's level, rather than the 55 dB at which the Environmental Noise Directive counts people as exposed and at which ordinary streets would count only where they were mapped. Aircraft and industry are not included.

  - id: tree_canopy
    theme: environment
    label: Tree cover around homes
    description: Share of the land within 500m of homes that satellite land cover classes as tree cover (ESA WorldCover, 10m).
    unit: "%"
    direction: higher_better
    sources: [esa_worldcover, nspl]
    builder: common:column
    params: {slug: tree_cover, column: canopy_pct}
    normalise: threshold
    good: 40   # a well-treed suburb; the national median around homes is about 30
    bad: 5
    weight: 0.75
    caveats: A 10m cell counts as tree cover when trees dominate it, so this reads roughly twice Forest Research's canopy survey (which samples points) while ranking wards much the same; single garden trees and hedges are missed. Water and unmapped cells are left out of the land total, so a seafront home is judged on the land behind it.

  - id: light_pollution
    theme: environment
    label: Night-time light
    description: Average night-time radiance within 1km of homes, from the VIIRS satellite annual composite (nW/cm²/sr).
    unit: nW/cm²/sr
    direction: lower_better
    sources: [viirs_vnl, nspl]
    builder: environment:optional_column
    params: {slug: night_lights, column: radiance}
    role: context
    caveats: Brighter means more street and building lighting and so less of a view of the night sky; it tracks density and cuts both ways, which is why it is shown but not scored. The satellite is blind to the blue part of LED light, so newly converted streets read darker than they look.

  - id: iod_outdoors
    theme: environment
    label: IoD 2025 outdoor living environment
    description: Air quality and road traffic accidents (IoD 2025 sub-domain).
    unit: score
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # IoD in England, WIMD in Wales (see stage/deprivation.py)
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks]
    builder: common:deprivation
    params: {column: outdoors_score}
    role: diagnostic

  # ----------------------------------------------------------------------- health
  - id: gp_distance
    theme: health
    label: Distance to nearest GP practice
    description: Average straight-line distance from homes to the nearest GP practice.
    unit: metres
    direction: lower_better
    sources: [ods_gp, nspl]
    builder: health:nearest_gp
    normalise: threshold
    good: 1000
    bad: 8000
    log1p: true

  - id: patients_per_gp
    theme: health
    label: Patients per GP
    description: Registered patients per full-time-equivalent qualified GP at the practices residents actually use.
    unit: patients per FTE GP
    direction: lower_better
    benchmark: nation
    sources: [gp_registrations, gp_workforce]
    builder: health:patients_per_gp
    normalise: threshold
    good: 1500
    bad: 3500
    caveats: Excludes GPs in training; practices reporting under one full-time GP are left out of the average.

  - id: gp_quality
    theme: health
    label: GP practice ratings
    description: CQC ratings of the GP practices residents are registered with, weighted by how many use each.
    unit: rating 0–1 (Good = 0.75)
    direction: higher_better
    benchmark: nation
    sources: [cqc_locations, gp_registrations]
    builder: health:gp_quality
    normalise: threshold
    good: 0.9
    bad: 0.4
    weight: 0.75
    caveats: Most practices are rated Good, and some ratings are several years old.

  - id: care_homes
    theme: health
    label: Well-rated care homes nearby
    description: Beds in care homes rated Good or Outstanding by CQC within 5km, weighted by distance.
    unit: index 0–1
    direction: higher_better
    sources: [cqc_locations, nspl]
    builder: health:care_homes
    params: {radius_m: 5000, cap: 10}
    normalise: scale
    role: context

  - id: pharmacy_distance
    theme: health
    label: Distance to nearest pharmacy
    description: Average straight-line distance from homes to the nearest NHS community pharmacy.
    unit: metres
    direction: lower_better
    coverage: [E, W]  # NHSBSA in England, OpenStreetMap in Wales
    sources: [nhsbsa_pharmacies, osm_wales, nspl]
    builder: common:nearest
    params: {slug: pharmacies}
    normalise: threshold
    good: 1000
    bad: 8000
    log1p: true
    weight: 0.75
    caveats: Rural GP practices that dispense medicines themselves aren't counted. Welsh pharmacies come from OpenStreetMap, since NWSSP's list is not machine-readable.

  - id: dentist_distance
    theme: health
    label: Distance to nearest NHS dentist
    description: Average straight-line distance from homes to the nearest dental practice with an NHS contract.
    unit: metres
    direction: lower_better
    sources: [ods_dentists, nspl]
    builder: common:nearest
    params: {slug: ods_dentists}
    normalise: threshold
    good: 1500
    bad: 10000
    log1p: true
    weight: 0.5
    caveats: Whether a practice takes new NHS patients isn't published as open data.

  # -------------------------------------------------------------------- education
  - id: primary_school_quality
    theme: education
    label: Good primary schools nearby
    description: Quality of the three nearest state primary schools (Ofsted and results), nearer ones counting more.
    unit: quality 0–1
    direction: higher_better
    benchmark: nation
    coverage: [E]  # Wales publishes no primary results or grades
    sources: [gias, ofsted_schools, ks2_results, nspl]
    builder: education:school_quality_nearby
    params: {phases: [Primary, All-through, Middle deemed primary], results_slug: ks2_results, results_column: ks2_rwm_pct, k: 3, sigma_m: 1500, max_m: 5000}
    normalise: threshold
    good: 0.8
    bad: 0.4
    weight: 1.5
    caveats: Quality blends Ofsted (60%) and key stage 2 results as a percentile (40%); results reflect intake as well as teaching. Distance isn't admission; oversubscribed schools admit by catchment or faith. Not available in Wales, which publishes no primary school results or inspection grades.

  - id: secondary_school_quality
    theme: education
    label: Good secondary schools nearby
    description: Quality of the three nearest state secondary schools (Ofsted and results), nearer ones counting more.
    unit: quality 0–1
    direction: higher_better
    benchmark: nation
    coverage: [E, W]  # Wales: the authority's Capped 9 score, broadcast
    sources: [gias, wg_schools, ofsted_schools, ks4_results, wg_ks4_la, nspl]
    builder: education:school_quality_nearby
    params: {phases: [Secondary, All-through, Middle deemed secondary], results_slug: ks4_results, results_column: attainment8, k: 3, sigma_m: 4000, max_m: 15000, la_results_slug: wg_ks4_la, la_results_column: capped9}
    normalise: threshold
    good: 0.8
    bad: 0.4
    weight: 1.5
    caveats: Quality blends Ofsted (60%) and Attainment 8 as a percentile (40%); Progress 8 isn't published for 2024/25. In Wales, where no per-school results or inspection grades are published, the local authority's Capped 9 points score stands in for every school in it (flagged broadcast_lad).

  - id: school_choice
    theme: education
    label: Choice of good schools
    description: Good state primaries within 2km and secondaries within 5km, weighted by quality and distance.
    unit: index 0–1
    direction: higher_better
    benchmark: nation
    coverage: [E, W]  # Welsh schools count as present but ungraded
    sources: [gias, wg_schools, ofsted_schools, nspl]
    builder: education:school_choice
    params: {cap: 4}
    normalise: scale
    weight: 0.5

  - id: primary_results
    theme: education
    label: Primary school results nearby
    description: Share of pupils meeting the expected standard in reading, writing and maths at state primaries within 2km (3-year average), weighted by distance.
    unit: "% of pupils"
    direction: higher_better
    benchmark: nation
    sources: [ks2_results, gias, nspl]
    builder: education:school_results
    params: {slug: ks2_results, column: ks2_rwm_pct, phases: [Primary, All-through, Middle deemed primary], radius_m: 2000}
    role: context
    caveats: Results reflect pupils' backgrounds as well as teaching; progress measures aren't published for 2024/25.

  - id: secondary_results
    theme: education
    label: Secondary school results nearby
    description: Average Attainment 8 score at state secondaries within 5km, weighted by distance.
    unit: Attainment 8
    direction: higher_better
    benchmark: nation
    sources: [ks4_results, gias, nspl]
    builder: education:school_results
    params: {slug: ks4_results, column: attainment8, phases: [Secondary, All-through, Middle deemed secondary], radius_m: 5000}
    role: context
    caveats: Results reflect pupils' backgrounds as well as teaching; Progress 8 isn't published for 2024/25 and 2025/26.

  - id: nursery_access
    theme: education
    label: Good nurseries nearby
    description: Nurseries, pre-schools and school nursery classes within 1km, each weighted by its Ofsted grade and distance.
    unit: index 0–1
    direction: higher_better
    coverage: [E, W]  # Ofsted in England, OpenStreetMap nurseries in Wales
    sources: [ofsted_childcare, osm_wales, gias, wg_schools, nspl]
    builder: education:nursery_access
    params: {radius_m: 1000, cap: 3}
    normalise: scale
    caveats: Childminders aren't located (Ofsted withholds their addresses). In Wales nurseries come from OpenStreetMap (CIW publishes no provider list) and count as average quality; school nursery classes are included from the Welsh schools list.

  # -------------------------------------------------------------------- transport
  - id: connectivity_overall
    theme: transport
    label: Overall connectivity
    description: DfT connectivity score across all modes and destinations.
    unit: score 0–100
    direction: higher_better
    sources: [dft_connectivity]
    builder: common:column
    params: {slug: dft_connectivity, column: tcm_overall}
    # Full marks at a typical suburb's connectivity (75): beyond that, more doesn't count
    normalise: threshold
    good: 75
    bad: 0
    weight: 1.5
    overlap_group: connectivity

  - id: connectivity_public_transport
    theme: transport
    label: Public transport connectivity
    description: DfT connectivity score for public transport to all destinations.
    unit: score 0–100
    direction: higher_better
    sources: [dft_connectivity]
    builder: common:column
    params: {slug: dft_connectivity, column: tcm_overall_public_transport}
    normalise: scale
    scale_max: 100
    role: context
    overlap_group: connectivity

  - id: connectivity_walking
    theme: transport
    label: Walkability
    description: DfT connectivity score for walking to all destinations.
    unit: score 0–100
    direction: higher_better
    sources: [dft_connectivity]
    builder: common:column
    params: {slug: dft_connectivity, column: tcm_overall_walking}
    normalise: scale
    scale_max: 100
    role: context
    overlap_group: connectivity

  - id: connectivity_cycling
    theme: transport
    label: Cycling connectivity
    description: DfT connectivity score for cycling to all destinations.
    unit: score 0–100
    direction: higher_better
    sources: [dft_connectivity]
    builder: common:column
    params: {slug: dft_connectivity, column: tcm_overall_cycling}
    normalise: scale
    scale_max: 100
    weight: 0.5
    role: context
    overlap_group: connectivity

  - id: station_distance
    theme: transport
    label: Distance to nearest station
    description: Average straight-line distance from homes to the nearest railway, metro or tram stop.
    unit: metres
    direction: lower_better
    sources: [naptan, nspl]
    builder: common:nearest
    params: {slug: naptan, column: mode, values: [rail, metro_tram]}
    normalise: threshold
    good: 800
    bad: 10000
    log1p: true
    weight: 0.75

  - id: bus_frequency
    theme: transport
    label: Bus frequency
    description: Buses an hour (weekdays, 07:00–19:00) at the busiest stop within 400m of homes.
    unit: buses an hour
    direction: higher_better
    coverage: [E, W]
    sources: [bods_gtfs, bods_gtfs_wales, nspl]
    builder: common:nearby_max
    params: {slug: bods_gtfs, column: per_hour, radius_m: 400}
    normalise: threshold
    good: 12
    bad: 0
    log1p: true
    role: context
    overlap_group: connectivity
    caveats: Timetabled buses on a normal Tuesday. Shown, not scored, because DfT's connectivity score (scored) already covers bus access (ρ ≈ 0.82).

  - id: gigabit_broadband
    theme: transport
    label: Gigabit broadband
    description: Share of homes that can get gigabit-capable broadband (full fibre or cable).
    unit: "% of homes"
    direction: higher_better
    sources: [ofcom_broadband]
    builder: common:column
    params: {slug: ofcom_broadband, column: gigabit_pct}
    normalise: scale
    scale_max: 100
    weight: 0.75

  - id: slow_broadband
    theme: transport
    label: Homes without decent broadband
    description: Share of homes that can't get 10 Mbit/s broadband from a fixed line or fixed wireless.
    unit: "% of homes"
    direction: lower_better
    sources: [ofcom_broadband]
    builder: common:column
    params: {slug: ofcom_broadband, column: below_uso_pct}
    role: context

  # -------------------------------------------------------------------- amenities
  - id: well_run_pubs
    theme: amenities
    label: Well-run pubs nearby
    description: Pubs within a 15-minute walk that hold a food hygiene rating of 4 or 5 from the last three years, weighted by distance, with a small bonus for real ale, food or outdoor seating.
    unit: index 0–1
    direction: higher_better
    coverage: [E, W]  # one OpenStreetMap extract per nation
    sources: [osm_england, osm_wales, overture_pubs, fsa_fhrs, nspl]
    builder: pubs:well_run_pub_access
    params: {radius_m: 1200, cap: 3}
    normalise: scale
    caveats: Hygiene ratings measure how well a pub is run, not the beer or the atmosphere.

  - id: food_and_drink
    theme: amenities
    label: Cafés and restaurants
    description: Cafés and restaurants within 800m, weighted by distance.
    unit: index 0–1
    direction: higher_better
    coverage: [E, W]  # one OpenStreetMap extract per nation
    sources: [osm_england, osm_wales, nspl]
    builder: amenities:osm_access
    params: {values: [cafe, restaurant], radius_m: 800, cap: 6}
    normalise: scale
    overlap_group: high_street

  - id: supermarket_distance
    theme: amenities
    label: Distance to nearest supermarket
    description: Average straight-line distance from homes to the nearest supermarket.
    unit: metres
    direction: lower_better
    coverage: [E, W]  # one OpenStreetMap extract per nation
    sources: [osm_england, osm_wales, nspl]
    builder: amenities:osm_nearest
    params: {values: [supermarket]}
    normalise: threshold
    good: 1000
    bad: 10000
    log1p: true

  - id: shops
    theme: amenities
    label: Shops nearby
    description: Shops of every kind within 800m, weighted by distance.
    unit: index 0–1
    direction: higher_better
    coverage: [E, W]  # one OpenStreetMap extract per nation
    sources: [osm_england, osm_wales, nspl]
    builder: amenities:osm_access
    params: {key: shop, radius_m: 800, cap: 30}
    normalise: scale
    weight: 0.75
    role: context
    overlap_group: high_street

  - id: leisure
    theme: amenities
    label: Sports and fitness facilities
    description: Sports halls, gyms, pools, studios, courts and pitches open to the public within 2km, weighted by distance.
    unit: index 0–1
    direction: higher_better
    sources: [active_places, nspl]
    builder: common:access
    # Sites rather than facilities would favour big centres less; facilities count choice
    params: {slug: active_places, radius_m: 2000, cap: 10}
    normalise: scale
    weight: 0.75

  - id: swimming_pool_distance
    theme: amenities
    label: Distance to nearest public pool
    description: Average straight-line distance from homes to the nearest swimming pool open to the public.
    unit: metres
    direction: lower_better
    sources: [active_places, nspl]
    builder: common:nearest
    params: {slug: active_places, column: type, values: [Swimming Pool]}
    role: context

  - id: culture
    theme: amenities
    label: Libraries, cinemas, theatres and museums
    description: Libraries, cinemas, theatres, arts centres, museums and galleries within 2km.
    unit: index 0–1
    direction: higher_better
    coverage: [E, W]  # one OpenStreetMap extract per nation
    sources: [osm_england, osm_wales, nspl]
    builder: amenities:osm_access
    params: {values: [library, cinema, theatre, arts_centre, museum, gallery], radius_m: 2000, cap: 3}
    normalise: scale
    weight: 0.75

  - id: fast_food
    theme: amenities
    label: Fast-food outlets nearby
    description: Fast-food outlets within 800m.
    unit: index 0–1
    direction: lower_better
    coverage: [E, W]  # one OpenStreetMap extract per nation
    sources: [osm_england, osm_wales, nspl]
    builder: amenities:osm_access
    params: {values: [fast_food], radius_m: 800, cap: 15}
    normalise: scale
    role: context

  - id: gambling
    theme: amenities
    label: Betting shops and casinos nearby
    description: Betting shops, gambling venues and casinos within 800m.
    unit: index 0–1
    direction: lower_better
    coverage: [E, W]  # one OpenStreetMap extract per nation
    sources: [osm_england, osm_wales, nspl]
    builder: amenities:osm_access
    params: {values: [gambling, casino, bookmaker, lottery], radius_m: 800, cap: 5}
    normalise: scale
    role: context

  # ---------------------------------------------------------------------- housing
  - id: house_price
    theme: housing
    label: Typical house price
    description: Median sale price over the last 12 months, steadied towards the surrounding area where sales are few.
    unit: £
    direction: lower_better
    benchmark: nation
    sources: [price_paid, nspl]
    builder: housing:median_price
    weight: 2.0
    caveats: Lower prices score as more affordable; the scale reflects price, not value.

  - id: housing_condition
    theme: housing
    label: Housing condition
    description: IoD 2025 indoors sub-domain (homes in poor condition or without central heating).
    unit: score
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # IoD in England, WIMD in Wales (see stage/deprivation.py)
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks]
    builder: common:deprivation
    params: {column: housing_score}

  - id: price_change
    theme: housing
    label: House price change
    description: Change in the median sale price, last 12 months against the 12 months before.
    unit: "%"
    direction: higher_better
    benchmark: nation
    sources: [price_paid]
    builder: common:column
    params: {slug: price_paid, column: yoy_change_pct}
    role: context
    caveats: Noisy where sales are few.

  - id: council_tax
    theme: housing
    label: Council tax (Band D)
    description: Annual council tax on a Band D home, including county, police, fire and average parish charges.
    unit: £ a year
    direction: lower_better
    benchmark: nation
    coverage: [E, W]
    sources: [council_tax, wg_council_tax]
    builder: housing:council_tax
    params: {band: d}
    weight: 0.5
    caveats: The same for every neighbourhood in a council area; a home's bill depends on its band. Welsh bands are derived from each authority's average band D using the statutory ratios.

  - id: price_to_income
    theme: housing
    label: Price to local income
    description: Typical house price divided by the area's mean net household income.
    unit: years of income
    direction: lower_better
    benchmark: nation
    sources: [price_paid, msoa_income]
    builder: housing:price_to_income
    role: context
    caveats: Income is a model-based estimate for the wider area (MSOA), for 2022–23.

  - id: new_builds
    theme: housing
    label: Homes built since 2000
    description: Share of homes built in 2000 or later.
    unit: "% of homes"
    direction: higher_better
    sources: [voa_ctsop]
    builder: common:share
    params: {slug: voa_ctsop, numerator: [built_2000_on], denominator: dwellings}
    role: context

  - id: period_homes
    theme: housing
    label: Homes built before 1919
    description: Share of homes built before 1919.
    unit: "% of homes"
    direction: higher_better
    sources: [voa_ctsop]
    builder: common:share
    params: {slug: voa_ctsop, numerator: [built_pre_1919], denominator: dwellings}
    role: context

  - id: lower_band_homes
    theme: housing
    label: Homes in council tax bands A–B
    description: Share of homes in the two lowest council tax bands (the cheapest homes in 1991 values).
    unit: "% of homes"
    direction: higher_better
    sources: [voa_ctsop]
    builder: common:share
    params: {slug: voa_ctsop, numerator: [band_a, band_b], denominator: dwellings}
    role: context

  # -------------------------------------------------------------------- community
  - id: income_deprivation
    theme: community
    label: Income deprivation
    description: Share of residents on low incomes (IoD 2025 income domain).
    unit: rate
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # IoD in England, WIMD in Wales (see stage/deprivation.py)
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks]
    builder: common:deprivation
    params: {column: income_score}
    overlap_group: income_work

  - id: employment_deprivation
    theme: community
    label: Employment deprivation
    description: Share of working-age residents involuntarily out of work (IoD 2025 employment domain).
    unit: rate
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # IoD in England, WIMD in Wales (see stage/deprivation.py)
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks]
    builder: common:deprivation
    params: {column: employment_score}
    role: context
    overlap_group: income_work

  - id: claimant_rate
    theme: community
    label: Claimant rate
    description: Residents claiming unemployment-related benefits, as a share of those aged 16–64 (latest month).
    unit: "% of 16–64s"
    direction: lower_better
    sources: [claimant_count, census_ts007a]
    builder: community:claimant_rate
    log1p: true
    role: context
    overlap_group: income_work
    caveats: Not scored because it tracks IoD income deprivation closely (ρ≈0.9), but it is far more recent (monthly). Includes Universal Credit claimants in low-paid work who must look for more.

  - id: household_income
    theme: community
    label: Household income
    description: Mean net household income in the wider area (MSOA), before housing costs.
    unit: £ a year
    direction: higher_better
    sources: [msoa_income]
    builder: housing:msoa_income
    params: {column: income_net}
    role: context
    overlap_group: income_work

  - id: health_deprivation
    theme: community
    label: Health and disability
    description: Premature death, illness and disability (IoD 2025 health deprivation and disability domain).
    unit: score
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # IoD in England, WIMD in Wales (see stage/deprivation.py)
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks]
    builder: common:deprivation
    params: {column: health_score}
    overlap_group: population_health
    caveats: Built to account for age, unlike self-reported health, which flatters areas of young adults.

  - id: life_expectancy
    theme: community
    label: Life expectancy
    description: Life expectancy at birth in the wider area (MSOA), the mean of men and women, 2019–23.
    unit: years
    direction: higher_better
    sources: [life_expectancy]
    builder: common:msoa
    params: {slug: life_expectancy, column: le_mean}
    role: context
    overlap_group: population_health
    caveats: Shown, not scored, because IoD's health domain (scored) measures much the same at a finer scale.

  - id: good_health
    theme: community
    label: Good health (self-reported)
    description: Residents describing their health as good or very good (Census 2021).
    unit: "%"
    direction: higher_better
    sources: [census_ts037]
    builder: community:census_share
    params: {table: census_ts037, numerator: [very_good_health, good_health]}
    role: context
    overlap_group: population_health
    caveats: Not adjusted for age, so student areas look healthiest.

  - id: imd
    theme: community
    label: Index of Multiple Deprivation 2025
    description: Overall deprivation score; not scored because its domains overlap other indicators.
    unit: score
    direction: lower_better
    benchmark: nation
    coverage: [E, W]  # IoD in England, WIMD in Wales (see stage/deprivation.py)
    sources: [iod_2025, wimd_2025_scores, wimd_2025_ranks]
    builder: common:deprivation
    params: {column: imd_score}
    role: context

  - id: population_density
    theme: community
    label: Population density
    description: Residents per square kilometre (Census 2021).
    unit: people per km²
    direction: lower_better
    sources: [census_ts006]
    builder: common:column
    params: {slug: census_ts006, column: persons_per_square_kilometre}
    role: context

  - id: households_with_children
    theme: community
    label: Households with dependent children
    description: Share of households with dependent children (Census 2021).
    unit: "%"
    direction: higher_better
    sources: [census_ts003]
    builder: community:census_share
    params:
      table: census_ts003
      numerator:
        - single_family_household_married_or_civil_partnership_couple_dependent_children
        - single_family_household_cohabiting_couple_family_with_dependent_children
        - single_family_household_lone_parent_family_with_dependent_children
        - other_household_types_with_dependent_children
    role: context

  - id: aged_65_plus
    theme: community
    label: Residents aged 65 and over
    description: Share of residents aged 65 or over (Census 2021).
    unit: "%"
    direction: higher_better
    sources: [census_ts007a]
    builder: community:census_share
    params:
      table: census_ts007a
      numerator: [aged_65_to_69_years, aged_70_to_74_years, aged_75_to_79_years, aged_80_to_84_years, aged_85_years_and_over]
    role: context

  - id: owner_occupied
    theme: community
    label: Owner-occupied homes
    description: Share of households that own their home outright or with a mortgage (Census 2021).
    unit: "%"
    direction: higher_better
    sources: [census_ts054]
    builder: community:census_share
    params: {table: census_ts054, numerator: [owned]}
    role: context

  - id: no_car
    theme: community
    label: Households without a car
    description: Share of households with no car or van (Census 2021).
    unit: "%"
    direction: higher_better
    sources: [census_ts045]
    builder: community:census_share
    params: {table: census_ts045, numerator: [no_cars_or_vans_in_household]}
    role: context

  - id: sustainable_commute
    theme: community
    label: Walk, cycle or public transport to work
    description: Share of workers commuting on foot, by bike or by public transport (Census 2021, during COVID-19 restrictions).
    unit: "%"
    direction: higher_better
    sources: [census_ts061]
    builder: community:census_share
    params:
      table: census_ts061
      numerator: [underground_metro_light_rail_tram, train, bus_minibus_or_coach, bicycle, on_foot]
    role: context
