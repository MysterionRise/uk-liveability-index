# Face-validity review: well-known places and what their scores should look like.
#
# `lix qa places` scores each place's neighbourhood (the MSOA its OS Open Names point
# sits in, population-weighted, default preset) and writes docs/validation.md.
# `anchor: true` checks are also run by `lix validate places` (part of `make validate`),
# so a data or method change that silently inverts them fails the build.
#
# level: msoa (default) or lsoa for a small place its MSOA would dilute
# lsoa: an exact LSOA, when the OS Open Names point isn't the part that's meant
# checks: theme (0–100 theme score), overall (0–100), indicator (raw value of an
# indicator, in its unit), flag (an indicator quality flag present in the area)
# ops: ge (>=), le (<=)

# What the review shows beyond the checks (written by hand; rendered into the page)
observations:
  - >-
    **Tree cover against Forest Research's canopy survey (v0.3.2).** The LSOA values,
    averaged over the postcodes of each English urban ward whose code still matches,
    correlate with Forest Research's point-sampled ward canopy cover at r = 0.72
    (Spearman 0.70, 1,444 wards). The level is about twice theirs (mean 30% against
    16%), as a 10m cell counts as tree cover when trees dominate it, so the thresholds
    (5% poor, 40% good) are on this scale and the indicator says "tree cover", not
    canopy.
  - >-
    **Wales joins the index (v0.3.0).** Welsh neighbourhoods are scored on the same
    indicators where the data are the same (distances, air, broadband, OpenStreetMap) and
    within Wales where they are not (crime, WIMD deprivation, prices, council tax). Theme
    scores are not built from identical parts in both nations: health in Wales lacks GP
    capacity and ratings (the Welsh median is higher), and education in Wales rests on
    each council's exam results and OpenStreetMap nurseries (the Welsh median is lower).
    Welsh users should read the within-nation percentiles; the gaps are listed in each
    profile as "not available in Wales".
  - >-
    **Density no longer piles up points (changed 8 Oct 2026).** Access measures now
    saturate at a typical suburb's level (fewer cafés, pubs and venues needed for full
    marks; DfT connectivity full at 75). Middlesbrough Central fell from 62 to 61 and
    Winchester East rose from 67 to 71, and larger rural areas moved from the 19th to
    the 34th percentile. Small villages still sit near the bottom (median 3rd–6th
    percentile): they genuinely lack nearby GPs, shops and buses, which the balanced
    preset weighs heavily; "compare like with like" ranks them against other villages.
  - >-
    **Schools are judged by the quality of the nearest, not their number (changed 8 Oct
    2026).** Each home gets the quality of its three nearest state schools (Ofsted 60%,
    results 40%), plus a small "choice" indicator. Education rose in Sidmouth (19 → 40)
    and Chipping Campden (17 → 41) and fell in Blackpool (63 → 29) and Middlesbrough
    (80 → 49), where nearby schools are many but weaker.
  - >-
    **Place points aren't always the part people mean.** OS Open Names puts "Jaywick" in
    a Clacton West LSOA, not the Jaywick Sands plotlands (England's most deprived LSOA),
    so a place search shows the neighbourhood around the named point.

places:
