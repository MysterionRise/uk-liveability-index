  # --------------------------------------------------------------------- Scotland
  # Scottish areas are benchmarked within Scotland for crime (the SIMD rate stands in for
  # the police.uk measures), deprivation, schools, prices and council tax; a few
  # indicators are not available in Scotland (flagged below)
  - name: Morningside
    local_authority: City of Edinburgh
    why: "Affluent south Edinburgh, cafés, Bruntsfield Links, good schools, expensive"
    checks:
      - {theme: amenities, op: ge, value: 50, anchor: true}  # the leafy Craighouse side of the IZ
      - {theme: community, op: ge, value: 60, anchor: true}
      - {theme: housing, op: le, value: 50}

  - name: Niddrie
    local_authority: City of Edinburgh
    why: "Among Edinburgh's most deprived neighbourhoods: homes well under the city's prices, many in poor condition"
    checks:
      - {theme: community, op: le, value: 35, anchor: true}
      - {indicator: house_price, op: le, value: 240000, anchor: true}  # Edinburgh's median is about £265k
      - {indicator: housing_condition, op: ge, value: 75}  # the SIMD housing domain (overcrowding, no central heating)
      - {flag: not_available, anchor: true}

  - name: Bearsden
    local_authority: East Dunbartonshire
    why: "Prosperous suburb north of Glasgow, low crime, strong schools"
    checks:
      - {theme: community, op: ge, value: 60, anchor: true}
      - {theme: safety, op: ge, value: 55, anchor: true}

