  night_noise: {label: Cartrefi mewn sŵn yn y nos, description: "Cyfran y cartrefi lle mae sŵn wedi'i fapio yn cyfartalu 50 dB Lnight neu fwy rhwng 23:00 a 07:00, y lefel y mae'r Gyfarwyddeb Sŵn Amgylcheddol yn cyfrif pobl fel rhai agored iddi yn y nos."}
  rail_service: {label: Gwasanaeth rheilffordd gerllaw, description: "Mynediadau ac allanfeydd blynyddol gorsafoedd (ORR) o fewn 2km i gartrefi, wedi'u pwysoli yn ôl pellter, fel bod gorsaf brysur gerllaw yn cyfrif mwy nag arhosfan."}
