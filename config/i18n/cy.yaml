# Cymraeg labels for the data: themes, indicators (label, unit, description), presets and
# the profile flags. English stays in indicators.yaml and weights.yaml; anything missing
# here falls back to it. `_meta.status` is "draft" until a fluent reviewer signs it off
# (see docs/i18n.md). Drafted with the TermCymru termbase in mind, 8 October 2026.
_meta: {status: draft, reviewer: null, date: 2026-10-08}

themes:
  safety: {label: Diogelwch, description: Troseddau ac ymddygiad gwrthgymdeithasol a gofnodwyd lle mae pobl yn byw.}
  environment: {label: Amgylchedd, description: "Aer glân, strydoedd tawel, coed a mannau gwyrdd gerllaw, a pherygl llifogydd."}
  health: {label: Gwasanaethau iechyd, description: "Pa mor hawdd yw hi i drigolion weld meddyg teulu, fferyllydd neu ddeintydd."}
  education: {label: Ysgolion a gofal plant, description: Ysgolion a meithrinfeydd da o fewn cyrraedd.}
  transport: {label: Trafnidiaeth a chysylltedd, description: "Pa mor dda mae ardal yn cysylltu â swyddi a gwasanaethau ym mhob dull, a'i band eang."}
  amenities: {label: Amwynderau a bywyd nos, description: "Siopau, caffis, tafarndai da, hamdden a diwylliant gerllaw."}
  housing: {label: Tai a fforddiadwyedd, description: Beth mae cartrefi'n ei gostio a chyflwr y stoc dai.}
  community: {label: Cymuned a lles, description: "Incwm, gwaith ac iechyd y bobl sy'n byw yno."}
  climate: {label: Hinsawdd, description: "Heulwen, glaw a pha mor gynnes yw'r haf a pha mor dyner yw'r gaeaf, o gyfartaleddau deng mlynedd ar hugain."}

presets:
  balanced: {label: Cytbwys, description: Mae pob thema'n cyfrif yn gyfartal.}
  family: {label: Teulu â phlant, description: "Ysgolion a meithrinfeydd da, diogelwch a mannau gwyrdd sy'n dod gyntaf."}
  young_professional: {label: Gweithiwr proffesiynol ifanc, description: "Cysylltiadau, pethau i'w gwneud a thafarndai da; mae ysgolion yn llai pwysig."}
  retiree: {label: Wedi ymddeol, description: "Diogelwch, gwasanaethau iechyd, aer glân, heulwen ac ardal dawelach."}
  commuter: {label: Cymudwr, description: "Cysylltiadau cyflym â swyddi, ar drafnidiaeth gyhoeddus yn anad dim."}

units:
  gbp: "£"
  gbp_year: "£ y flwyddyn"
  pct: "%"
  pct_homes: "% o gartrefi"
  pct_pupils: "% o ddisgyblion"
  pct_working_age: "% o rai 16–64 oed"
  metres: metrau
  km: km
  per_1000_year: "fesul 1,000 o drigolion y flwyddyn"
  score: sgôr
  score_100: "sgôr 0–100"
  ugm3: "µg/m³"
  index: "mynegai 0–1"
  quality: "ansawdd 0–1"
  rating: "sgôr 0–1 (Da = 0.75)"
  rate: cyfradd
  collisions_year: "gwrthdrawiadau y flwyddyn o fewn 500m"
  patients_per_gp: "cleifion fesul meddyg teulu cyfwerth ag amser llawn"
  attainment8: "Cyrhaeddiad 8"
  buses_hour: "bysiau yr awr"
  years_income: "blynyddoedd o incwm"
  years: blynyddoedd
  people_km2: "pobl fesul km²"
  per_km2: "y km²"
  radiance: "nW/cm²/sr"
  hours_year: "oriau y flwyddyn"
  days_year: "diwrnodau y flwyddyn"
  celsius: "°C"
  mm_year: "mm y flwyddyn"
  m_s: "m/s"
  within_1500m: "o fewn 1.5km"
  patients_per_practice: "cleifion fesul practis"
  km_per_km2: "km y km²"
  hectares: "hectarau"
  pct_slope: "% llethr"
  class4: "dosbarth 1–4 (4 = ardderchog)"
  class5: "dosbarth 1–5 (5 = uchel)"

flags:
  imputed: "Mae'r ffigurau troseddu yma'n amcangyfrifon: nid yw Heddlu Manceinion Fwyaf yn cyhoeddi data ar lefel stryd."
  low_n: "Ychydig o gartrefi a werthwyd yma yn y flwyddyn ddiwethaf, felly mae'r pris wedi'i sefydlogi tuag at yr ardal o gwmpas."
  broadcast_lad: "Mae ansawdd ysgolion uwchradd yn dod o ganlyniadau arholiadau'r cyngor cyfan, gan nad yw'r genedl hon yn cyhoeddi canlyniadau na graddau arolygu fesul ysgol."
  not_available: "Nid yw rhai dangosyddion ar gael yn y genedl hon eto; mae'r thema'n defnyddio'r rhai sydd ganddi."
  theme_gap: "Mae gan y genedl hon rhy ychydig o ddata agored ar gyfer un thema i'w sgorio: caiff ei dangos fel data cyfyngedig a'i gadael allan o'r cyfanswm."

indicators:
  recorded_crime: {label: Troseddau a gofnodwyd (SIMD), description: "Troseddau a gofnodwyd fesul 1,000 o drigolion y flwyddyn ym Mynegai Amddifadedd Lluosog yr Alban 2020, wedi'u trosglwyddo i barthau data 2022.", caveats: "Nid yw Heddlu'r Alban yn cyhoeddi data agored ar lefel stryd, felly mae cyfradd SIMD yn sefyll yn lle'r pedwar dangosydd troseddu; mae'n cwmpasu'r holl droseddau a gofnodwyd (trais, troseddau rhywiol, byrgleriaeth, fandaliaeth, cyffuriau ac ymosodiad cyffredin) ac mae'n hŷn na'r cyfnod police.uk a ddefnyddir mewn mannau eraill."}
  access_deprivation: {label: "Mynediad at wasanaethau (SIMD, NIMDM)", description: "Parth mynediad daearyddol Mynegai Amddifadedd Lluosog yr Alban 2020 (amseroedd gyrru a thrafnidiaeth gyhoeddus i feddygon teulu, ysgolion, siopau, swyddfeydd post a gorsafoedd petrol), wedi'i ddwyn i barthau data 2022.", caveats: "Yn sefyll yn lle mesur cysylltedd yr Adran Drafnidiaeth, sy'n cwmpasu Lloegr a Chymru yn unig; sgôr yn seiliedig ar safle o fewn yr Alban ydyw, felly mae'n dweud sut mae ardal yn cymharu â gweddill yr Alban."}
  noise_exposure: {label: Cartrefi mewn sŵn trafnidiaeth neu ddiwydiant, description: "Cyfran y cartrefi lle mae'r sŵn a fapiwyd yn cyfartalu 60 dB Lden neu fwy (ffyrdd, rheilffyrdd ac awyrennau yn Lloegr; ffyrdd, rheilffyrdd a diwydiant yng Nghymru; pob ffynhonnell a fapiwyd yn yr Alban, Gogledd Iwerddon ac Iwerddon).", caveats: "Cymerir gwerth pob cartref o'r grid sŵn 10m yn ei god post, a'r ffynhonnell uchaf ei sŵn a fapiwyd sy'n cyfrif. Mae mapiau Lloegr yn cynnwys ffyrdd, rheilffyrdd a'r un ar bymtheg o feysydd awyr a fapiwyd, mae rhai Cymru'n cynnwys ffyrdd, rheilffyrdd a diwydiant, mae map cyfunol yr Alban yn cynnwys pob ffynhonnell gan gynnwys diwydiant, ac mae cyfuchlinau rownd 3 (2017) Gogledd Iwerddon yn cynnwys ffyrdd, rheilffyrdd, diwydiant a Maes Awyr Dinas Belfast yng nghrynhoadau Belffast a Derry ynghyd â'r prif ffyrdd a'r rheilffyrdd rhyngddynt. Y trothwy yw 60 dB Lden, lefel ffordd brysur, oherwydd mai dim ond y tu mewn i'r trefi mwy yn Lloegr y mapir ffyrdd llai."}
  aircraft_noise: {label: Cartrefi mewn sŵn awyrennau, description: "Cyfran y cartrefi lle mae sŵn awyrennau'n cyfartalu 55 dB Lden neu fwy, o amgylch yr un ar bymtheg o feysydd awyr a fapiwyd yn Lloegr, Maes Awyr Dinas Belfast, a Dulyn, Corc a Shannon.", caveats: "Cyfuchlinau 55 dB Lden Heathrow, Gatwick, Stansted, Luton, Dinas Llundain, Southend, Manceinion, Lerpwl, Birmingham, East Midlands, Leeds Bradford, Newcastle, Bryste, Bournemouth a Southampton ar gyfer 2021, blwyddyn â llai o hediadau nag arfer; mae cartrefi y tu hwnt i'r cyfuchlinau hynny'n cael 0 pa bynnag feysydd awyr llai y maent yn eu clywed."}
  industrial_noise: {label: Cartrefi mewn sŵn diwydiannol, description: "Cyfran y cartrefi lle mae sŵn diwydiannol yn cyfartalu 55 dB Lden neu fwy, o amgylch safleoedd mapiedig Cymru, ym mhum dinas fapiedig yr Alban, yn nwy ardal drefol Gogledd Iwerddon ac o amgylch safleoedd mapiedig Iwerddon.", caveats: "Dim ond o amgylch safleoedd diwydiannol Cymru (rownd 2022), yn Aberdeen, Dundee, Caeredin, Falkirk a Glasgow, yn Belffast a Derry (2017) ac o amgylch safleoedd diwydiannol trwyddedig Iwerddon (rownd 4 yr EPA) y mapir y sŵn; mewn mannau eraill yn y cenhedloedd hynny 0 yw'r gwerth yn hytrach nag anhysbys."}
  night_noise: {label: Cartrefi mewn sŵn yn y nos, description: "Cyfran y cartrefi lle mae sŵn wedi'i fapio yn cyfartalu 50 dB Lnight neu fwy rhwng 23:00 a 07:00, y lefel y mae'r Gyfarwyddeb Sŵn Amgylcheddol yn cyfrif pobl fel rhai agored iddi yn y nos.", caveats: "Y fersiwn nos o'r mapiau dydd, a gymerir ym mhob cartref o'r un gridiau a chyfuchlinau 10m (haenau ffyrdd, rheilffyrdd a meysydd awyr Lloegr ar gyfer 2021, haenau ffyrdd, rheilffyrdd a diwydiant Cymru 2022, map cyfunol 2021 yr Alban, cyfuchlinau 2017 Gogledd Iwerddon, cyfuchlinau rownd 4 Iwerddon); y ffynhonnell uchaf ei sŵn a fapiwyd sy'n cyfrif. Y trothwy 50 dB Lnight yw trothwy adrodd nos y Gyfarwyddeb, felly mae ffordd lai nas mapiwyd yn ymddangos yr un mor dawel yma ag y mae yn ystod y dydd."}
  rail_service: {label: Gwasanaeth rheilffordd gerllaw, description: "Mynediadau ac allanfeydd blynyddol gorsafoedd (ORR) o fewn 2km i gartrefi, wedi'u pwysoli yn ôl pellter, fel bod gorsaf brysur gerllaw yn cyfrif mwy nag arhosfan.", caveats: "Gorsafoedd prif linell yn unig (mae arosfannau metro a thram yn cyfrif yn y mesur pellter); mae defnydd yn sefyll yn lle amlder gwasanaeth, nad yw trwydded yr amserlen yn caniatáu inni ei gyfrifo."}
  hospital_ae_distance: {label: Pellter i'r adran achosion brys agosaf, description: "Pellter cyfartalog mewn llinell syth o gartrefi i'r adran achosion brys agosaf dan arweiniad ymgynghorydd.", caveats: "Daw adrannau'r Alban o restr Iechyd Cyhoeddus yr Alban; daw rhai Lloegr a Chymru o ysbytai OpenStreetMap sydd wedi'u tagio ag adran achosion brys, a all gynnwys rhai unedau mân anafiadau. Mae cartrefi sydd heb ddim o fewn 50km iddynt yn dangos 50km, y terfyn chwilio, nid pellter a fesurwyd."}
  hospital_distance: {label: Pellter i ofal brys agosaf, description: "Pellter cyfartalog mewn llinell syth o gartrefi i'r adran achosion brys neu'r uned mân anafiadau agosaf.", caveats: "Mae cartrefi sydd heb ddim o fewn 50km iddynt yn dangos 50km, y terfyn chwilio, nid pellter a fesurwyd."}
  leisure_facilities: {label: Cyfleusterau chwaraeon (Active Places), description: "Neuaddau chwaraeon, campfeydd, pyllau, stiwdios, cyrtiau a chaeau sy'n agored i'r cyhoedd o fewn 2km yng nghofrestr Active Places Sport England, wedi'u pwysoli yn ôl pellter."}
  crime_violence: {label: Troseddau treisgar a rhywiol, description: "Troseddau treisgar a rhywiol a gofnodwyd fesul 1,000 o drigolion y flwyddyn (cyfartaledd 36 mis).", caveats: "Mae'r cyfraddau'n defnyddio trigolion fel yr enwadur, felly mae canol trefi ag ychydig o drigolion a llawer o ymwelwyr yn sgorio'n wael. Nid yw Heddlu Manceinion Fwyaf yn cyhoeddi data; caiff ei ardal ei amcangyfrif o barth troseddu IoD 2025."}
  crime_burglary: {label: Byrgleriaeth, description: "Byrgleriaethau a gofnodwyd fesul 1,000 o drigolion y flwyddyn."}
  crime_asb: {label: Ymddygiad gwrthgymdeithasol, description: "Digwyddiadau ymddygiad gwrthgymdeithasol a adroddwyd fesul 1,000 o drigolion y flwyddyn."}
  crime_theft: {label: "Lladrad, dwyn a throseddau cerbydau", description: "Lladrad, dwyn oddi ar y person, troseddau cerbydau a dwyn beiciau fesul 1,000 o drigolion y flwyddyn."}
  crime_damage_disorder: {label: Difrod troseddol a threfn gyhoeddus, description: "Difrod troseddol, llosgi bwriadol a throseddau trefn gyhoeddus fesul 1,000 o drigolion y flwyddyn."}
  road_danger: {label: Gwrthdrawiadau ffordd difrifol gerllaw, description: "Gwrthdrawiadau ffordd lle lladdwyd neu anafwyd rhywun yn ddifrifol o fewn 500m i gartrefi, y flwyddyn (cyfartaledd 5 mlynedd).", caveats: "Mae ffyrdd prysur ger cartrefi yn codi'r cyfrif ni waeth pwy oedd yn gysylltiedig. Symudodd heddluoedd i system newydd o adrodd ar anafiadau ar wahanol adegau, ac mae honno'n cofnodi mwy o anafiadau fel rhai difrifol."}
  iod_crime: {label: Parth troseddu'r mynegai amddifadedd, description: Risg wedi'i modelu o erledigaeth bersonol a materol (data 2021–2023).}
  no2: {label: Nitrogen deuocsid (NO₂), description: "NO₂ cefndirol blynyddol cymedrig lle mae trigolion yn byw (model 1km Defra; yn Iwerddon, map 1km yr EEA).", caveats: "Crynodiadau cefndirol; mae lefelau ymyl y ffordd ar strydoedd prysur yn uwch. Y canllaw gan Sefydliad Iechyd y Byd yw 10 µg/m³."}
  pm25: {label: Gronynnau mân (PM2.5), description: "PM2.5 cefndirol blynyddol cymedrig lle mae trigolion yn byw (model 1km Defra; yn Iwerddon, map 1km yr EEA).", caveats: "Y canllaw gan Sefydliad Iechyd y Byd yw 5 µg/m³."}
  green_space_access: {label: Parciau a mannau gwyrdd gerllaw, description: "Mynedfeydd i barciau, gerddi a chaeau chwarae cyhoeddus o fewn 1km o gerdded, wedi'u pwysoli yn ôl pellter (yng Ngogledd Iwerddon ac Iwerddon, parciau a chaeau OpenStreetMap).", caveats: "Mae'n cyfrif parciau cyhoeddus a chaeau chwarae, nid cefn gwlad agored, felly mae pentrefi sydd wedi'u hamgylchynu gan gaeau a llwybrau troed yn sgorio'n is nag y maent yn teimlo. Nid oes gan Ogledd Iwerddon gynnyrch mannau gwyrdd agored, felly daw ei pharciau, ei gerddi a'i chaeau chwarae o OpenStreetMap ac maent yn cael eu mesur i ymyl agosaf y safle yn hytrach na'i fynedfeydd."}
  play_spaces: {label: Mannau chwarae gerllaw, description: "Mynedfeydd i fannau chwarae cyhoeddus o fewn 800m i gartrefi, wedi'u pwysoli yn ôl pellter (yng Ngogledd Iwerddon ac Iwerddon, meysydd chwarae OpenStreetMap)."}
  flood_risk: {label: Cartrefi mewn perygl o lifogydd, description: "Cyfran y cartrefi sydd mewn perygl uchel neu ganolig o lifogydd o afonydd, y môr neu ddŵr wyneb (siawns o 1% y flwyddyn o leiaf).", caveats: "Caiff pob cartref ei raddio yn ôl yr uchaf o'r asesiadau afonydd a'r môr a dŵr wyneb, sy'n ystyried amddiffynfeydd rhag llifogydd; nid yw llifogydd dŵr daear a charthffosydd wedi'u cynnwys. Cyfeiriadau yw'r cyfrifon yn Lloegr, felly mae siopau ar stryd fawr sy'n dueddol o ddioddef llifogydd yn cyfrif hefyd. Yng Nghymru, mae Cyfoeth Naturiol Cymru yn cyhoeddi ardaloedd risg yn hytrach na chyfrifon, felly amcangyfrifir nifer y cartrefi sydd mewn perygl o gyfran pwyntiau eiddo ardal sydd o fewn yr ardaloedd uchel a chanolig. Darllenir mapiau SEPA yr Alban yn yr un modd, gyda'r band canolig ar 1 mewn 200 y flwyddyn (yn llacach na 1 mewn 100 Asiantaeth yr Amgylchedd)."}
  flood_rivers_sea: {label: Cartrefi mewn perygl o afonydd neu'r môr, description: Cyfran y cartrefi sydd mewn perygl uchel neu ganolig o lifogydd o afonydd neu'r môr yn unig (siawns o 1% y flwyddyn o leiaf)., caveats: "Y rhan o'r perygl llifogydd sy'n dod o afonydd a'r môr; dŵr wyneb yw'r gweddill. Cymerir amddiffynfeydd rhag llifogydd i ystyriaeth."}
  road_rail_noise: {label: Cartrefi mewn sŵn ffyrdd neu reilffyrdd, description: "Cyfran y cartrefi lle mae sŵn ffyrdd neu reilffyrdd yn cyfartalu 60 dB Lden neu fwy dros y dydd, yr hwyr a'r nos, o'r mapiau sŵn strategol.", caveats: "Cymerir gwerth pob cartref o'r grid sŵn 10m yn ei god post. Mae mapiau Lloegr yn cwmpasu pob ffordd y tu mewn i'r trefi a'r dinasoedd mwy a dim ond y prif ffyrdd mewn mannau eraill, tra bod rhai Cymru'n cwmpasu pob ffordd, felly 60 dB Lden yw'r trothwy, lefel ffordd brysur, yn hytrach na'r 55 dB y mae'r Gyfarwyddeb Sŵn Amgylcheddol yn cyfrif pobl fel rhai agored iddo; ar y lefel honno, dim ond lle y cawsant eu mapio y byddai strydoedd cyffredin yn cyfrif. Nid yw awyrennau a diwydiant wedi'u cynnwys."}
  coast_distance: {label: Pellter i'r arfordir, description: "Pellter o gartrefi i'r arfordir agosaf, mewn cilometrau (y marc penllanw ym Mhrydain Fawr ac Iwerddon, amlinell Gogledd Iwerddon).", caveats: "Pellter mewn llinell syth i bwynt agosaf yr arfordir a fapiwyd, sy'n ymestyn i fyny aberoedd, lochau môr ac afonydd llanw cyn belled ag y mae'r marc penllanw yn mynd (mae Norwich, Caerloyw a Wisbech yn cael gwerth o dan 2 km); mesur o ba mor agos yw dŵr llanw, nid o fynediad at draethau. Nid yw llynnoedd a lochau mewndirol yn arfordir."}
  sealed_surface: {label: Tir adeiledig o amgylch cartrefi, description: "Cyfran y tir o fewn 500m i gartrefi y mae gorchudd tir lloeren yn ei ddosbarthu fel tir adeiledig, sef adeiladau, ffyrdd ac arwynebau caled eraill (ESA WorldCover, 10m).", caveats: "Mae cell 10m yn cyfrif fel tir adeiledig pan fo arwynebau wedi'u selio'n bennaf ynddi, felly mae gerddi ac ymylon glaswelltog rhwng tai yn gostwng y gyfran; map ie/na o 2021 ydyw, nid mesur o faint o bob cell sydd wedi'i selio. Gadewir dŵr a chelloedd heb eu mapio allan o gyfanswm y tir."}
  protected_nature: {label: Natur warchodedig gerllaw, description: "Hectarau o dir o fewn tua 2km i gartrefi sydd wedi'i warchod er mwyn natur (Safleoedd o Ddiddordeb Gwyddonol Arbennig, gwarchodfeydd natur, Ardaloedd Cadwraeth Arbennig ac Ardaloedd Gwarchodaeth Arbennig; yn Iwerddon, Ardaloedd Cadwraeth Arbennig, Ardaloedd Gwarchodaeth Arbennig ac Ardaloedd Treftadaeth Naturiol).", caveats: "Ffiniau gwirioneddol pob dynodiad, wedi'u huno fel bod tir a warchodir ddwywaith yn cyfrif unwaith, ac wedi'u cyfyngu i'r tir, felly caiff safleoedd morol eu gadael allan; wedi'u mesur dros ffenestr ag arwynebedd cylch 2km o amgylch pob cartref (tua 1,257 ha ar y mwyaf) ar grid 50m. Nid yw Gogledd Iwerddon yn cyhoeddi haen genedlaethol o warchodfeydd natur lleol, a'r set statudol yw un Iwerddon, heb yr Ardaloedd Treftadaeth Naturiol arfaethedig 1995."}
  hilliness: {label: Bryniogrwydd o amgylch cartrefi, description: "Llethr cyfartalog y tir o fewn tua 500m i gartrefi, fel canran (mae llethr o 10% yn codi 10m bob 100m).", caveats: "Llethr yn ôl dull Horn ar grid 50m, o OS Terrain 50 ym Mhrydain Fawr a model tir 50m OSNI yng Ngogledd Iwerddon; daw data Iwerddon o Copernicus GLO-30, model arwyneb lle mae adeiladau a choed yn ychwanegu uchder, felly mae trefi a choedwigoedd Iwerddon yn ymddangos ychydig yn fryniogach na'r tir ei hun. Mae tir mwy gwastad yn haws ar droed ac ar feic; nid yw'r lliw yn dweud bod y naill na'r llall yn well."}
  elevation: {label: Uchder uwchlaw lefel y môr, description: "Uchder cyfartalog cartrefi uwchlaw lefel y môr, mewn metrau, o'r grid tir 50m.", caveats: "Uchder y gell 50m y mae pob cartref ynddi; daw data Iwerddon o fodel arwyneb, sy'n ychwanegu uchder adeiladau a choed. Nid yw uchel nac isel yn well; dim ond trefnu'r ardaloedd y mae'r raddfa liw yn ei wneud."}
  storm_overflow_spills: {label: Gorlifiadau carthion gerllaw, description: "Yr oriau yn y flwyddyn y bu gorlifiadau storm o fewn 2km i gartrefi yn gollwng carthion i afonydd a'r môr, wedi'u hadio (Monitro Hyd Digwyddiadau Asiantaeth yr Amgylchedd).", caveats: "Monitro'r cwmnïau dŵr eu hunain ar allfa pob gorlif dros y flwyddyn galendr ddiweddaraf, cyn i ollyngiadau gael eu grwpio'n ollyngiadau a gyfrifir; mae gorlif y bu ei fonitor yn gweithio am lai na 90% o'r flwyddyn yn tangofnodi. Mae gollyngiad yn cyrraedd yr afon ymhellach i lawr, a all fod yn bellach na 2km o'r cartrefi sy'n cael eu cyfrif yma. Lloegr yn unig, oherwydd bod y ffurflenni Cymreig yn mynd i Gyfoeth Naturiol Cymru ac nad yw'r Alban, Gogledd Iwerddon ac Iwerddon yn cyhoeddi cofnod blynyddol llawn."}
  bathing_water_distance: {label: Pellter i ddŵr ymdrochi, description: "Pellter o gartrefi i'r dŵr ymdrochi dynodedig agosaf (traeth, llyn neu ran o afon sy'n cael ei monitro ar gyfer nofwyr), mewn cilometrau.", caveats: "Pellter mewn llinell syth i'r pwynt samplu (yng Ngogledd Iwerddon, canol yr ardal ddynodedig). Dim ond dyfroedd a ddynodwyd ar gyfer ymdrochi sy'n cyfrif, felly nid yw traeth neu lyn braf nad yw wedi'i ddynodi yn cyfrif; mae'r chwiliad yn dod i ben ar 100km."}
  bathing_water_class: {label: Ansawdd dŵr ymdrochi gerllaw, description: "Dosbarth y dŵr ymdrochi dynodedig agosaf o fewn 10km i gartrefi, o 4 (Ardderchog) drwy Da a Digonol i 1 (Gwael), ar gyfer y tymor diweddaraf.", caveats: "Dosbarth y dŵr ymdrochi agosaf at bob cartref, wedi'i gyfartaleddu ar draws cartrefi'r ardal; nid oes gwerth gan ardal lle mae gan lai na hanner y cartrefi ddŵr ymdrochi o fewn 10km. Mae'r dosbarthiadau'n seiliedig ar bedwar tymor o samplau (tri ar gyfer dyfroedd a ddynodwyd ers 2022), ac mae rhai Gogledd Iwerddon wedi'u trawsgrifio o gyhoeddiad blynyddol DAERA."}
  river_status: {label: Iechyd afonydd a llynnoedd gerllaw, description: "Statws yr afon neu'r llyn agosaf o fewn 2km i gartrefi o dan y Gyfarwyddeb Fframwaith Dŵr, o 5 (Uchel) drwy Da, Cymedrol a Gwael i 1 (Drwg).", caveats: "Statws yr afon neu'r llyn agosaf at bob cartref, wedi'i gyfartaleddu ar draws cartrefi'r ardal; nid oes gwerth gan ardal lle mae gan lai na hanner y cartrefi afon neu lyn o fewn 2km. Statws ecolegol yn Lloegr (2025), Cymru (2024, dros dro), Gogledd Iwerddon (2018, y diweddaraf sydd ar gael yn agored) ac Iwerddon (2019–2024); statws cyffredinol yn yr Alban (2024), yr unig ddosbarth y mae SEPA yn ei gyhoeddi'n agored. Dim ond y cyrff dŵr y mae'r asiantaethau'n eu dosbarthu sy'n cyfrif, felly nid yw nentydd bach a phyllau yn cyfrif."}
  tree_canopy: {label: Gorchudd coed o amgylch cartrefi, description: "Cyfran y tir o fewn 500m i gartrefi y mae gorchudd tir lloeren yn ei ddosbarthu fel gorchudd coed (ESA WorldCover, 10m).", caveats: "Mae cell 10m yn cyfrif fel gorchudd coed pan fo coed yn bennaf ynddi, felly mae hyn yn dangos tua dwywaith cymaint ag arolwg canopi Forest Research (sy'n samplu pwyntiau) ond yn rhestru wardiau yn yr un drefn fwy neu lai; nid yw coed gardd unigol a gwrychoedd yn cael eu canfod. Gadewir dŵr a chelloedd heb eu mapio allan o gyfanswm y tir, felly caiff cartref ar lan y môr ei farnu ar sail y tir y tu cefn iddo."}
  light_pollution: {label: Golau yn y nos, description: "Disgleirdeb cyfartalog yn y nos o fewn 1km i gartrefi, o gyfansawdd blynyddol lloeren VIIRS (nW/cm²/sr).", caveats: "Mae disgleirdeb uwch yn golygu mwy o oleuadau stryd ac adeiladau ac felly llai o olygfa o awyr y nos; mae'n adlewyrchu dwysedd ac mae iddo ddwy ochr, a dyna pam y caiff ei ddangos ond nid ei sgorio. Mae'r lloeren yn ddall i ran las golau LED, felly mae strydoedd a newidiwyd yn ddiweddar i LED yn ymddangos yn dywyllach nag y maent mewn gwirionedd."}
  iod_outdoors: {label: Amgylchedd byw awyr agored IoD 2025, description: Ansawdd aer a damweiniau traffig ffordd (is-barth IoD 2025).}
  gp_distance: {label: Pellter i'r practis meddyg teulu agosaf, description: Pellter cyfartalog mewn llinell syth o gartrefi i'r practis meddyg teulu agosaf.}
  patients_per_gp: {label: Cleifion fesul meddyg teulu, description: Cleifion cofrestredig fesul meddyg teulu cymwys cyfwerth ag amser llawn yn y practisau mae trigolion yn eu defnyddio mewn gwirionedd., caveats: "Nid yw meddygon teulu dan hyfforddiant wedi'u cynnwys; gadewir practisau sy'n adrodd am lai nag un meddyg teulu amser llawn allan o'r cyfartaledd."}
  gp_quality: {label: Sgoriau practisau meddyg teulu, description: "Sgoriau CQC y practisau meddyg teulu mae trigolion wedi'u cofrestru â nhw, wedi'u pwysoli yn ôl faint sy'n defnyddio pob un.", caveats: "Mae'r rhan fwyaf o bractisau wedi cael sgôr Da, ac mae rhai sgoriau'n dyddio'n ôl sawl blwyddyn."}
  care_homes: {label: Cartrefi gofal â sgôr dda gerllaw, description: "Gwelyau mewn cartrefi gofal â sgôr Da neu Rhagorol gan CQC o fewn 5km, wedi'u pwysoli yn ôl pellter."}
  pharmacy_distance: {label: Pellter i'r fferyllfa agosaf, description: Pellter cyfartalog mewn llinell syth o gartrefi i'r fferyllfa gymunedol GIG agosaf., caveats: "Nid yw practisau meddyg teulu gwledig sy'n dosbarthu meddyginiaethau eu hunain yn cael eu cyfrif. Daw fferyllfeydd Cymru o OpenStreetMap, gan nad yw rhestr Partneriaeth Cydwasanaethau GIG Cymru yn ddarllenadwy gan beiriant."}
  dentist_distance: {label: Pellter i'r deintydd GIG agosaf, description: Pellter cyfartalog mewn llinell syth o gartrefi i'r practis deintyddol agosaf sydd â chontract GIG., caveats: "Ni chyhoeddir fel data agored a yw practis yn derbyn cleifion newydd y GIG."}
  primary_school_quality: {label: Ysgolion cynradd da gerllaw, description: "Ansawdd y tair ysgol gynradd wladol agosaf (Ofsted a chanlyniadau), gyda'r rhai agosach yn cyfrif mwy.", caveats: "Mae ansawdd yn cyfuno Ofsted (60%) a chanlyniadau cyfnod allweddol 2 fel canradd (40%); mae canlyniadau'n adlewyrchu'r disgyblion sy'n cael eu derbyn yn ogystal â'r addysgu. Nid yw pellter yr un peth â chael eich derbyn; mae ysgolion sydd â gormod o geisiadau yn derbyn yn ôl dalgylch neu ffydd. Nid yw ar gael yng Nghymru, yn yr Alban nac yng Ngogledd Iwerddon, lle na chyhoeddir canlyniadau ysgolion cynradd na graddau arolygu."}
  secondary_school_quality: {label: Ysgolion uwchradd da gerllaw, description: "Ansawdd y tair ysgol uwchradd wladol agosaf (Ofsted a chanlyniadau), gyda'r rhai agosach yn cyfrif mwy.", caveats: "Mae ansawdd yn cyfuno Ofsted (60%) a Chyrhaeddiad 8 fel canradd (40%); ni chyhoeddir Cynnydd 8 ar gyfer 2024/25. Yng Nghymru, lle na chyhoeddir canlyniadau na graddau arolygu fesul ysgol, mae sgôr pwyntiau Capped 9 yr awdurdod lleol yn sefyll yn lle pob ysgol ynddo (wedi'i nodi â broadcast_lad). Yn yr Alban, ansawdd yw sgôr tariff cyfartalog gadawyr pob ysgol fel canradd o fewn yr Alban; ni chyhoeddir graddau arolygu fel data agored."}
  school_choice: {label: Dewis o ysgolion da, description: "Ysgolion cynradd gwladol da o fewn 2km ac ysgolion uwchradd o fewn 5km, wedi'u pwysoli yn ôl ansawdd a phellter."}
  primary_results: {label: Canlyniadau ysgolion cynradd gerllaw, description: "Cyfran y disgyblion sy'n cyrraedd y safon ddisgwyliedig mewn darllen, ysgrifennu a mathemateg mewn ysgolion cynradd gwladol o fewn 2km (cyfartaledd 3 blynedd), wedi'u pwysoli yn ôl pellter.", caveats: "Mae canlyniadau'n adlewyrchu cefndir y disgyblion yn ogystal â'r addysgu; ni chyhoeddir mesurau cynnydd ar gyfer 2024/25."}
  secondary_results: {label: Canlyniadau ysgolion uwchradd gerllaw, description: "Sgôr Cyrhaeddiad 8 cyfartalog mewn ysgolion uwchradd gwladol o fewn 5km, wedi'u pwysoli yn ôl pellter.", caveats: "Mae canlyniadau'n adlewyrchu cefndir y disgyblion yn ogystal â'r addysgu; ni chyhoeddir Cynnydd 8 ar gyfer 2024/25 a 2025/26."}
  nursery_access: {label: Meithrinfeydd da gerllaw, description: "Meithrinfeydd, cyn-ysgolion a dosbarthiadau meithrin ysgolion o fewn 1km, pob un wedi'i bwysoli yn ôl ei radd Ofsted a'i bellter.", caveats: "Nid yw gwarchodwyr plant yn cael eu lleoli (mae Ofsted yn atal eu cyfeiriadau). Yng Nghymru daw meithrinfeydd o OpenStreetMap (nid yw Arolygiaeth Gofal Cymru yn cyhoeddi rhestr darparwyr) ac maent yn cyfrif fel rhai o ansawdd cyfartalog; cynhwysir dosbarthiadau meithrin ysgolion o restr ysgolion Cymru. Yn yr Alban caiff pob meithrinfa ei phwysoli yn ôl ei graddau gan y Care Inspectorate."}
  connectivity_overall: {label: Cysylltedd cyffredinol, description: Sgôr cysylltedd yr Adran Drafnidiaeth ar draws pob dull a chyrchfan.}
  connectivity_public_transport: {label: Cysylltedd trafnidiaeth gyhoeddus, description: Sgôr cysylltedd yr Adran Drafnidiaeth ar gyfer trafnidiaeth gyhoeddus i bob cyrchfan.}
  connectivity_walking: {label: Cerddadwyedd, description: Sgôr cysylltedd yr Adran Drafnidiaeth ar gyfer cerdded i bob cyrchfan.}
  cycle_infrastructure: {label: Llwybrau a lonydd beicio gerllaw, description: "Cilometrau o lwybrau beicio, traciau beicio a lonydd beicio wedi'u paentio fesul km² o fewn 1km i gartrefi (OpenStreetMap).", caveats: "Seilwaith beicio fel y mae OpenStreetMap yn ei fapio, sy'n llawnach mewn dinasoedd: llwybrau beicio, llwybrau lle mae beicio wedi'i ddynodi, a lonydd neu draciau ar hyd ffordd (mae lôn ar ddwy ochr stryd yn cyfrif unwaith). Nid yw troedffyrdd a rennir heb y dynodiad na strydoedd tawel yn cael eu cyfrif."}
  street_connectivity: {label: Cysylltedd strydoedd, description: "Cyffyrdd strydoedd a llwybrau cerdded fesul km² o fewn 1km i gartrefi (OpenStreetMap).", caveats: "Cyffordd yw lle mae tri neu fwy o bennau strydoedd neu lwybrau y gellir cerdded arnynt yn cwrdd, felly mae cyffordd T yn cyfrif ond nid yw dwy stryd yn cwrdd pen wrth ben; gadewir dreifiau a lonydd meysydd parcio allan. Mae grid o strydoedd yn dangos gwerth uchel ac ystad cul-de-sac werth isel, oni bai bod llwybrau troed drwy'r ystad wedi'u mapio."}
  connectivity_cycling: {label: Cysylltedd beicio, description: Sgôr cysylltedd yr Adran Drafnidiaeth ar gyfer beicio i bob cyrchfan.}
  station_distance: {label: Pellter i'r orsaf agosaf, description: "Pellter cyfartalog mewn llinell syth o gartrefi i'r orsaf reilffordd, metro neu dram agosaf.", caveats: "Mae cartrefi sydd heb ddim o fewn 50km iddynt yn dangos 50km, y terfyn chwilio, nid pellter a fesurwyd."}
  bus_frequency: {label: Amlder bysiau, description: "Bysiau yr awr (dyddiau'r wythnos, 07:00–19:00) yn yr arhosfan brysuraf o fewn 400m i gartrefi.", caveats: "Bysiau yn ôl yr amserlen ar ddydd Mawrth arferol. Caiff ei ddangos ond nid ei sgorio, oherwydd bod sgôr cysylltedd yr Adran Drafnidiaeth (sy'n cael ei sgorio) eisoes yn cwmpasu mynediad at fysiau (ρ ≈ 0.82). Mae cyhoeddi i'r Gwasanaeth Data Agored Bysiau yn wirfoddol yn yr Alban, felly mae rhai gweithredwyr o'r Alban ar goll."}
  bus_access: {label: Gwasanaeth bws gerllaw, description: "Bysiau yr awr (dyddiau'r wythnos, 07:00–19:00) yn yr arhosfan prysuraf o fewn 400m i gartrefi, o amserlenni Transport for Ireland; yn sefyll yn lle'r sgôr cysylltedd nad oes gan Iwerddon.", caveats: "Bysiau yn ôl yr amserlen ar ddydd Mawrth arferol, pob gweithredwr yn y porthiant cenedlaethol. Mae'n sefyll yn lle sgôr cysylltedd yr Adran Drafnidiaeth, sy'n pwyso a mesur cerdded, beicio, gyrru a thrafnidiaeth gyhoeddus i swyddi a gwasanaethau; mae bysiau'n unig yn rhoi darlun teneuach."}
  gigabit_broadband: {label: Band eang gigabit, description: Cyfran y cartrefi sy'n gallu cael band eang galluog gigabit (ffeibr llawn neu gebl).}
  slow_broadband: {label: Cartrefi heb fand eang addas, description: Cyfran y cartrefi na allant gael band eang 10 Mbit/s o linell sefydlog neu ddi-wifr sefydlog.}
  well_run_pubs: {label: Tafarndai da gerllaw, description: "Tafarndai o fewn 15 munud o gerdded sydd â sgôr hylendid bwyd o 4 neu 5 o'r tair blynedd diwethaf, wedi'u pwysoli yn ôl pellter, gyda bonws bach am gwrw go iawn, bwyd neu seddi awyr agored.", caveats: "Mae graddau hylendid yn mesur pa mor dda y caiff tafarn ei rhedeg, nid y cwrw na'r awyrgylch. Mae cynllun hylendid yr Alban yn graddio Pass neu Improvement Required yn hytrach na 0–5 ac yn arolygu ar gylch hwy, felly yno mae tafarn yn cyfrif fel un wedi'i rhedeg yn dda pan basiodd o fewn y pum mlynedd diwethaf."}
  food_and_drink: {label: Caffis a bwytai, description: "Caffis a bwytai o fewn 800m, wedi'u pwysoli yn ôl pellter."}
  supermarket_distance: {label: Pellter i'r archfarchnad agosaf, description: Pellter cyfartalog mewn llinell syth o gartrefi i'r archfarchnad agosaf.}
  everyday_services: {label: Gwasanaethau bob dydd o fewn 15 munud, description: "Cyfran y saith math o wasanaeth bob dydd (practis meddyg teulu, fferyllfa, archfarchnad, ysgol gynradd, swyddfa bost, parc neu faes chwarae, a thrafnidiaeth gyhoeddus aml) sydd gan y cartref nodweddiadol o fewn 1.2 km, tua 15 munud o gerdded mewn llinell syth.", caveats: "Cyrhaeddiad mewn llinell syth, nid amser cerdded, felly ni welir afon na rheilffordd rhwng y cartref a'r siop (mae rhwydwaith cerdded wedi'i gynllunio). Ystyr trafnidiaeth aml yw arhosfan ag o leiaf ddau ymadawiad yr awr yn ystod y dydd ar ddyddiau'r wythnos, neu orsaf reilffordd, metro neu dram. Nid oes gan Iwerddon restr ysgolion yn y data, felly mesurir ei chartrefi dros y chwe math arall. Pob adeilad yw cartrefi Iwerddon yn hytrach na phwyntiau cod post, felly mae Iwerddon wledig wasgaredig yn dangos gwerth is na Phrydain wledig."}
  library_distance: {label: Pellter i lyfrgell, description: "Pellter cyfartalog mewn llinell syth o gartrefi i'r llyfrgell gyhoeddus agosaf (OpenStreetMap).", caveats: "Llyfrgelloedd fel y mae OpenStreetMap yn eu mapio; gall rhestr cyngor fod yn llawnach. Mae'r chwiliad yn dod i ben ar 20 km; mae cartref nad oes yr un o fewn y pellter hwnnw iddo yn cyfrif fel 20 km, ac mae ardal lle nad oes gan y mwyafrif o'r cartrefi yr un yn cael ei marcio fel o leiaf mor bell â hynny."}
  post_office_distance: {label: Pellter i swyddfa bost, description: "Pellter cyfartalog mewn llinell syth o gartrefi i'r swyddfa bost agosaf (OpenStreetMap).", caveats: "Swyddfeydd post fel y mae OpenStreetMap yn eu mapio, gan gynnwys cownteri mewn siopau lle maent wedi'u mapio; nid yw rhai Tramore wedi'u mapio. Mae'r chwiliad yn dod i ben ar 20 km; mae cartref nad oes yr un o fewn y pellter hwnnw iddo yn cyfrif fel 20 km, ac mae ardal lle nad oes gan y mwyafrif o'r cartrefi yr un yn cael ei marcio fel o leiaf mor bell â hynny."}
  shops: {label: Siopau gerllaw, description: "Siopau o bob math o fewn 800m, wedi'u pwysoli yn ôl pellter."}
  leisure: {label: Cyfleusterau chwaraeon a ffitrwydd, description: "Canolfannau chwaraeon, campfeydd a phyllau nofio sy'n agored i'r cyhoedd o fewn 2km, wedi'u pwysoli yn ôl pellter (OpenStreetMap).", caveats: "Cyfleusterau a fapiwyd, felly mae canolfan hamdden tref yn cyfrif unwaith faint bynnag o neuaddau sydd ganddi; gadewir pyllau nofio allan oherwydd bod y rhan fwyaf o'r rhai a fapiwyd yn byllau gardd preifat. Cofrestr Active Places Sport England (leisure_facilities) yw'r croeswiriad yn Lloegr."}
  swimming_pool_distance: {label: Pellter i'r pwll cyhoeddus agosaf, description: Pellter cyfartalog mewn llinell syth o gartrefi i'r pwll nofio agosaf sy'n agored i'r cyhoedd.}
  culture: {label: "Llyfrgelloedd, sinemâu, theatrau ac amgueddfeydd", description: "Llyfrgelloedd, sinemâu, theatrau, canolfannau celfyddydau, amgueddfeydd ac orielau o fewn 2km."}
  fast_food: {label: Siopau bwyd cyflym gerllaw, description: Siopau bwyd cyflym o fewn 800m.}
  gambling: {label: Siopau betio a chasinos gerllaw, description: "Siopau betio, lleoliadau gamblo a chasinos o fewn 800m."}
  house_price: {label: Pris tŷ arferol, description: "Pris gwerthu canolrifol dros y 12 mis diwethaf, wedi'i sefydlogi tuag at yr ardal o gwmpas lle mae'r gwerthiannau'n brin.", caveats: "Mae prisiau is yn sgorio fel rhai mwy fforddiadwy; mae'r raddfa'n adlewyrchu pris, nid gwerth. Yn yr Alban mae Cofrestri'r Alban yn cyhoeddi canolrifau blynyddol fesul parth data 2011 (y flwyddyn galendr ddiweddaraf, tua dwy flynedd y tu ôl i ffeil Cofrestrfa Tir EF), wedi'u hatal o dan bum gwerthiant; cânt eu trosglwyddo i barthau 2022 drwy'r tabl trawsgyfeirio cod post, ac mae parth heb bris yn cymryd pris ei barth canolradd."}
  housing_condition: {label: Cyflwr tai, description: "Parth tai y mynegai amddifadedd (cartrefi mewn cyflwr gwael neu heb wres canolog; yn yr Alban, gorlenwi a dim gwres canolog)."}
  price_change: {label: Newid ym mhrisiau tai, description: "Newid yn y pris gwerthu canolrifol, y 12 mis diwethaf yn erbyn y 12 mis cynt.", caveats: "Yn anwadal lle mae gwerthiannau'n brin; yn yr Alban ac yng Ngogledd Iwerddon, y newid yw rhwng blynyddoedd calendr, ac nid oes newid ar gyfer ward yng Ngogledd Iwerddon y mae ei chanolrif wedi'i atal yn y naill flwyddyn neu'r llall."}
  council_tax: {label: Treth gyngor (cyfradd Band D y cyngor), description: "Treth gyngor flynyddol ar gartref Band D, gan gynnwys taliadau'r sir, yr heddlu, tân a chyngor cymuned cyfartalog.", caveats: "Yr un peth ym mhob cymdogaeth mewn ardal cyngor; mae bil cartref yn dibynnu ar ei fand. Mae bandiau Cymru wedi'u cyfrifo o fand D cyfartalog pob awdurdod gan ddefnyddio'r cymarebau statudol."}
  price_to_income: {label: Pris o'i gymharu ag incwm lleol, description: Pris tŷ arferol wedi'i rannu ag incwm aelwyd net cymedrig yr ardal., caveats: "Amcangyfrif ar sail model yw'r incwm ar gyfer yr ardal ehangach (MSOA), ar gyfer 2022–23."}
  new_builds: {label: Cartrefi a adeiladwyd ers 2000, description: Cyfran y cartrefi a adeiladwyd yn 2000 neu'n ddiweddarach.}
  period_homes: {label: Cartrefi a adeiladwyd cyn 1919, description: Cyfran y cartrefi a adeiladwyd cyn 1919.}
  lower_band_homes: {label: Cartrefi ym mandiau treth gyngor A–B, description: Cyfran y cartrefi yn y ddau fand treth gyngor isaf (y cartrefi rhataf yng ngwerthoedd 1991).}
  income_deprivation: {label: Amddifadedd incwm, description: Cyfran y trigolion ar incwm isel (parth incwm y mynegai amddifadedd)., caveats: "Yng Nghymru, y gyfradd yw dangosydd \"pobl mewn amddifadedd incwm\" WIMD 2025 (StatsCymru), y mesur y tu ôl i sgôr y parth."}
  pobal_deprivation: {label: Cyfoeth ac amddifadedd (mynegai Pobal HP), description: "Mynegai amddifadedd cymharol Pobal HP yr adran etholiadol o Gyfrifiad 2022 (diweithdra, addysg, dosbarth cymdeithasol, rhieni sengl, deiliadaeth a gorlenwi); mae uwch yn golygu mwy cefnog.", caveats: "Cyhoeddir ar gyfer Rhaniadau Etholiadol (tua 1,500 o bobl); mae fersiwn yr Ardal Fach dan drwydded. Mae'n sefyll yn lle cyfran yr amddifadedd incwm, nad yw Iwerddon yn ei chyhoeddi islaw lefel y sir."}
  employment_deprivation: {label: Amddifadedd cyflogaeth, description: Cyfran y trigolion o oedran gweithio sydd allan o waith yn anwirfoddol (parth cyflogaeth y mynegai amddifadedd)., caveats: "Yng Nghymru, y gyfradd yw dangosydd \"pobl o oedran gweithio mewn amddifadedd cyflogaeth\" WIMD 2025 (StatsCymru), y mesur y tu ôl i sgôr y parth."}
  claimant_rate: {label: Cyfradd hawlwyr, description: "Trigolion sy'n hawlio budd-daliadau sy'n gysylltiedig â diweithdra, fel cyfran o'r rhai 16–64 oed (mis diweddaraf).", caveats: "Heb ei sgorio oherwydd ei fod yn dilyn amddifadedd incwm IoD yn agos (ρ≈0.9), ond mae'n llawer mwy diweddar (misol). Mae'n cynnwys hawlwyr Credyd Cynhwysol sydd mewn gwaith cyflog isel ac sy'n gorfod chwilio am ragor."}
  household_income: {label: Incwm aelwydydd, description: "Incwm aelwyd net cymedrig yn yr ardal ehangach (MSOA), cyn costau tai."}
  health_deprivation: {label: Iechyd ac anabledd, description: "Marwolaeth gynamserol, salwch ac anabledd (parth iechyd ac anabledd y mynegai amddifadedd).", caveats: "Mae wedi'i lunio i ystyried oedran, yn wahanol i iechyd hunan-adroddedig, sy'n gwneud i ardaloedd o oedolion ifanc edrych yn well."}
  life_expectancy: {label: Disgwyliad oes, description: "Disgwyliad oes adeg geni yn yr ardal ehangach (MSOA), cymedr dynion a menywod, 2019–23.", caveats: "Caiff ei ddangos ond nid ei sgorio, oherwydd bod parth iechyd IoD (sy'n cael ei sgorio) yn mesur bron yr un peth ar raddfa fwy manwl."}
  good_health: {label: Iechyd da (hunan-adroddedig), description: Trigolion sy'n disgrifio eu hiechyd fel da neu dda iawn (Cyfrifiad 2021; Cyfrifiad 2022 yn yr Alban)., caveats: "Nid yw wedi'i addasu ar gyfer oedran, felly mae ardaloedd myfyrwyr yn ymddangos fel y rhai iachaf."}
  imd: {label: Mynegai Amddifadedd Lluosog, description: Sgôr amddifadedd cyffredinol; heb ei sgorio am fod ei barthau'n gorgyffwrdd â dangosyddion eraill.}
  population_density: {label: Dwysedd poblogaeth, description: Trigolion fesul cilometr sgwâr (Cyfrifiad 2021; Cyfrifiad 2022 yn yr Alban).}
  households_with_children: {label: Aelwydydd â phlant dibynnol, description: Cyfran yr aelwydydd â phlant dibynnol (Cyfrifiad 2021; Cyfrifiad 2022 yn yr Alban).}
  aged_65_plus: {label: Trigolion 65 oed a throsodd, description: Cyfran y trigolion 65 oed neu'n hŷn (Cyfrifiad 2021; Cyfrifiad 2022 yn yr Alban).}
  owner_occupied: {label: Cartrefi perchen-feddianwyr, description: Cyfran yr aelwydydd sy'n berchen ar eu cartref yn llwyr neu â morgais (Cyfrifiad 2021; Cyfrifiad 2022 yn yr Alban).}
  no_car: {label: Aelwydydd heb gar, description: Cyfran yr aelwydydd heb gar na fan (Cyfrifiad 2021; Cyfrifiad 2022 yn yr Alban).}
  sustainable_commute: {label: "Cerdded, beicio neu drafnidiaeth gyhoeddus i'r gwaith", description: "Cyfran y gweithwyr sy'n cymudo ar droed, ar feic neu ar drafnidiaeth gyhoeddus (Cyfrifiad 2021, yn ystod cyfyngiadau COVID-19; Cyfrifiad 2022 yn yr Alban)."}

  sunshine: {label: Heulwen, description: "Oriau o heulwen lachar y flwyddyn, cyfartaledd 1991–2020 (HadUK-Grid, 1km).", caveats: "Grid 1km wedi'i ryngosod o recordwyr heulwen, felly caiff bryniau ac arfordiroedd eu llyfnhau; mae cyfartaleddau deng mlynedd ar hugain yn dweud beth sy'n arferol, nid yr hyn a ddaeth ag unrhyw flwyddyn unigol."}
  wet_days: {label: Diwrnodau gwlyb, description: "Diwrnodau y flwyddyn ag o leiaf 1mm o law, cyfartaledd 1991–2020.", caveats: "Mae'n cyfrif diwrnodau, nid faint o law, felly mae lle â glaw mân yn ymddangos yn wlypach nag un â'r un glawiad mewn llai o gawodydd trwm; dangosir glawiad mewn milimetrau wrth ei ochr."}
  summer_warmth: {label: Cynhesrwydd yr haf, description: "Tymheredd uchaf dyddiol cyfartalog Mehefin i Awst, cyfartaledd 1991–2020 (°C).", caveats: "Yma, caiff cynhesach ei gyfrif fel gwell; dangosir y diwrnodau uwchlaw 25°C wrth ei ochr i unrhyw un y byddai'n well ganddo beidio â'u cael."}
  winter_mildness: {label: Tynerwch y gaeaf, description: "Tymheredd isaf dyddiol cyfartalog Rhagfyr i Chwefror, cyfartaledd 1991–2020 (°C).", caveats: "Isafbwyntiau tymheredd y nos, sy'n pennu rhew a biliau gwresogi; mae arfordiroedd a dinasoedd yn ymddangos yn dynerach na'r bryniau y tu ôl iddynt."}
  rainfall: {label: Glawiad, description: "Glawiad y flwyddyn mewn milimetrau, cyfartaledd 1991–2020."}
  rainfall_total: {label: Glawiad blynyddol, description: "Glawiad cyfartalog y flwyddyn, 1991–2020, o grid 1 km Met Éireann; yn sefyll yn lle dyddiau gwlyb.", caveats: "Cyfanswm y glawiad, nid pa mor aml y mae'n bwrw glaw; mae'r trothwyon yn dilyn trothwyon diwrnodau gwlyb y DU (mae 120 a 200 diwrnod yn cyfateb i tua 800 a 1,600 mm ar draws grid y DU)."}
  air_frost_days: {label: Diwrnodau o rew yn yr aer, description: "Diwrnodau y flwyddyn pan fo tymheredd yr aer yn disgyn o dan 0°C, cyfartaledd 1991–2020."}
  summer_days: {label: Diwrnodau o haf, description: "Diwrnodau y flwyddyn pan fo'r tymheredd yn cyrraedd 25°C, cyfartaledd 1991–2020."}
  wind_speed: {label: Gwynt, description: "Cyflymder cyfartalog y gwynt ar 10m, cyfartaledd 1991–2020."}
  future_hot_days: {label: Diwrnodau poeth o haf mewn byd 2°C yn gynhesach, description: "Diwrnodau y flwyddyn â thymheredd uchaf dros 30°C unwaith y bydd y byd wedi cynhesu 2°C, o ragamcanion lleol UKCP18 y Swyddfa Dywydd.", caveats: "Rhagamcaniad ar gyfer yr MSOA, y Parth Canolradd neu'r ardal etholiadol ddosbarth, wedi'i gopïo i bob ardal fach oddi mewn iddo (amcangyfrif ar gyfer y gymdogaeth, nid yr ardal fach); diwrnod poeth o haf yw un uwchlaw 30°C mewn unrhyw fis, canolrif un ar bymtheg o rediadau model UKCP18, felly mae llawer o'r gogledd yn dangos 0 ar 2°C ac mae'r cyfrif yn dweud pa mor aml y byddai diwrnodau o'r fath yn dod, nid pa mor boeth yw'r lle."}
  domestic_rates: {label: Ardrethi domestig (cartref nodweddiadol), description: "Bil ardrethi domestig blynyddol cartref ar werth cyfalaf canolrifol yr ardal, o'r gyfradd ranbarthol a chyfradd ardal y cyngor (Gogledd Iwerddon).", caveats: "Mae Gogledd Iwerddon yn codi ardrethi ar werth cyfalaf cartref yn hytrach na threth gyngor yn ôl band; mae'r bil a ddangosir ar gyfer cartref yng nghanol cymysgedd gwerthoedd 2016 yr ardal, felly mae'n symud gyda gwerthoedd lleol yn ogystal â'r gyfradd fesul punt."}
  snow_days: {label: Diwrnodau ag eira ar lawr, description: "Diwrnodau y flwyddyn ag eira ar lawr am 9am, cyfartaledd 1991–2020."}
  council_tax_typical: {label: Treth gyngor (cartref nodweddiadol yma), description: "Yr hyn mae cartref nodweddiadol yn yr ardal yn ei dalu mewn treth gyngor, tâl pob band wedi'i bwysoli yn ôl faint o gartrefi'r ardal sydd yn y band hwnnw.", caveats: "Mae'n defnyddio tâl y cyngor fesul band a chymysgedd bandiau'r ardal, felly mae ardal o dai teras band A yn dangos tua dwy ran o dair o gyfradd Band D y cyngor; nid yw gostyngiadau ac eithriadau wedi'u cynnwys."}
  gp_list_size: {label: Cleifion fesul practis meddyg teulu gerllaw, description: "Cleifion cofrestredig fesul practis yn y practisau meddyg teulu ger cartrefi, wedi'u pwysoli yn ôl pellter.", caveats: "Cleifion fesul practis, nid fesul meddyg: gall fod gan bractis mawr lawer o feddygon teulu. Y mesur gonest lle nad yw niferoedd meddygon teulu'n cael eu cyhoeddi (ym mhobman ond Lloegr)."}
  allotment_distance: {label: Pellter i'r rhandiroedd agosaf, description: "Pellter cyfartalog mewn llinell syth o gartrefi i'r rhandiroedd neu'r man tyfu cymunedol agosaf.", caveats: "Y pellter i'r safle, nid a oes llain ar gael; mae rhestrau aros yn ymestyn i flynyddoedd mewn llawer o drefi. Daw safleoedd Gogledd Iwerddon ac Iwerddon o OpenStreetMap."}
  radon_potential: {label: Cartrefi mewn ardal radon uchel, description: "Cyfran y cartrefi mewn sgwariau grid lle disgwylir i fwy na 10% o gartrefi fod uwchlaw lefel weithredu radon (atlas dangosol BGS ac UKHSA; map radon yr EPA yn Iwerddon).", caveats: "Mapio dangosol fesul sgwâr 1km (10km yn Iwerddon), nid mesuriad; mae chwiliad cod post UKHSA neu brawf EPA yn rhoi lefel y cartref ei hun, a gellir lleihau lefelau uchel."}
  ev_charging: {label: Pwyntiau gwefru cyhoeddus gerllaw, description: "Safleoedd gwefru cerbydau trydan cyhoeddus o fewn 1.5km i gartrefi, ar gyfartaledd (OpenStreetMap, ESB ar ynys Iwerddon, Open Charge Map).", caveats: "Mae'n cyfrif safleoedd gwefru, nid socedi na'u cyflymder, o OpenStreetMap, rhwydwaith ESB ar ynys Iwerddon a darparwyr Open Charge Map sydd â thrwydded agored (yr olaf dim ond pan fo allwedd gan y broses adeiladu); cafodd cofrestr genedlaethol pwyntiau gwefru'r DU ei chau yn 2024."}
  listed_buildings: {label: Adeiladau rhestredig gerllaw, description: "Adeiladau rhestredig o fewn 1km i gartrefi, fesul km² (Historic England, Cadw, Historic Environment Scotland a'r Adran Gymunedau; yn Iwerddon, y Rhestr Genedlaethol o Dreftadaeth Bensaernïol ar raddfa ranbarthol neu uwch).", caveats: "Dwysedd adeiladau gwarchodedig, fel arwydd o gymeriad hanesyddol; nid yw'n dweud dim am gyflwr y cartrefi, ac mae ffigur Iwerddon yn cyfrif argymhellion y Rhestr yn hytrach na chofnodion statudol y cynghorau."}

