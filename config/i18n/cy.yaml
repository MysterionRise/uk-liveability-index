# Cymraeg labels for the data: themes, indicators (label, unit, description), presets and
# the profile flags. English stays in indicators.yaml and weights.yaml; anything missing
# here falls back to it. `_meta.status` is "draft" until a fluent reviewer signs it off
# (see docs/i18n.md). Drafted with the TermCymru termbase in mind, 8 October 2026.
_meta: {status: draft, reviewer: null, date: 2026-10-08}

