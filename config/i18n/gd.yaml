# Gàidhlig labels for the data: themes, indicators (label, description), presets, the
# profile flags and the words for each nation's area tiers. English stays in
# indicators.yaml and weights.yaml; anything missing here falls back to it. `_meta.status`
# is "draft" until a fluent reviewer signs it off (see docs/i18n.md). Drafted 13 October
# 2026 for the Scotland release (#69).
_meta: {status: draft, reviewer: null, date: 2026-10-13}

themes:
  safety: {label: Sàbhailteachd, description: "Eucoir agus giùlan mì-shòisealta a chaidh a chlàradh far a bheil daoine a' fuireach."}
  environment: {label: Àrainneachd, description: "Èadhar glan, sràidean sàmhach, craobhan agus àiteachan uaine faisg air làimh, agus cunnart tuil."}
  health: {label: Seirbheisean slàinte, description: "Dè cho furasta 's a tha e do luchd-còmhnaidh dotair-teaghlaich, cungadair no fiaclair fhaicinn."}
  education: {label: Sgoiltean agus cùram-chloinne, description: "Sgoiltean agus sgoiltean-àraich math taobh a-staigh ruigsinn."}
  transport: {label: Còmhdhail agus ceangalachd, description: "Dè cho math 's a tha sgìre a' ceangal ri obraichean agus seirbheisean air gach dòigh, agus a bann-leathann."}
  amenities: {label: Goireasan agus beatha na h-oidhche, description: "Bùthan, cafaidhean, taighean-seinnse math, cur-seachadan agus cultar faisg air làimh."}
  housing: {label: Taigheadas agus cosgaisean, description: "Na chosgas dachaighean agus staid an stoc thaighean."}
  community: {label: Coimhearsnachd agus sunnd, description: "Teachd-a-steach, obair agus slàinte nan daoine a tha a' fuireach ann."}
  climate: {label: Gnàth-shìde, description: "Grian, uisge agus cho blàth 's a tha an samhradh agus cho ciùin 's a tha an geamhradh, bho chuibheasachdan deich bliadhna fichead."}

presets:
  balanced: {label: Cothromaichte, description: "Tha gach cuspair a' cunntadh gu co-ionann."}
  family: {label: Teaghlach le clann, description: "Sgoiltean agus sgoiltean-àraich math, sàbhailteachd agus àiteachan uaine an toiseach."}
  young_professional: {label: Proifeiseantach òg, description: "Ceanglaichean, rudan ri dhèanamh agus taighean-seinnse math; chan eil sgoiltean cho cudromach."}
  retiree: {label: Air cluaineas, description: "Sàbhailteachd, seirbheisean slàinte, èadhar glan agus sgìre nas sàmhaiche."}
  commuter: {label: Neach-siubhail, description: "Ceanglaichean luath ri obraichean, air còmhdhail phoblach gu h-àraidh."}

units:
  gbp: "£"
  gbp_year: "£ sa bhliadhna"
  pct: "%"
  pct_homes: "% de dhachaighean"
  pct_pupils: "% de sgoilearan"
  pct_working_age: "% de dhaoine aois 16–64"
  metres: meatairean
  km: km
  per_1000_year: "gach 1,000 luchd-còmhnaidh sa bhliadhna"
  score: sgòr
  score_100: "sgòr 0–100"
  ugm3: "µg/m³"
  index: "clàr-amais 0–1"
  quality: "càileachd 0–1"
  rating: "rangachadh 0–1 (Math = 0.75)"
  rate: ìre
  collisions_year: "tubaistean sa bhliadhna taobh a-staigh 500m"
  patients_per_gp: "euslaintich gach dotair-teaghlaich làn-ùine"
  attainment8: "Coileanadh 8"
  buses_hour: "busaichean san uair"
  years_income: "bliadhnaichean de theachd-a-steach"
  years: bliadhnaichean
  people_km2: "daoine gach km²"
  per_km2: "gach km²"
  radiance: "nW/cm²/sr"
  hours_year: "uairean sa bhliadhna"
  days_year: "làithean sa bhliadhna"
  celsius: "°C"
  mm_year: "mm sa bhliadhna"
  m_s: "m/s"
  within_1500m: "taobh a-staigh 1.5km"
  patients_per_practice: "euslaintich gach cleachdadh"
  km_per_km2: "km gach km²"
  hectares: "heactairean"
  pct_slope: "% leathad"
  class4: "ìre 1–4 (4 = sàr-mhath)"
  class5: "ìre 1–5 (5 = àrd)"

flags:
  imputed: "Is e tuairmsean a th' anns na figearan eucoir an seo: chan eil Poileas Greater Manchester a' foillseachadh dàta aig ìre sràide."
  low_n: "Cha deach ach beagan dhachaighean a reic an seo sa bhliadhna a dh'fhalbh, mar sin tha a' phrìs air a daingneachadh a dh'ionnsaigh na sgìre mun cuairt."
  broadcast_lad: "Tha càileachd nan àrd-sgoiltean a' tighinn bho thoraidhean deuchainnean na comhairle gu lèir, oir chan eil an nàisean seo a' foillseachadh thoraidhean no ìrean sgrùdaidh airson gach sgoil."
  not_available: "Chan eil cuid de thaisbeanairean ri fhaighinn san nàisean seo fhathast; tha an cuspair a' cleachdadh na tha aige."
  theme_gap: "Tha ro bheag de dhàta fosgailte aig an nàisean seo airson aon chuspair a sgòradh: tha e air a shealltainn mar dhàta cuingealaichte agus air fhàgail a-mach às an iomlan."

# What the interface calls each nation's areas (one, several)
levels:
  E:
    low: {one: sgìre bheag, other: sgìrean beaga}
    mid: {one: nàbachd, other: nàbachdan}
    upper: {one: comhairle, other: comhairlean}
  W:
    low: {one: sgìre bheag, other: sgìrean beaga}
    mid: {one: nàbachd, other: nàbachdan}
    upper: {one: comhairle, other: comhairlean}
  S:
    low: {one: sòn dàta, other: sònaichean dàta}
    mid: {one: sòn eadar-mheadhanach, other: sònaichean eadar-mheadhanach}
    upper: {one: sgìre comhairle, other: sgìrean comhairle}
  N:
    low: {one: àrd-shòn dàta, other: àrd-shònaichean dàta}
    mid: {one: àrd-shòn dàta, other: àrd-shònaichean dàta}
    upper: {one: comhairle, other: comhairlean}
  I:
    low: {one: sgìre bheag, other: sgìrean beaga}
    mid: {one: roinn-taghaidh, other: roinnean-taghaidh}
    upper: {one: comhairle, other: comhairlean}

indicators:
  crime_violence: {label: Eucoirean fòirneart agus gnèitheasach, description: "Fòirneart agus eucoirean gnèitheasach a chaidh a chlàradh gach 1,000 luchd-còmhnaidh sa bhliadhna (cuibheas 36 mìosan).", caveats: "Tha na h-ìrean air an obrachadh a-mach a rèir luchd-còmhnaidh, agus mar sin bidh meadhanan nam bailtean aig a bheil glè bheag de luchd-còmhnaidh agus tòrr luchd-tadhail a' faighinn droch sgòr. Chan eil Poileas Greater Manchester a' foillseachadh dàta sam bith; tha an sgìre aige air a tuairmseadh à raon eucoir IoD 2025."}
  crime_burglary: {label: Bristeadh a-steach, description: "Bristidhean a-steach a chaidh a chlàradh gach 1,000 luchd-còmhnaidh sa bhliadhna."}
  crime_asb: {label: Giùlan mì-shòisealta, description: "Tachartasan giùlain mhì-shòisealta a chaidh aithris gach 1,000 luchd-còmhnaidh sa bhliadhna."}
  crime_theft: {label: "Robaireachd, mèirle agus eucoir charbadan", description: "Robaireachd, mèirle bhon neach, eucoir charbadan agus mèirle bhaidhsagalan gach 1,000 luchd-còmhnaidh sa bhliadhna."}
  crime_damage_disorder: {label: Milleadh eucorach agus òrdugh poblach, description: "Milleadh eucorach, losgadh-dhìol agus eucoirean òrduigh phoblaich gach 1,000 luchd-còmhnaidh sa bhliadhna."}
  road_danger: {label: Tubaistean rathaid trom faisg air làimh, description: "Tubaistean rathaid anns an deach cuideigin a mharbhadh no a leòn gu trom taobh a-staigh 500m de dhachaighean, sa bhliadhna (cuibheas 5 bliadhna).", caveats: "Bidh rathaidean trang faisg air dachaighean a' togail a' chunntais ge b' e cò a bha an sàs ann. Ghluais feachdan poileis gu siostam ùr airson aithris air leòntan aig amannan eadar-dhealaichte, a bhios a' clàradh barrachd leòntan mar fheadhainn throm."}
  iod_crime: {label: Raon eucoir a' chlàr-amais bochdainn, description: "Cunnart modailte de dh'fhulangas pearsanta agus seilbhe (dàta 2021–2023)."}
  recorded_crime: {label: Eucoir a chaidh a chlàradh (SIMD), description: "Eucoirean a chaidh a chlàradh gach 1,000 luchd-còmhnaidh sa bhliadhna ann an Clàr-amais Ioma-bhochdainn na h-Alba 2020, air an toirt gu sònaichean dàta 2022.", caveats: "Chan eil Poileas na h-Alba a' foillseachadh dàta fosgailte aig ìre sràide, agus mar sin tha ìre SIMD a' seasamh an àite nan ceithir taisbeanairean eucoir; tha i a' còmhdach a h-uile eucoir a chaidh a chlàradh (fòirneart, eucoirean gnèitheasach, bristeadh a-steach, milleadh, drogaichean agus ionnsaigh chumanta) agus tha i nas sine na an uinneag-ùine police.uk a thathar a' cleachdadh an àiteigin eile."}
  no2: {label: Dà-ogsaid naitridean (NO₂), description: "NO₂ cùil cuibheasach bliadhnail far a bheil luchd-còmhnaidh a' fuireach (modail 1km Defra; ann an Èirinn, mapa 1km an EEA).", caveats: "Dùmhlachdan cùil; tha ìrean ri taobh rathaid air sràidean trang nas àirde. Is e 10 µg/m³ an stiùireadh aig WHO."}
  pm25: {label: Mìon-ghràineanan (PM2.5), description: "PM2.5 cùil cuibheasach bliadhnail far a bheil luchd-còmhnaidh a' fuireach (modail 1km Defra; ann an Èirinn, mapa 1km an EEA).", caveats: "Is e 5 µg/m³ an stiùireadh aig WHO."}
  green_space_access: {label: Pàircean agus àiteachan uaine faisg air làimh, description: "Dorsan a-steach gu pàircean, gàrraidhean agus raointean-cluiche poblach taobh a-staigh coiseachd 1km, air an cuideamachadh a rèir astair (ann an Èirinn a Tuath agus ann an Èirinn, pàircean agus raointean OpenStreetMap).", caveats: "Tha seo a' cunntadh pàircean poblach agus raointean-cluiche, chan e dùthaich fhosgailte, agus mar sin bidh clachain a tha air an cuairteachadh le achaidhean agus slighean-coiseachd a' faighinn sgòr nas ìsle na tha iad a' faireachdainn. Chan eil toradh fosgailte àiteachan uaine aig Èirinn a Tuath, agus mar sin tha na pàircean, na gàrraidhean agus na raointean-cluiche aice a' tighinn à OpenStreetMap agus air an tomhas chun oir as fhaisge den làrach seach chun nan dorsan a-steach aice."}
  play_spaces: {label: Raointean-cluiche faisg air làimh, description: "Dorsan a-steach gu raointean-cluiche poblach taobh a-staigh 800m de dhachaighean, air an cuideamachadh a rèir astair (ann an Èirinn a Tuath agus ann an Èirinn, raointean-cluiche OpenStreetMap)."}
  flood_risk: {label: Dachaighean ann an cunnart tuil, description: "Cuid de dhachaighean ann an cunnart àrd no meadhanach tuil bho aibhnichean, bhon mhuir no bho uisge-uachdair (co-dhiù 1% de sheans sa bhliadhna).", caveats: "Tha gach dachaigh air a rangachadh a rèir an nas àirde de mheasadh nan aibhnichean is na mara agus measadh an uisge-uachdair, a bheir aire do dhìonan an aghaidh thuiltean; chan eil tuil uisge-talmhainn agus tuil bho chlaisean-òtrachais air an gabhail a-steach. Is e seòlaidhean a tha anns na cunntasan aig Sasainn, agus mar sin bidh bùthan air àrd-shràid a tha buailteach do thuil a' cunntadh cuideachd. Sa Chuimrigh, bidh NRW a' foillseachadh raointean cunnairt seach cunntasan, agus mar sin tha dachaighean ann an cunnart air an tuairmseadh bhon chuid de phuingean seilbhe na sgìre a tha taobh a-staigh nan raointean àrda is meadhanach. Tha mapaichean SEPA na h-Alba air an leughadh san aon dòigh, leis a' bhann mheadhanach aig 1 ann an 200 sa bhliadhna (nas fharsainge na 1 ann an 100 aig an EA)."}
  flood_rivers_sea: {label: Dachaighean ann an cunnart bho aibhnichean no bhon mhuir, description: "Cuid de dhachaighean ann an cunnart àrd no meadhanach tuil bho aibhnichean no bhon mhuir a-mhàin (co-dhiù 1% de sheans sa bhliadhna).", caveats: "A' chuid de chunnart tuil a tha a' tighinn bho aibhnichean agus bhon mhuir; is e uisge-uachdair an còrr. Tha dìonan an aghaidh thuiltean air an gabhail a-steach."}
  noise_exposure: {label: Dachaighean ann am fuaim còmhdhail no gnìomhachais, description: "Cuid de dhachaighean far a bheil fuaim mapaichte a' ruighinn 60 dB Lden no barrachd thar an latha, an fheasgair agus na h-oidhche (rathaidean, rèile agus itealain ann an Sasainn; rathaidean, rèile agus gnìomhachas sa Chuimrigh; gach tùs mapaichte ann an Alba, Èirinn a Tuath agus Èirinn).", caveats: "Tha gach dachaigh air a leughadh bhon ghriod fuaim 10m aig a còd-puist agus tha an tùs mapaichte as fhuaimneiche a' cunntadh. Tha mapaichean Shasainn a' còmhdach rathaidean, rèile agus na sia puirt-adhair deug a tha air am mapadh, mapaichean na Cuimrigh rathaidean, rèile is gnìomhachas, mapa aonaichte na h-Alba a h-uile tùs a' gabhail a-steach gnìomhachas, agus loidhnichean-fuaim cuairt 3 (2017) Èirinn a Tuath rathaidean, rèile, gnìomhachas agus Belfast City Airport ann am mòr-bhailtean Bhéal Feirste is Dhoire, cho math ris na prìomh rathaidean agus rèilichean eatorra. Is e 60 dB Lden an ìre-ghearraidh, ìre rathaid thrang, oir chan eil rathaidean beaga air am mapadh ach taobh a-staigh nam bailtean as motha ann an Sasainn."}
  aircraft_noise: {label: Dachaighean ann am fuaim itealain, description: "Cuid de na dachaighean far a bheil fuaim itealain a' cuibheasachadh 55 dB Lden no barrachd, timcheall nan sia puirt-adhair deug a tha air am mapadh ann an Sasainn.", caveats: "Loidhnichean-fuaim 55 dB Lden Heathrow, Gatwick, Stansted, Luton, London City, Southend, Manchester, Liverpool, Birmingham, East Midlands, Leeds Bradford, Newcastle, Bristol, Bournemouth agus Southampton airson 2021, bliadhna anns an robh nas lugha de thursan-adhair na b' àbhaist; tha dachaighean taobh a-muigh nan loidhnichean sin a' sealltainn 0 ge b' e dè na raointean-itealain nas lugha a chluinneas iad."}
  industrial_noise: {label: Dachaighean ann am fuaim gnìomhachais, description: "Cuid de na dachaighean far a bheil fuaim gnìomhachais a' cuibheasachadh 55 dB Lden no barrachd, timcheall làraichean mapaichte na Cuimrigh, ann an còig bailtean mapaichte na h-Alba, ann an dà bhaile-mòr Èirinn a Tuath agus timcheall làraichean mapaichte Èirinn.", caveats: "Air a mhapadh a-mhàin timcheall làraichean gnìomhachais na Cuimrigh (cuairt 2022), ann an Obar Dheathain, Dùn Dè, Dùn Èideann, san Eaglais Bhreac agus Glaschu, ann am Béal Feirste agus Doire (2017) agus timcheall làraichean gnìomhachais ceadaichte Èirinn (cuairt 4 an EPA); an àiteigin eile anns na nàisean sin is e 0 an luach seach neo-aithnichte."}
  night_noise: {label: Dachaighean ann am fuaim na h-oidhche, description: "Cuid de na dachaighean far a bheil fuaim mhapaichte a' cuibheasachadh 50 dB Lnight no barrachd eadar 23:00 agus 07:00, an ìre aig a bheil an Stiùireadh Fuaim Àrainneachdail a' cunntadh dhaoine mar fhosgailte dhi air an oidhche.", caveats: "Companach na h-oidhche aig mapaichean an latha, air a leughadh aig gach dachaigh bho na h-aon ghriodan 10m agus loidhnichean-fuaim (breathan rathaid, rèile agus phort-adhair Shasainn airson 2021, breathan rathaid, rèile agus gnìomhachais na Cuimrigh 2022, mapa aonaichte na h-Alba 2021, loidhnichean-fuaim Èirinn a Tuath 2017, loidhnichean-fuaim cuairt 4 Èirinn); tha an tùs mapaichte as fhuaimneiche a' cunntadh. Is e 50 dB Lnight ìre aithris na h-oidhche aig an Stiùireadh, agus mar sin tha rathad beag gun mhapadh a' sealltainn cho sàmhach an seo 's a tha e tron latha."}
  road_rail_noise: {label: Dachaighean ann am fuaim rathaid no rèile, description: "Cuid de dhachaighean far a bheil fuaim rathaid no rèile a' ruighinn 60 dB Lden no barrachd thar an latha, an fheasgair agus na h-oidhche, bho na mapaichean fuaim ro-innleachdail.", caveats: "Tha gach dachaigh air a leughadh bhon ghriod fuaim 10m aig a còd-puist. Tha mapaichean Shasainn a' còmhdach a h-uile rathad taobh a-staigh nam bailtean agus nan cathraichean as motha agus prìomh rathaidean a-mhàin an àiteigin eile, ach tha mapaichean na Cuimrigh a' còmhdach a h-uile rathad, agus mar sin is e 60 dB Lden an ìre-ghearraidh, ìre rathaid thrang, seach na 55 dB aig a bheil an Stiùireadh Fuaim Àrainneachdail a' cunntadh dhaoine mar fhosgailte agus aig am biodh sràidean àbhaisteach a' cunntadh a-mhàin far an deach am mapadh. Chan eil itealain agus gnìomhachas air an gabhail a-steach."}
  coast_distance: {label: Astar chun a' chladaich, description: "Astar bho dhachaighean chun a' chladaich as fhaisge, ann an cilemeatairean (comharra àrd-làin ann am Breatainn Mhòr agus Èirinn, iomall-crìche Èirinn a Tuath).", caveats: "Astar ann an loidhne dhìreach chun na puing as fhaisge den chladach mapaichte, a tha a' ruith suas inbhirean, lochan mara agus aibhnichean làin cho fada 's a tha comharra àrd-làin a' dol (tha Norwich, Gloucester agus Wisbech a' sealltainn fo 2 km); tomhas air cho faisg 's a tha uisge làin, chan e air ruigsinneachd gu tràigh. Chan e cladach a th' ann an lochan-fìor-uisge no lochan a-staigh san dùthaich."}
  sealed_surface: {label: Fearann togte timcheall dhachaighean, description: "Cuid den fhearann taobh a-staigh 500m de dhachaighean a tha còmhdach-fearainn saideil a' seòrsachadh mar fhearann togte, is e sin togalaichean, rathaidean is uachdaran cruaidh eile (ESA WorldCover, 10m).", caveats: "Tha cealla 10m a' cunntadh mar fhearann togte nuair is e uachdaran seulaichte as motha ann, agus mar sin bidh gàrraidhean agus oirean-rathaid eadar taighean a' lùghdachadh na cuid; mapa a tha ag ràdh tha no chan eil de 2021 a th' ann, chan e tomhas air cho seulaichte 's a tha gach cealla. Tha uisge agus ceallan gun mhapadh air am fàgail a-mach à iomlan an fhearainn."}
  protected_nature: {label: Nàdar dìonte faisg air làimh, description: "Heactairean de dh'fhearann taobh a-staigh mu 2km de dhachaighean a tha dìonte airson nàdair (Làraichean Sònraichte Saidheansail, tèarmannan nàdair, Raointean Sònraichte Glèidhteachais is Raointean Dìon Sònraichte; ann an Èirinn, Raointean Sònraichte Glèidhteachais, Raointean Dìon Sònraichte is Raointean Dualchais Nàdarra).", caveats: "Crìochan fhèin gach ainmeachaidh, air an aonachadh gus am bi fearann a tha dìonta dà uair a' cunntadh aon uair, agus air an gearradh chun an fhearainn, agus mar sin tha làraichean mara air am fàgail a-mach; air an tomhas thairis air uinneag le farsaingeachd cearcaill 2km timcheall gach dachaigh (mu 1,257 ha aig a' char as motha) air griod 50m. Chan eil Èirinn a Tuath a' foillseachadh breath nàiseanta de thèarmannan nàdair ionadail, agus is e seata Èirinn am fear reachdail, às aonais nan Raointean Dualchais Nàdarra a chaidh a mholadh ann an 1995."}
  hilliness: {label: Cnocachas timcheall dhachaighean, description: "Leathad cuibheasach na talmhainn taobh a-staigh mu 500m de dhachaighean, mar cheudad (bidh leathad 10% ag èirigh 10m gach 100m).", caveats: "Leathad a rèir modh Horn air griod 50m, bho OS Terrain 50 ann am Breatainn Mhòr agus modail talmhainn 50m aig OSNI ann an Èirinn a Tuath; tha an tè aig Èirinn a' tighinn à Copernicus GLO-30, modail uachdair anns a bheil togalaichean agus craobhan a' cur ri àirde, agus mar sin tha bailtean is coilltean na h-Èireann a' sealltainn beagan nas cnocaiche na tha an talamh. Tha talamh nas còmhnairde nas fhasa air chois agus air baidhsagal; chan eil an dath ag ràdh gu bheil gin dhiubh nas fheàrr."}
  elevation: {label: Àirde os cionn ìre na mara, description: "Àirde chuibheasach dhachaighean os cionn ìre na mara, ann am meatairean, bhon ghriod talmhainn 50m.", caveats: "An àirde aig a' chealla 50m anns a bheil gach dachaigh; tha an tè aig Èirinn a' tighinn à modail uachdair, a tha a' cur àirde thogalaichean is chraobhan ris. Chan eil àrd no ìosal nas fheàrr; chan eil an sgèile dhathan ach ag òrdachadh nan sgìrean."}
  storm_overflow_spills: {label: Dòrtadh òtrachais faisg air làimh, description: "Na h-uairean sa bhliadhna a dhòirt dòrtaidhean stoirme taobh a-staigh 2km de dhachaighean òtrachas a-steach do aibhnichean is dhan mhuir, air an cur ri chèile (Sgrùdadh Faid Thachartasan aig Buidheann na h-Àrainneachd).", caveats: "Sgrùdadh nan companaidhean uisge fhèin air às-ruith gach dòrtaidh stoirme thairis air a' bhliadhna-mhìosachain as ùire, mus tèid na dòrtaidhean a chur ri chèile gu bhith nan dòrtaidhean a thathar a' cunntadh; bidh dòrtadh stoirme aig an robh an sgrùdair ag obair airson nas lugha na 90% den bhliadhna ag aithris nas lugha na a thachair. Bidh dòrtadh a' ruighinn na h-aibhne shìos an sruth, agus dh'fhaodadh sin a bhith nas fhaide na 2km bho na dachaighean a thathar a' cunntadh an seo. Sasainn a-mhàin, oir tha na tillidhean Cuimreach a' dol gu Natural Resources Wales agus chan eil Alba, Èirinn a Tuath agus Èirinn a' foillseachadh clàr bliadhnail slàn."}
  bathing_water_distance: {label: Astar gu uisge-snàimh, description: "Astar bho dhachaighean chun an uisge-snàimh ainmichte as fhaisge (tràigh, loch no pìos aibhne a thathar a' sgrùdadh airson luchd-snàimh), ann an cilemeatairean.", caveats: "Astar ann an loidhne dhìreach chun na puing-sampaill (ann an Èirinn a Tuath meadhan na sgìre ainmichte). Chan eil ach uisgeachan a chaidh ainmeachadh mar uisge-snàimh a' cunntadh, agus mar sin chan eil tràigh no loch breagha ach gun ainmeachadh a' cunntadh; stadaidh an lorg aig 100km."}
  bathing_water_class: {label: Càileachd uisge-snàimh faisg air làimh, description: "Ìre an uisge-snàimh ainmichte as fhaisge taobh a-staigh 10km de dhachaighean, bho 4 (Sàr-mhath) tro Math is Iomchaidh gu 1 (Bochd), airson an t-seusain as ùire.", caveats: "Ìre an uisge-snàimh as fhaisge air gach dachaigh, air a cuibheasachadh thar dachaighean na sgìre; chan eil luach aig sgìre far a bheil nas lugha na leth de na dachaighean le fear taobh a-staigh 10km. Tha na h-ìrean stèidhichte air ceithir seusain de shamplaichean (trì airson uisgeachan a chaidh ainmeachadh bho 2022), agus tha feadhainn Èirinn a Tuath air an tar-sgrìobhadh à sanas bliadhnail DAERA."}
  river_status: {label: Slàinte aibhnichean is lochan faisg air làimh, description: "Inbhe na h-aibhne no an locha as fhaisge taobh a-staigh 2km de dhachaighean fo Stiùireadh Frèam an Uisge, bho 5 (Àrd) tro Math, Meadhanach is Bochd gu 1 (Dona).", caveats: "Inbhe na h-aibhne no an locha as fhaisge air gach dachaigh, air a cuibheasachadh thar dachaighean na sgìre; chan eil luach aig sgìre far a bheil nas lugha na leth de na dachaighean le fear taobh a-staigh 2km. Inbhe eag-eòlasach ann an Sasainn (2025), sa Chuimrigh (2024, eadar-amail), ann an Èirinn a Tuath (2018, an tè as ùire a tha fosgailte) agus ann an Èirinn (2019–2024); inbhe iomlan ann an Alba (2024), an aon ìre a tha SEPA a' foillseachadh gu fosgailte. Chan eil ach na cuirp-uisge a tha na buidhnean a' seòrsachadh a' cunntadh, agus mar sin chan eil sruthain bheaga is lòintean a' cunntadh."}
  tree_canopy: {label: Còmhdach chraobhan timcheall dhachaighean, description: "Cuid den fhearann taobh a-staigh 500m de dhachaighean a tha còmhdach-fearainn saideil a' seòrsachadh mar chòmhdach chraobhan (ESA WorldCover, 10m).", caveats: "Tha cealla 10m a' cunntadh mar chòmhdach chraobhan nuair is e craobhan as motha ann, agus mar sin tha seo a' sealltainn mu dhà uiread de sgrùdadh còmhdach nan craobhan aig Forest Research (a bhios a' sampaill phuingean) fhad 's a tha e a' rangachadh nan uàrdan cha mhòr san aon dòigh; bidh craobhan gàrraidh singilte agus callaidean-fàil a' dol air chall. Tha uisge agus ceallan gun mhapadh air am fàgail a-mach à iomlan an fhearainn, agus mar sin tha dachaigh air aghaidh na mara air a breithneachadh a rèir an fhearainn air a cùlaibh."}
  light_pollution: {label: Solas na h-oidhche, description: "Deàrrsadh oidhche cuibheasach taobh a-staigh 1km de dhachaighean, bho cho-mheasgachadh bliadhnail saideil VIIRS (nW/cm²/sr).", caveats: "Tha nas soilleire a' ciallachadh barrachd solais air sràidean agus air togalaichean agus mar sin nas lugha de shealladh de dh'adhar na h-oidhche; tha e a' leantainn dùmhlachd agus a' gearradh an dà thaobh, agus is e sin as adhbhar gu bheil e air a shealltainn ach gun a bhith air a sgòradh. Tha an saideal dall do phàirt ghorm de sholas LED, agus mar sin tha sràidean a chaidh atharrachadh o chionn ghoirid a' sealltainn nas dorcha na tha iad a' coimhead."}
  iod_outdoors: {label: Àrainneachd-còmhnaidh a-muigh IoD 2025, description: "Càileachd èadhair agus tubaistean trafaig rathaid (fo-raon IoD 2025)."}
  hospital_ae_distance: {label: Astar chun an A&E as fhaisge, description: "Astar dìreach cuibheasach bho dhachaighean chun na roinn èiginn fo stiùir co-chomhairliche as fhaisge.", caveats: "Tha roinnean na h-Alba a' tighinn à liosta Public Health Scotland; tha feadhainn Shasainn is na Cuimrigh a' tighinn bho ospadalan OpenStreetMap a tha air an comharrachadh mar gu bheil roinn èiginn aca, agus dh'fhaodadh cuid de dh'aonadan mion-leòntan a bhith nam measg. Tha dachaighean aig nach eil dad taobh a-staigh 50km a' sealltainn 50km, crìoch an luirg, chan e astar a chaidh a thomhas."}
  hospital_distance: {label: Astar chun a' chùraim èiginnich as fhaisge, description: "Astar dìreach cuibheasach bho dhachaighean chun na roinn èiginn no an aonaid mhion-leòntan as fhaisge.", caveats: "Tha dachaighean aig nach eil dad taobh a-staigh 50km a' sealltainn 50km, crìoch an luirg, chan e astar a chaidh a thomhas."}
  gp_distance: {label: Astar chun a' chleachdaidh dhotair-teaghlaich as fhaisge, description: "Astar dìreach cuibheasach bho dhachaighean chun a' chleachdaidh dhotair-teaghlaich as fhaisge."}
  patients_per_gp: {label: Euslaintich gach dotair-teaghlaich, description: "Euslaintich clàraichte gach dotair-teaghlaich teisteanaichte làn-ùine aig na cleachdaidhean a bhios luchd-còmhnaidh a' cleachdadh.", caveats: "Chan eil dotairean-teaghlaich fo thrèanadh air an gabhail a-steach; tha cleachdaidhean a tha ag aithris nas lugha na aon dotair-teaghlaich làn-ùine air am fàgail a-mach às a' chuibheasachd."}
  gp_quality: {label: Rangachaidhean chleachdaidhean dhotairean-teaghlaich, description: "Rangachaidhean CQC nan cleachdaidhean dhotairean-teaghlaich air a bheil luchd-còmhnaidh clàraichte, air an cuideamachadh a rèir cia mheud a chleachdas gach fear.", caveats: "Tha a' mhòr-chuid de chleachdaidhean air an rangachadh Math, agus tha cuid de na rangachaidhean grunn bhliadhnaichean a dh'aois."}
  care_homes: {label: Dachaighean-cùraim le deagh rangachadh faisg air làimh, description: "Leapannan ann an dachaighean-cùraim air an rangachadh Math no Air leth le CQC taobh a-staigh 5km, air an cuideamachadh a rèir astair."}
  pharmacy_distance: {label: Astar chun a' chungadair as fhaisge, description: "Astar dìreach cuibheasach bho dhachaighean chun a' chungadair coimhearsnachd NHS as fhaisge.", caveats: "Chan eil cleachdaidhean dotairean-teaghlaich dùthchail a bhios a' sgaoileadh chungaidhean iad fhèin air an cunntadh. Tha cungadairean na Cuimrigh a' tighinn à OpenStreetMap, oir chan eil liosta NWSSP so-leughte le inneal."}
  dentist_distance: {label: Astar chun an fhiaclair NHS as fhaisge, description: "Astar dìreach cuibheasach bho dhachaighean chun a' chleachdaidh fhiaclaireachd le cùmhnant NHS as fhaisge.", caveats: "Chan eil e air fhoillseachadh mar dhàta fosgailte a bheil cleachdadh a' gabhail ri euslaintich NHS ùra."}
  primary_school_quality: {label: Bun-sgoiltean math faisg air làimh, description: "Càileachd nan trì bun-sgoiltean stàite as fhaisge (Ofsted agus toraidhean), le feadhainn nas fhaisge a' cunntadh barrachd.", caveats: "Tha a' chàileachd a' measgachadh Ofsted (60%) agus toraidhean Prìomh Ìre 2 mar ìre-cheudad (40%); tha na toraidhean a' nochdadh nan sgoilearan a tha a' tighinn a-steach a bharrachd air an teagasg. Chan e inntrigeadh a th' ann an astar; bidh sgoiltean aig a bheil barrachd iarrtasan na àiteachan a' gabhail a-steach a rèir sgìre-tharraing no creideimh. Chan eil seo ri fhaighinn sa Chuimrigh, ann an Alba no ann an Èirinn a Tuath, nach eil a' foillseachadh toraidhean bun-sgoile no ìrean sgrùdaidh."}
  secondary_school_quality: {label: Àrd-sgoiltean math faisg air làimh, description: "Càileachd nan trì àrd-sgoiltean stàite as fhaisge (sgrùdaidhean agus toraidhean), le feadhainn nas fhaisge a' cunntadh barrachd.", caveats: "Tha a' chàileachd a' measgachadh Ofsted (60%) agus Coileanadh 8 mar ìre-cheudad (40%); chan eil Adhartas 8 air fhoillseachadh airson 2024/25. Sa Chuimrigh, far nach eil toraidhean no ìrean sgrùdaidh airson gach sgoil air am foillseachadh, tha sgòr puingean Capped 9 na comhairle a' seasamh an àite gach sgoile innte (air a chomharrachadh le broadcast_lad). Ann an Alba is e càileachd sgòr taraif cuibheasach luchd-fàgail na sgoile aig gach sgoil mar ìre-cheudad taobh a-staigh Alba; chan eil ìrean sgrùdaidh air am foillseachadh mar dhàta fosgailte."}
  school_choice: {label: Roghainn de sgoiltean math, description: "Bun-sgoiltean stàite math taobh a-staigh 2km agus àrd-sgoiltean taobh a-staigh 5km, air an cuideamachadh a rèir càileachd agus astair."}
  primary_results: {label: Toraidhean bun-sgoile faisg air làimh, description: "Cuid de sgoilearan a' ruighinn na h-ìre ris am biodh dùil ann an leughadh, sgrìobhadh agus matamataig aig bun-sgoiltean stàite taobh a-staigh 2km (cuibheas 3 bliadhna), air an cuideamachadh a rèir astair.", caveats: "Tha na toraidhean a' nochdadh cùl-raon nan sgoilearan a bharrachd air an teagasg; chan eil tomhasan adhartais air am foillseachadh airson 2024/25."}
  secondary_results: {label: Toraidhean àrd-sgoile faisg air làimh, description: "Sgòr Coileanadh 8 cuibheasach aig àrd-sgoiltean stàite taobh a-staigh 5km, air an cuideamachadh a rèir astair.", caveats: "Tha na toraidhean a' nochdadh cùl-raon nan sgoilearan a bharrachd air an teagasg; chan eil Adhartas 8 air fhoillseachadh airson 2024/25 no 2025/26."}
  nursery_access: {label: Sgoiltean-àraich math faisg air làimh, description: "Sgoiltean-àraich, ro-sgoiltean agus clasaichean-àraich sgoile taobh a-staigh 1km, gach tè air a cuideamachadh a rèir a h-ìre sgrùdaidh agus astair.", caveats: "Chan eil làraichean luchd-coimhid chloinne air am mapadh (tha Ofsted a' cumail air ais an seòlaidhean). Sa Chuimrigh tha sgoiltean-àraich a' tighinn à OpenStreetMap (chan eil CIW a' foillseachadh liosta de sholaraichean) agus a' cunntadh mar chàileachd chuibheasach; tha clasaichean-àraich sgoile air an gabhail a-steach bho liosta sgoiltean na Cuimrigh. Ann an Alba tha gach sgoil-àraich air a cuideamachadh a rèir na h-ìrean Care Inspectorate aice."}
  connectivity_overall: {label: Ceangalachd iomlan, description: "Sgòr ceangalachd DfT thar gach dòigh-siubhail agus ceann-uidhe."}
  connectivity_public_transport: {label: Ceangalachd còmhdhail phoblaich, description: "Sgòr ceangalachd DfT airson còmhdhail phoblaich gu gach ceann-uidhe."}
  connectivity_walking: {label: Coiseachdachd, description: "Sgòr ceangalachd DfT airson coiseachd gu gach ceann-uidhe."}
  cycle_infrastructure: {label: Slighean is sreathan baidhsagail faisg air làimh, description: "Cilemeatairean de shlighean baidhsagail, de thracaichean baidhsagail is de shreathan baidhsagail peantaichte gach km² taobh a-staigh 1km de dhachaighean (OpenStreetMap).", caveats: "Bun-structar baidhsagail mar a tha OpenStreetMap ga mhapadh, a tha nas làine ann an cathraichean: slighean baidhsagail, slighean far a bheil baidhsagal air ainmeachadh, agus sreathan no tracaichean ri taobh rathaid (tha sreath air gach taobh de shràid a' cunntadh aon uair). Chan eil cabhsairean co-roinnte às aonais an ainmeachaidh sin, no sràidean sàmhach, air an cunntadh."}
  street_connectivity: {label: Ceangalachd shràidean, description: "Snaimean de shràidean is de shlighean coiseachd gach km² taobh a-staigh 1km de dhachaighean (OpenStreetMap).", caveats: "Is e snaim àite far a bheil trì ceann no barrachd de shràidean no slighean a ghabhas coiseachd orra a' coinneachadh, agus mar sin tha T a' cunntadh ach chan eil dà shràid a' coinneachadh ceann ri ceann; tha slighean-dràibhidh agus trannsaichean ann am pàircean-chàraichean air am fàgail a-mach. Bidh griod shràidean a' sealltainn luach àrd agus oighreachd thaigheadais le sràidean dùinte a' sealltainn luach ìosal, mura h-eil slighean-coise tron oighreachd air am mapadh."}
  connectivity_cycling: {label: Ceangalachd baidhsagail, description: "Sgòr ceangalachd DfT airson baidhsagal gu gach ceann-uidhe."}
  access_deprivation: {label: "Ruigsinneachd sheirbheisean (SIMD, NIMDM)", description: "Raon ruigsinneachd cruinn-eòlasach Clàr-amais Ioma-bhochdainn na h-Alba 2020 (ùineachan dràibhidh agus còmhdhail phoblaich gu dotairean-teaghlaich, sgoiltean, bùthan, oifisean-puist agus stèiseanan peatrail), air an toirt gu sònaichean dàta 2022.", caveats: "Tha e a' seasamh an àite tomhais ceangalachd DfT, nach eil a' còmhdach ach Sasainn agus a' Chuimrigh; sgòr stèidhichte air rangachadh taobh a-staigh Alba, agus mar sin tha e ag innse mar a tha sgìre an coimeas ris a' chòrr de dh'Alba."}
  station_distance: {label: Astar chun an stèisein as fhaisge, description: "Astar dìreach cuibheasach bho dhachaighean chun an stad rèile, metro no trama as fhaisge.", caveats: "Tha dachaighean aig nach eil dad taobh a-staigh 50km a' sealltainn 50km, crìoch an luirg, chan e astar a chaidh a thomhas."}
  rail_service: {label: Seirbheis rèile faisg air làimh, description: "Inntrigidhean agus fàgail stèisein bliadhnail (ORR) taobh a-staigh 2km de dhachaighean, air an cuideamachadh a rèir astair agus a' sàsachadh, gus am bi stèisean trang faisg air làimh a' cunntadh barrachd na stad beag.", caveats: "Stèiseanan prìomh-loidhne a-mhàin (tha stadan metro is trama a' cunntadh san tomhas astair); tha cleachdadh nan stèiseanan a' seasamh an àite tricead na seirbheis, nach eil ceadachas nan clàran-ama a' leigeil leinn obrachadh a-mach."}
  bus_frequency: {label: Tricead bhusaichean, description: "Busaichean san uair (làithean-seachdain, 07:00–19:00) aig an stad as trainge taobh a-staigh 400m de dhachaighean.", caveats: "Busaichean a rèir clàr-ama air DiMàirt àbhaisteach. Tha i air a sealltainn ach chan eil i air a sgòradh, oir tha sgòr ceangalachd DfT (air a sgòradh) a' còmhdach ruigsinneachd bhusaichean mu thràth (ρ ≈ 0.82). Tha foillseachadh gu Bus Open Data Service saor-thoileach ann an Alba, agus mar sin tha cuid de luchd-obrachaidh Albannach a dhìth."}
  bus_access: {label: Seirbheis bhus faisg air làimh, description: "Busaichean san uair (làithean na seachdain, 07:00–19:00) aig an stad as trainge taobh a-staigh 400m de dhachaighean, bho chlàran-ama Transport for Ireland; a' seasamh an àite an sgòr ceangailteachd nach eil aig Èirinn.", caveats: "Busaichean a rèir clàr-ama air DiMàirt àbhaisteach, a h-uile neach-obrachaidh san t-sruth dàta nàiseanta. Tha e a' seasamh an àite sgòir ceangalachd DfT, a tha a' cuideamachadh coiseachd, baidhsagail, dràibheadh agus còmhdhail phoblach gu obraichean agus seirbheisean; bidh busaichean leotha fhèin a' sealltainn nas tana."}
  gigabit_broadband: {label: Bann-leathann gigabit, description: "Cuid de dhachaighean a gheibh bann-leathann comasach air gigabit (làn-fhreumhan no càball)."}
  slow_broadband: {label: Dachaighean gun bhann-leathann ceart, description: "Cuid de dhachaighean nach fhaigh bann-leathann 10 Mbit/s bho loidhne shuidhichte no uèirleas suidhichte."}
  well_run_pubs: {label: Taighean-seinnse air an deagh ruith faisg air làimh, description: "Taighean-seinnse taobh a-staigh coiseachd 15 mionaidean le rangachadh slàinteachas bìdh de 4 no 5 bho na trì bliadhna a dh'fhalbh, air an cuideamachadh a rèir astair.", caveats: "Tha rangachaidhean slàinteachais a' tomhas cho math 's a tha taigh-seinnse air a ruith, chan e an leann no an t-àile. Tha sgeama slàinteachais na h-Alba a' rangachadh Pass no Improvement Required seach 0–5 agus a' sgrùdadh air cuairt nas fhaide, agus mar sin an sin tha taigh-seinnse a' cunntadh mar air a dheagh ruith nuair a fhuair e Pass taobh a-staigh na còig bliadhna a dh'fhalbh."}
  food_and_drink: {label: Cafaidhean agus taighean-bìdh, description: "Cafaidhean agus taighean-bìdh taobh a-staigh 800m, air an cuideamachadh a rèir astair."}
  supermarket_distance: {label: Astar chun a' mhòr-bhùtha as fhaisge, description: "Astar dìreach cuibheasach bho dhachaighean chun a' mhòr-bhùtha as fhaisge."}
  everyday_services: {label: Seirbheisean làitheil taobh a-staigh 15 mionaidean, description: "Cuid de na seachd seòrsaichean seirbheis làitheil (dotair teaghlaich, bùth-chungaidhean, mòr-bhùth, bun-sgoil, oifis a' phuist, pàirc no raon-cluiche, agus còmhdhail phoblach thric) a tha aig an dachaigh àbhaisteach taobh a-staigh 1.2 km, mu 15 mionaidean de choiseachd ann an loidhne dhìreach.", caveats: "Ruigsinn ann an loidhne dhìreach, chan e ùine coiseachd, agus mar sin chan eil abhainn no rèile eadar dachaigh is bùth air am faicinn (tha lìonra coiseachd ga dhealbhadh). Tha còmhdhail thric a' ciallachadh stad le co-dhiù dà thuras-fàgail san uair rè an latha air làithean-seachdain no stèisean rèile, metro no trama. Chan eil liosta sgoiltean air a ullachadh airson Èirinn, agus mar sin tha na dachaighean aice air an tomhas thairis air na sia seòrsaichean eile. Is e gach togalach a tha anns na dachaighean Èireannach seach puingean còd-puist, agus mar sin tha Èirinn dhùthchail sgaoilte a' sealltainn nas ìsle na Breatainn dhùthchail."}
  library_distance: {label: Astar gu leabharlann, description: "Astar cuibheasach ann an loidhne dhìreach bho dhachaighean chun an leabharlainn phoblaich as fhaisge (OpenStreetMap).", caveats: "Leabharlannan mar a tha OpenStreetMap gam mapadh; dh'fhaodadh liosta comhairle a bhith nas làine. Stadaidh an lorg aig 20 km; tha dachaigh aig nach eil gin cho faisg sin a' cunntadh mar 20 km, agus tha sgìre far a bheil a' mhòr-chuid de na dachaighean gun gin air a comharrachadh mar co-dhiù cho fada sin."}
  post_office_distance: {label: Astar gu oifis a' phuist, description: "Astar cuibheasach ann an loidhne dhìreach bho dhachaighean gu oifis a' phuist as fhaisge (OpenStreetMap).", caveats: "Oifisean-puist mar a tha OpenStreetMap gam mapadh, cuntairean am broinn bhùthan nam measg far a bheil iad air am mapadh; chan eil feadhainn Tramore air am mapadh. Stadaidh an lorg aig 20 km; tha dachaigh aig nach eil gin cho faisg sin a' cunntadh mar 20 km, agus tha sgìre far a bheil a' mhòr-chuid de na dachaighean gun gin air a comharrachadh mar co-dhiù cho fada sin."}
  shops: {label: Bùthan faisg air làimh, description: "Bùthan de gach seòrsa taobh a-staigh 800m, air an cuideamachadh a rèir astair."}
  leisure: {label: Goireasan spòrs agus fallaineachd, description: "Ionadan spòrs, taighean-spòrs agus amaran-snàimh fosgailte don phoball taobh a-staigh 2km, air an cuideamachadh a rèir astair (OpenStreetMap).", caveats: "Goireasan mapaichte, agus mar sin tha ionad-spòrs baile a' cunntadh aon uair ge b' e cia mheud talla a th' aige; tha amaran-snàimh air am fàgail a-mach oir is e amaran-snàimh prìobhaideach ann an gàrraidhean a tha anns a' mhòr-chuid dhiubh a tha air am mapadh. Is e clàr Active Places aig Sport England (leisure_facilities) an dearbhadh-tarsainn ann an Sasainn."}
  leisure_facilities: {label: Goireasan spòrs (Active Places), description: "Tallachan spòrs, taighean-spòrs, amaran, stiùidiothan, cùirtean agus raointean fosgailte don phoball taobh a-staigh 2km ann an clàr Active Places Sport England, air an cuideamachadh a rèir astair."}
  swimming_pool_distance: {label: Astar chun an amair-snàimh phoblaich as fhaisge, description: "Astar dìreach cuibheasach bho dhachaighean chun an amair-snàimh as fhaisge a tha fosgailte don phoball."}
  culture: {label: "Leabharlannan, taighean-dhealbh, taighean-cluiche agus taighean-tasgaidh", description: "Leabharlannan, taighean-dhealbh, taighean-cluiche, ionadan ealain, taighean-tasgaidh agus gailearaidhean taobh a-staigh 2km."}
  fast_food: {label: Bùthan biadh-luath faisg air làimh, description: "Bùthan biadh-luath taobh a-staigh 800m."}
  gambling: {label: Bùthan geall agus casinothan faisg air làimh, description: "Bùthan geall, ionadan gheall agus casinothan taobh a-staigh 800m."}
  house_price: {label: Prìs taighe àbhaisteach, description: "Prìs reic mheadhanach thar nan 12 mìosan a dh'fhalbh, air a daingneachadh a dh'ionnsaigh na sgìre mun cuairt far nach eil ach beagan reic.", caveats: "Tha prìsean nas ìsle a' faighinn sgòr mar nas so-cheannaichte; tha an sgèile a' sealltainn prìs, chan e luach. Ann an Alba bidh Registers of Scotland a' foillseachadh phrìsean meadhanach bliadhnail airson gach sòn dàta 2011 (a' bhliadhna-mhìosachain as ùire, mu dhà bhliadhna air dheireadh air faidhle Land Registry), air an cumail air ais far a bheil nas lugha na còig reic; thèid an toirt gu sònaichean 2022 tron chlàr-ceangail còd-puist, agus bidh sòn gun phrìs a' gabhail prìs an t-sòin eadar-mheadhanaich aige."}
  housing_condition: {label: Staid taigheadais, description: "Raon taigheadais a' chlàr-amais bochdainn (dachaighean ann an droch staid no gun teasachadh meadhanach; ann an Alba, tuilleadh is làn agus gun teasachadh meadhanach)."}
  price_change: {label: Atharrachadh prìsean thaighean, description: "Atharrachadh sa phrìs reic mheadhanach, na 12 mìosan a dh'fhalbh an aghaidh nan 12 mìosan roimhe.", caveats: "Luaineach far a bheil glè bheag de reic ann; ann an Alba agus Èirinn a Tuath tha an t-atharrachadh eadar bliadhnaichean-mìosachain, agus chan eil atharrachadh aig uàrd ann an Èirinn a Tuath aig a bheil am meadhan air a chumail air ais ann an aon dhen dà bhliadhna."}
  council_tax: {label: Cìs comhairle (reata Bann D na comhairle), description: "Cìs comhairle bhliadhnail air dachaigh Bann D, a' gabhail a-steach cosgaisean siorrachd, poilis, teine agus paraiste cuibheasach.", caveats: "An aon rud airson gach nàbachd ann an sgìre comhairle; tha bile dachaigh an urra ris a bhann. Tha bannan na Cuimrigh air an obrachadh a-mach bho bhann D cuibheasach gach comhairle le na co-mheasan reachdail."}
  price_to_income: {label: Prìs an coimeas ri teachd-a-steach ionadail, description: "Prìs taighe àbhaisteach air a roinn le teachd-a-steach lom teaghlaich cuibheasach na sgìre.", caveats: "Is e tuairmse stèidhichte air modail a th' anns an teachd-a-steach airson na sgìre nas fharsainge (MSOA), airson 2022–23."}
  new_builds: {label: Dachaighean a thogadh bho 2000, description: "Cuid de dhachaighean a thogadh ann an 2000 no nas fhaide air adhart."}
  period_homes: {label: Dachaighean a thogadh ro 1919, description: "Cuid de dhachaighean a thogadh ro 1919."}
  lower_band_homes: {label: Dachaighean ann am bannan cìs comhairle A–B, description: "Cuid de dhachaighean anns an dà bhann cìs comhairle as ìsle (na dachaighean as saoire ann an luachan 1991)."}
  income_deprivation: {label: Bochdainn teachd-a-steach, description: "Cuid de luchd-còmhnaidh air teachd-a-steach ìosal (raon teachd-a-steach a' chlàr-amais bochdainn).", caveats: "Sa Chuimrigh is e an ìre taisbeanair \"daoine ann am bochdainn teachd-a-steach\" aig WIMD 2025 (StatsWales), an tomhas air cùl sgòr an raoin."}
  pobal_deprivation: {label: Beartas agus bochdainn (clàr-amais Pobal HP), description: "Clàr-amais bochdainn dàimheach Pobal HP na roinne-taghaidh bho Chunntas-sluaigh 2022 (cion-cosnaidh, foghlam, clas sòisealta, pàrantan singilte, gabhaltas agus cus-sluaigh); tha nas àirde a' ciallachadh nas beairtiche.", caveats: "Air fhoillseachadh airson Roinnean-taghaidh (mu 1,500 duine); tha an tionndadh Sgìrean Beaga fo cheadachas. Tha e a' seasamh an àite cuibhrinn bochdainn teachd-a-steach, nach eil Èirinn a' foillseachadh fo ìre siorrachd."}
  employment_deprivation: {label: Bochdainn cosnaidh, description: "Cuid de luchd-còmhnaidh aois-obrach a tha gun obair gun an toil (raon cosnaidh a' chlàr-amais bochdainn).", caveats: "Sa Chuimrigh is e an ìre taisbeanair \"daoine aois-obrach ann am bochdainn cosnaidh\" aig WIMD 2025 (StatsWales), an tomhas air cùl sgòr an raoin."}
  claimant_rate: {label: Ìre luchd-tagraidh, description: "Luchd-còmhnaidh a' tagradh shochairean co-cheangailte ri cion-cosnaidh, mar chuid den fheadhainn aois 16–64 (am mìos as ùire).", caveats: "Chan eil i air a sgòradh oir tha i a' leantainn bochdainn teachd-a-steach IoD gu dlùth (ρ≈0.9), ach tha i tòrr nas ùire (mìosail). Tha seo a' gabhail a-steach luchd-tagraidh Universal Credit ann an obair le pàigheadh ìosal a dh'fheumas barrachd obrach a lorg."}
  household_income: {label: Teachd-a-steach teaghlaich, description: "Teachd-a-steach lom teaghlaich cuibheasach san sgìre nas fharsainge (MSOA), ro chosgaisean taigheadais."}
  health_deprivation: {label: Slàinte agus ciorram, description: "Bàs ro-luath, tinneas agus ciorram (raon bochdainn slàinte agus ciorraim a' chlàr-amais bochdainn).", caveats: "Tha an tomhas seo air a thogail gus aois a ghabhail a-steach, eu-coltach ri slàinte fèin-aithris, a bheir dealbh nas fheàrr de sgìrean le inbhich òga."}
  life_expectancy: {label: Dùil-beatha, description: "Dùil-beatha aig breith san sgìre nas fharsainge (MSOA), cuibheas fhear is bhoireannach, 2019–23.", caveats: "Tha i air a sealltainn ach chan eil i air a sgòradh, oir tha raon slàinte IoD (air a sgòradh) a' tomhas cha mhòr an aon rud air sgèile nas mionaidiche."}
  good_health: {label: Deagh shlàinte (fèin-aithris), description: "Luchd-còmhnaidh a' toirt cunntas air an slàinte mar mhath no glè mhath (Cunntas-sluaigh 2021; 2022 ann an Alba).", caveats: "Chan eil an tomhas seo air a cheartachadh a rèir aois, agus mar sin tha sgìrean nan oileanach a' coimhead as fallaine."}
  imd: {label: Clàr-amais Ioma-bhochdainn, description: "Sgòr bochdainn iomlan; gun sgòr oir tha a raointean a' tar-lùbadh thaisbeanairean eile."}
  population_density: {label: Dùmhlachd sluaigh, description: "Luchd-còmhnaidh gach cilemeatair ceàrnagach (Cunntas-sluaigh 2021; 2022 ann an Alba)."}
  households_with_children: {label: Teaghlaichean le clann eisimeileach, description: "Cuid de theaghlaichean le clann eisimeileach (Cunntas-sluaigh 2021; 2022 ann an Alba)."}
  aged_65_plus: {label: Luchd-còmhnaidh aois 65 is barrachd, description: "Cuid de luchd-còmhnaidh aois 65 no nas sine (Cunntas-sluaigh 2021; 2022 ann an Alba)."}
  owner_occupied: {label: Dachaighean le sealbhadair a' fuireach annta, description: "Cuid de theaghlaichean a tha nan sealbhadairean air an dachaigh gu tur no le morgaids (Cunntas-sluaigh 2021; 2022 ann an Alba)."}
  no_car: {label: Teaghlaichean gun chàr, description: "Cuid de theaghlaichean gun chàr no bhan (Cunntas-sluaigh 2021; 2022 ann an Alba)."}
  sustainable_commute: {label: "Coiseachd, baidhsagal no còmhdhail phoblach gu obair", description: "Cuid de luchd-obrach a' siubhal gu obair air chois, air baidhsagal no air còmhdhail phoblaich (Cunntas-sluaigh 2021, rè bacaidhean COVID-19; 2022 ann an Alba)."}
  sunshine: {label: Grian, description: "Uairean de dheàrrsadh grèine sa bhliadhna, cuibheasachd 1991–2020 (HadUK-Grid, 1km).", caveats: "Griod 1km air a thoirt a-mach le eadar-phòlachadh bho chlàradairean-grèine, agus mar sin tha cnuic agus cladaichean air an lìomhadh; tha cuibheasachdan deich bliadhna fichead ag innse dè tha àbhaisteach, chan e na thug bliadhna sam bith leatha."}
  wet_days: {label: Làithean fliuch, description: "Làithean sa bhliadhna le co-dhiù 1mm de dh'uisge, cuibheasachd 1991–2020.", caveats: "Tha e a' cunntadh làithean, chan e an uiread a thuit, agus mar sin tha àite braonach a' sealltainn nas fliche na fear aig a bheil an aon uiread de shileadh ann an nas lugha de dh'fhrasan troma; tha an sileadh ann am milleameatairean air a shealltainn ri thaobh."}
  summer_warmth: {label: Blàths an t-samhraidh, description: "Teòthachd as àirde làitheil chuibheasach bhon Ògmhios chun Lùnastal, cuibheasachd 1991–2020 (°C).", caveats: "Tha nas blàithe a' cunntadh mar nas fheàrr an seo; tha na làithean os cionn 25°C air an sealltainn ri thaobh airson an fheadhainn nach eil dèidheil orra."}
  winter_mildness: {label: Ciùineas a' gheamhraidh, description: "Teòthachd as ìsle làitheil chuibheasach bhon Dùbhlachd chun Ghearran, cuibheasachd 1991–2020 (°C).", caveats: "Teòthachdan as ìsle na h-oidhche, a tha a' toirt buaidh air reothadh agus air bilean teasachaidh; tha cladaichean agus cathraichean a' sealltainn nas ciùine na na cnuic air an cùlaibh."}
  rainfall: {label: Uisge, description: "Uisge sa bhliadhna ann am milleameatairean, cuibheasachd 1991–2020."}
  rainfall_total: {label: Sileadh bliadhnail, description: "Sileadh cuibheasach sa bhliadhna, 1991–2020, bho ghriod 1 km Met Éireann; a' seasamh an àite làithean fliucha.", caveats: "Sileadh iomlan, chan e cia tric a bhios e a' sileadh; tha na stairsnich a' leantainn stairsnich làithean fliuch na Rìoghachd Aonaichte (tha 120 agus 200 latha a' freagairt ri mu 800 agus 1,600 mm air feadh griod na Rìoghachd Aonaichte)."}
  air_frost_days: {label: Làithean reothaidh, description: "Làithean sa bhliadhna nuair a thuiteas teòthachd an adhair fo 0°C, cuibheasachd 1991–2020."}
  summer_days: {label: Làithean samhraidh, description: "Làithean sa bhliadhna nuair a ruigeas an teòthachd 25°C, cuibheasachd 1991–2020."}
  wind_speed: {label: Gaoth, description: "Astar cuibheasach na gaoithe aig 10m, cuibheasachd 1991–2020."}
  future_hot_days: {label: Làithean teth samhraidh ann an saoghal 2°C nas blàithe, description: "Làithean sa bhliadhna le teòthachd as àirde os cionn 30°C aon uair 's gu bheil an saoghal air blàthachadh 2°C, bho ro-mheasaidhean ionadail UKCP18 Oifis na Sìde.", caveats: "Ro-mheasadh airson an MSOA, an Sòn Eadar-mheadhanach no ceàrn taghaidh sgìreil, air a lethbhreacadh gu gach sgìre bheag taobh a-staigh (tuairmse airson na nàbachd, chan e an sgìre bheag); is e latha teth samhraidh fear os cionn 30°C ann am mìos sam bith, meadhan nan sia ruith-modail deug UKCP18, agus mar sin tha mòran den cheann a tuath a' sealltainn 0 aig 2°C agus tha an cunntas ag innse cia tric a thigeadh a leithid de làithean, chan e cho teth 's a tha an t-àite."}
  domestic_rates: {label: Reataichean dachaigheil (dachaigh àbhaisteach), description: "Bile bliadhnail nan reataichean dachaigheil airson dachaigh aig luach-calpa meadhanail na sgìre, bhon reata roinneil agus reata sgìreil na comhairle (Èirinn a Tuath).", caveats: "Bidh Èirinn a Tuath a' togail reataichean air luach-calpa dachaigh an àite cìse comhairle a rèir bann; tha am bile a tha air a shealltainn airson dachaigh aig meadhan measgachadh luachan 2016 na sgìre, agus mar sin bidh e ag atharrachadh le luachan ionadail a bharrachd air an reata gach £."}
  snow_days: {label: Làithean le sneachd na laighe, description: "Làithean sa bhliadhna le sneachd air an talamh aig 9m, cuibheasachd 1991–2020."}
  council_tax_typical: {label: Cìs comhairle (dachaigh àbhaisteach an seo), description: "Na phàigheas dachaigh àbhaisteach san sgìre ann an cìs comhairle, cosgais gach bann air a cuideamachadh a rèir cia mheud de dhachaighean na sgìre a tha sa bhann sin.", caveats: "A' cleachdadh cosgais na comhairle gach bann agus measgachadh bhannan na sgìre, agus mar sin tha sgìre de thaighean-sreatha bann A a' sealltainn mu dhà thrian de reata Bann D na comhairle; chan eil lasachaidhean agus saoraidhean air an gabhail a-steach."}
  gp_list_size: {label: Euslaintich gach cleachdadh dotair faisg air làimh, description: "Euslaintich clàraichte gach cleachdadh aig na cleachdaidhean dotair faisg air dachaighean, air an cuideamachadh a rèir astair.", caveats: "Euslaintich gach cleachdadh, chan e gach dotair: dh'fhaodadh mòran dhotairean-teaghlaich a bhith aig cleachdadh mòr. Is e seo an tomhas onarach far nach eil àireamh nan dotairean-teaghlaich air a foillseachadh (a h-uile àite ach Sasainn)."}
  allotment_distance: {label: Astar chun nan leasan-àitich as fhaisge, description: "Astar cuibheasach dìreach bho dhachaighean chun nan leasan-àitich no an àite fàs coimhearsnachd as fhaisge.", caveats: "Astar chun na làraich, chan e a bheil leas saor ann; bidh liostaichean-feitheimh a' ruith airson bhliadhnaichean ann am mòran bhailtean. Tha làraichean Èirinn a Tuath agus Èirinn a' tighinn à OpenStreetMap."}
  radon_potential: {label: Dachaighean ann an sgìre radon àrd, description: "An cuid de dhachaighean ann an ceàrnagan griod far a bheil dùil gum bi còrr is 10% de dhachaighean os cionn ìre gnìomha radon (atlas comharrachaidh BGS is UKHSA; mapa radon an EPA ann an Èirinn).", caveats: "Mapadh comharrachail a rèir ceàrnagan 1km (10km ann an Èirinn), chan e tomhas; bheir sgrùdadh còd-puist UKHSA no deuchainn EPA ìre na dachaigh fhèin seachad, agus faodar ìrean àrda a lùghdachadh."}
  ev_charging: {label: Puingean cosgais poblach faisg air làimh, description: "Làraichean cosgais charbadan dealain poblach taobh a-staigh 1.5km de dhachaighean, sa chumantas (OpenStreetMap, ESB air eilean na h-Èireann, Open Charge Map).", caveats: "A' cunntadh làraichean cosgais, chan e socaidean no an luaths, bho OpenStreetMap, lìonra ESB air eilean na h-Èireann agus solaraichean le ceadachas fosgailte aig Open Charge Map (am fear mu dheireadh a-mhàin nuair a tha iuchair aig togail); dhùin clàr nàiseanta puingean-cosgais na Rìoghachd Aonaichte ann an 2024."}
  listed_buildings: {label: Togalaichean clàraichte faisg air làimh, description: "Togalaichean clàraichte taobh a-staigh 1km de dhachaighean, gach km² (Historic England, Cadw, Àrainneachd Eachdraidheil Alba agus Roinn nan Coimhearsnachdan; ann an Èirinn, an Clàr Nàiseanta de Dhualchas Ailtireachd aig ìre roinneil no nas àirde).", caveats: "Dùmhlachd de thogalaichean dìonta, mar chomharra air caractar eachdraidheil; chan eil e ag innse dad mu staid nan dachaighean, agus tha figear Èirinn a' cunntadh molaidhean a' chlàir seach clàran reachdail nan comhairlean."}

