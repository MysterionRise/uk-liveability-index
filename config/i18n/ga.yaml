# Gaeilge labels for the data: themes, indicators (label, description), presets, the
# profile flags and the words for each nation's area tiers. English stays in
# indicators.yaml and weights.yaml; anything missing here falls back to it. `_meta.status`
# is "draft" until a fluent reviewer signs it off (see docs/i18n.md). Drafted 15 October
# 2026 for the Northern Ireland release (#70).
_meta: {status: draft, reviewer: null, date: 2026-10-15}

themes:
  safety: {label: Sábháilteacht, description: "Coireacht agus iompar frithshóisialta a taifeadadh san áit a bhfuil cónaí ar dhaoine."}
  environment: {label: Timpeallacht, description: "Aer glan, sráideanna ciúine, crainn agus spásanna glasa in aice láimhe, agus riosca tuilte."}
  health: {label: Seirbhísí sláinte, description: "Cé chomh héasca is atá sé do chónaitheoirí dochtúir teaghlaigh, cógaiseoir nó fiaclóir a fheiceáil."}
  education: {label: Scoileanna agus cúram leanaí, description: "Scoileanna agus naíonraí maithe faoi rochtain."}
  transport: {label: Iompar agus nascacht, description: "Cé chomh maith is a nascann ceantar le poist agus le seirbhísí ar gach modh, agus a leathanbhanda."}
  amenities: {label: Áiseanna agus saol na hoíche, description: "Siopaí, caiféanna, tithe tábhairne dea-reáchtáilte, fóillíocht agus cultúr in aice láimhe."}
  housing: {label: Tithíocht agus inacmhainneacht, description: "An méid a chosnaíonn tithe agus bail an stoic tithíochta."}
  community: {label: Pobal agus folláine, description: "Ioncam, obair agus sláinte na ndaoine a chónaíonn ann."}
  climate: {label: Aeráid, description: "Grian, báisteach agus cé chomh te is atá an samhradh agus cé chomh séimh is atá an geimhreadh, ó mheáin tríocha bliain."}

presets:
  balanced: {label: Cothrom, description: "Comhaireann gach téama go cothrom."}
  family: {label: Teaghlach le leanaí, description: "Scoileanna agus naíonraí maithe, sábháilteacht agus spásanna glasa ar dtús."}
  young_professional: {label: Gairmí óg, description: "Naisc, rudaí le déanamh agus tithe tábhairne maithe; is lú tábhacht na scoileanna."}
  retiree: {label: Ar scor, description: "Sábháilteacht, seirbhísí sláinte, aer glan, grian agus ceantar níos ciúine."}
  commuter: {label: Comaitéir, description: "Naisc thapa le poist, ar iompar poiblí thar aon rud eile."}

units:
  gbp: "£"
  gbp_year: "£ sa bhliain"
  pct: "%"
  pct_homes: "% de thithe"
  pct_pupils: "% de dhaltaí"
  pct_working_age: "% de dhaoine 16–64"
  metres: méadair
  km: km
  per_1000_year: "in aghaidh 1,000 cónaitheoir sa bhliain"
  score: scór
  score_100: "scór 0–100"
  ugm3: "µg/m³"
  index: "innéacs 0–1"
  quality: "cáilíocht 0–1"
  rating: "rátáil 0–1 (Maith = 0.75)"
  rate: ráta
  collisions_year: "imbhuailtí sa bhliain laistigh de 500m"
  patients_per_gp: "othair in aghaidh an dochtúra teaghlaigh lánaimseartha"
  attainment8: "Gnóthachtáil 8"
  buses_hour: "busanna san uair"
  years_income: "blianta d'ioncam"
  years: blianta
  people_km2: "daoine in aghaidh km²"
  per_km2: "in aghaidh an km²"
  radiance: "nW/cm²/sr"
  hours_year: "uaireanta sa bhliain"
  days_year: "laethanta sa bhliain"
  celsius: "°C"
  mm_year: "mm sa bhliain"
  m_s: "m/s"
  within_1500m: "laistigh de 1.5km"
  patients_per_practice: "othair in aghaidh an chleachtais"
  km_per_km2: "km in aghaidh an km²"
  hectares: "heicteáir"
  pct_slope: "% fána"
  class4: "aicme 1–4 (4 = ar fheabhas)"
  class5: "aicme 1–5 (5 = ard)"

flags:
  imputed: "Is meastacháin iad na figiúirí coireachta anseo: ní fhoilsíonn Póilíní Greater Manchester sonraí ar leibhéal sráide."
  low_n: "Is beag teach a díoladh anseo le bliain anuas, mar sin tá an praghas cobhsaithe i dtreo an cheantair máguaird."
  broadcast_lad: "Tagann cáilíocht na meánscoileanna ó thorthaí scrúduithe na comhairle ar fad, mar ní fhoilsíonn an náisiún seo torthaí ná gráid chigireachta in aghaidh na scoile."
  not_available: "Níl roinnt táscairí ar fáil sa náisiún seo go fóill; úsáideann an téama na cinn atá aige."
  theme_gap: "Tá ró-bheagán sonraí oscailte ag an náisiún seo chun téama amháin a scóráil: taispeántar é mar shonraí teoranta agus fágtar as an iomlán é."

# What the interface calls each nation's areas (one, several)
levels:
  E:
    low: {one: ceantar beag, other: ceantair bheaga}
    mid: {one: comharsanacht, other: comharsanachtaí}
    upper: {one: comhairle, other: comhairlí}
  W:
    low: {one: ceantar beag, other: ceantair bheaga}
    mid: {one: comharsanacht, other: comharsanachtaí}
    upper: {one: comhairle, other: comhairlí}
  S:
    low: {one: crios sonraí, other: criosanna sonraí}
    mid: {one: crios idirmheánach, other: criosanna idirmheánacha}
    upper: {one: ceantar comhairle, other: ceantair chomhairle}
  N:
    low: {one: forchrios sonraí, other: forchriosanna sonraí}
    mid: {one: forchrios sonraí, other: forchriosanna sonraí}
    upper: {one: comhairle, other: comhairlí}
  I:
    low: {one: ceantar beag, other: ceantair bheaga}
    mid: {one: toghroinn, other: toghranna}
    upper: {one: comhairle, other: comhairlí}

indicators:
  crime_violence: {label: Cionta foréigneacha agus gnéasacha, description: "Foréigean agus cionta gnéasacha a taifeadadh in aghaidh 1,000 cónaitheoir sa bhliain (meán 36 mí).", caveats: "Úsáideann na rátaí cónaitheoirí mar ainmneoir, mar sin faigheann lár bailte nach bhfuil mórán cónaitheoirí iontu ach a mbíonn go leor cuairteoirí ann droch-scór. Ní fhoilsíonn Póilíní Greater Manchester aon sonraí; déantar meastachán ar a gceantar ó fhearann coireachta IoD 2025."}
  crime_burglary: {label: Buirgléireacht, description: "Buirgléireachtaí a taifeadadh in aghaidh 1,000 cónaitheoir sa bhliain."}
  crime_asb: {label: Iompar frithshóisialta, description: "Eachtraí iompair fhrithshóisialta a tuairiscíodh in aghaidh 1,000 cónaitheoir sa bhliain."}
  crime_theft: {label: "Robáil, gadaíocht agus coireacht feithiclí", description: "Robáil, gadaíocht ón duine, coireacht feithiclí agus gadaíocht rothar in aghaidh 1,000 cónaitheoir sa bhliain."}
  crime_damage_disorder: {label: Damáiste coiriúil agus ord poiblí, description: "Damáiste coiriúil, coirloscadh agus cionta oird phoiblí in aghaidh 1,000 cónaitheoir sa bhliain."}
  road_danger: {label: Imbhuailtí bóthair tromchúiseacha in aice láimhe, description: "Imbhuailtí bóthair inar maraíodh nó inar gortaíodh duine go dona laistigh de 500m de thithe, sa bhliain (meán 5 bliana).", caveats: "Ardaíonn bóithre gnóthacha in aice le tithe an comhaireamh, cibé cé a bhí i gceist. D'aistrigh fórsaí póilíneachta go córas nua tuairiscithe gortuithe ag amanna éagsúla, rud a thaifeadann níos mó gortuithe mar ghortuithe tromchúiseacha."}
  iod_crime: {label: Fearann coireachta an innéacs díothachta, description: "Riosca samhaltaithe íospairt phearsanta agus maoine (sonraí 2021–2023)."}
  recorded_crime: {label: Coireacht a taifeadadh (SIMD), description: "Coireanna a taifeadadh in aghaidh 1,000 cónaitheoir sa bhliain in Innéacs Ildíothachta na hAlban 2020, tugtha chuig criosanna sonraí 2022.", caveats: "Ní fhoilsíonn Póilíní na hAlban aon sonraí oscailte ar leibhéal sráide, mar sin seasann ráta SIMD in ionad na gceithre tháscaire coireachta; clúdaíonn sé an choireacht ar fad a taifeadadh (foréigean, cionta gnéasacha, briseadh isteach i dtithe, loitiméireacht, drugaí agus ionsaí coiteann) agus tá sé níos sine ná an fhuinneog sonraí police.uk a úsáidtear in áiteanna eile."}
  no2: {label: Dé-ocsaíd nítrigine (NO₂), description: "Meán-NO₂ cúlra bliantúil san áit a gcónaíonn daoine (samhail 1km Defra; in Éirinn, léarscáil 1km an EEA).", caveats: "Tiúchain chúlra; tá leibhéil taobh bóthair ar shráideanna gnóthacha níos airde. Is é 10 µg/m³ treoirlíne WHO."}
  pm25: {label: Mínfhíneáin (PM2.5), description: "Meán-PM2.5 cúlra bliantúil san áit a gcónaíonn daoine (samhail 1km Defra; in Éirinn, léarscáil 1km an EEA).", caveats: "Is é 5 µg/m³ treoirlíne WHO."}
  green_space_access: {label: Páirceanna agus spásanna glasa in aice láimhe, description: "Bealaí isteach i bpáirceanna, i ngairdíní agus i bpáirceanna imeartha poiblí laistigh de shiúlóid 1km, ualaithe de réir faid (i dTuaisceart Éireann agus in Éirinn, páirceanna agus páirceanna imeartha OpenStreetMap).", caveats: "Áiríonn sé páirceanna poiblí agus páirceanna imeartha, ní tuath oscailte, mar sin faigheann sráidbhailte atá timpeallaithe ag páirceanna feirme agus cosáin siúil scór níos ísle ná mar a mhothaíonn siad. Níl aon táirge spáis ghlais oscailte ag Tuaisceart Éireann, mar sin tagann a pháirceanna, a ghairdíní agus a pháirceanna imeartha ó OpenStreetMap agus tomhaistear iad go dtí imeall is gaire an láithreáin seachas a bhealaí isteach."}
  play_spaces: {label: Clóis súgartha in aice láimhe, description: "Bealaí isteach i spásanna súgartha poiblí laistigh de 800m de thithe, ualaithe de réir faid (i dTuaisceart Éireann agus in Éirinn, clóis súgartha OpenStreetMap)."}
  flood_risk: {label: Tithe i mbaol tuilte, description: "Sciar de thithe i mbaol ard nó meánach tuilte ó aibhneacha, ón bhfarraige nó ó uisce dromchla (seans 1% sa bhliain ar a laghad).", caveats: "Rátáiltear gach teach de réir an mheasúnaithe is airde de na measúnuithe aibhneacha-agus-farraige agus uisce dromchla, a bhfuil cosaintí tuilte curtha san áireamh iontu; ní áirítear tuilte screamhuisce ná séarachais. Seoltaí atá i gcomhaireamh Shasana, mar sin áirítear siopaí ar phríomhshráid a mbíonn baol tuilte uirthi freisin. Sa Bhreatain Bheag, foilsíonn NRW limistéir riosca seachas comhaireamh, mar sin meastar na tithe atá i mbaol ó shciar pointí maoine an cheantair atá laistigh de na limistéir arda agus mheánacha. Léitear mapaí SEPA na hAlban ar an modh céanna, agus an banda meánach ag 1 as 200 sa bhliain (níos scaoilte ná 1 as 100 an EA)."}
  flood_rivers_sea: {label: Tithe i mbaol ó aibhneacha nó ón bhfarraige, description: "Sciar de thithe i mbaol ard nó meánach tuilte ó aibhneacha nó ón bhfarraige amháin (seans 1% sa bhliain ar a laghad).", caveats: "An chuid den bhaol tuilte a thagann ó aibhneacha agus ón bhfarraige; is é uisce dromchla an chuid eile. Cuirtear cosaintí tuilte san áireamh."}
  noise_exposure: {label: Tithe i dtorann iompair nó tionsclaíoch, description: "Sciar de thithe ina sroicheann torann mapáilte 60 dB Lden nó níos mó thar an lá, an tráthnóna agus an oíche (bóithre, iarnróid agus aerárthaí i Sasana; bóithre, iarnróid agus tionscal sa Bhreatain Bheag; gach foinse mhapáilte in Albain, i dTuaisceart Éireann agus in Éirinn).", caveats: "Léitear gach teach ón ngreille torainn 10m ag a chód poist agus comhairtear an fhoinse mhapáilte is torannaí. Tá bóithre, iarnróid agus na sé aerfort déag atá mapáilte i mapaí Shasana; bóithre, iarnróid agus tionscal i mapaí na Breataine Bige; gach foinse, tionscal san áireamh, i léarscáil chomhdhlúite na hAlban; agus bóithre, iarnróid, tionscal agus Aerfort Chathair Bhéal Feirste i gcomhrianta babhta 3 (2017) Thuaiscirt Éireann i gceirtleáin Bhéal Feirste agus Dhoire, móide na príomhbhóithre agus na príomhiarnróid eatarthu. Is é 60 dB Lden an tairseach, leibhéal bóthair ghnóthaigh, mar ní mhapáiltear mionbhóithre ach laistigh de na bailte is mó i Sasana."}
  aircraft_noise: {label: Tithe i dtorann aerárthaí, description: "Sciar de thithe ina bhfuil torann aerárthaí 55 dB Lden nó níos mó ar an meán, timpeall na sé aerfort déag atá mapáilte i Sasana, Aerfort Chathair Bhéal Feirste, agus Baile Átha Cliath, Corcaigh agus an tSionainn.", caveats: "Comhrianta 55 dB Lden Heathrow, Gatwick, Stansted, Luton, London City, Southend, Manchester, Liverpool, Birmingham, East Midlands, Leeds Bradford, Newcastle, Bristol, Bournemouth agus Southampton do 2021, bliain a raibh níos lú eitiltí ann ná mar is gnách; tá luach 0 ag tithe lasmuigh de na comhrianta sin cibé aerpháirceanna níos lú a gcloiseann siad."}
  industrial_noise: {label: Tithe i dtorann tionsclaíoch, description: "Sciar de thithe ina bhfuil torann tionsclaíoch 55 dB Lden nó níos mó ar an meán, timpeall suíomhanna mapáilte na Breataine Bige, i gcúig chathair mhapáilte na hAlban, in dhá cheirtleán Thuaisceart Éireann agus timpeall suíomhanna mapáilte na hÉireann.", caveats: "Ní mhapáiltear é ach timpeall láithreáin tionsclaíocha na Breataine Bige (babhta 2022), in Obar Dheathain, i nDún Dè, i nDún Éideann, san Eaglais Bhreac agus i nGlaschú, i mBéal Feirste agus i nDoire (2017) agus timpeall láithreáin tionsclaíocha ceadúnaithe na hÉireann (babhta 4 an EPA); in áiteanna eile sna náisiúin sin is é 0 an luach in ionad a bheith anaithnid."}
  night_noise: {label: Tithe i dtorann oíche, description: "Sciar de thithe ina bhfuil torann mapáilte 50 dB Lnight nó níos mó ar an meán idir 23:00 agus 07:00, an leibhéal ag a n-áiríonn an Treoir um Thorann Comhshaoil daoine a bheith nochta dó san oíche.", caveats: "Leagan oíche de mhapaí an lae, léite ag gach teach ó na greillí 10m agus na comhrianta céanna (sraitheanna bóthair, iarnróid agus aerfoirt Shasana do 2021, sraitheanna bóthair, iarnróid agus tionscail na Breataine Bige 2022, léarscáil chomhdhlúite 2021 na hAlban, comhrianta 2017 Thuaiscirt Éireann, comhrianta babhta 4 na hÉireann); comhairtear an fhoinse mhapáilte is torannaí. Is é 50 dB Lnight tairseach tuairiscithe oíche na Treorach, mar sin léitear mionbhóthar neamhmhapáilte mar bhóthar ciúin anseo, díreach mar a léitear é i rith an lae."}
  road_rail_noise: {label: Tithe i dtorann bóthair nó iarnróid, description: "Sciar de thithe ina sroicheann torann bóthair nó iarnróid 60 dB Lden nó níos mó thar an lá, an tráthnóna agus an oíche, ó na mapaí torainn straitéiseacha.", caveats: "Léitear gach teach ón ngreille torainn 10m ag a chód poist. Clúdaíonn mapaí Shasana gach bóthar laistigh de na bailte agus na cathracha is mó agus príomhbhóithre amháin in áiteanna eile, agus clúdaíonn mapaí na Breataine Bige gach bóthar, mar sin is é 60 dB Lden an tairseach, leibhéal bóthair ghnóthaigh, seachas an 55 dB ag a n-áiríonn an Treoir um Thorann Comhshaoil daoine a bheith nochta dó agus ag a gcomhairfí gnáthshráideanna ach amháin san áit ar mapáladh iad. Ní áirítear aerárthaí ná tionscal."}
  coast_distance: {label: Fad go dtí an cósta, description: "Fad ó thithe go dtí an cósta is gaire, i gciliméadair (marc an lán mara sa Bhreatain Mhór agus in Éirinn, imlíne Thuaisceart Éireann).", caveats: "An fad i líne dhíreach go dtí an pointe is gaire den chósta mapáilte, a théann suas inbhir, lochanna farraige agus aibhneacha taoide chomh fada le marc an lán mara (faigheann Norwich, Gloucester agus Wisbech luach faoi bhun 2 km); tomhas ar ghaireacht d'uisce taoide, ní ar rochtain ar thránna. Ní cósta iad lochanna ná lochanna intíre."}
  sealed_surface: {label: Talamh tógtha timpeall tithe, description: "Sciar den talamh laistigh de 500m de thithe a rangaíonn clúdach talún satailíte mar thalamh tógtha, is é sin foirgnimh, bóithre agus dromchlaí crua eile (ESA WorldCover, 10m).", caveats: "Áirítear cill 10m mar thalamh tógtha nuair is iad na dromchlaí séalaithe is mó atá inti, mar sin laghdaíonn gairdíní agus bruacha idir tithe an sciar; léarscáil tá nó níl de 2021 is ea é, ní tomhas ar cé chomh séalaithe is atá gach cill. Fágtar uisce agus cealla neamhmhapáilte as iomlán na talún."}
  protected_nature: {label: Dúlra cosanta in aice láimhe, description: "Heicteáir talún laistigh de thart ar 2km de thithe atá cosanta ar mhaithe leis an dúlra (Láithreáin de Shuim Speisialta Eolaíochta, tearmainn dúlra, Limistéir faoi Chaomhnú Speisialta agus Limistéir faoi Chosaint Speisialta; in Éirinn, Limistéir faoi Chaomhnú Speisialta, Limistéir faoi Chosaint Speisialta agus Limistéir Oidhreachta Nádúrtha).", caveats: "Teorainneacha féin gach ainmniúcháin, cumasctha ionas go gcomhairtear talamh atá cosanta faoi dhó uair amháin, agus gearrtha chun na talún, mar sin fágtar láithreáin mhara ar lár; tomhaiste thar fhuinneog a bhfuil achar ciorcail 2km timpeall gach tí aici (thart ar 1,257 ha ar a mhéad) ar ghreille 50m. Ní fhoilsíonn Tuaisceart Éireann sraith náisiúnta de thearmainn dúlra áitiúla, agus is é sraith na hÉireann an tsraith reachtúil, gan na Limistéir Oidhreachta Nádúrtha beartaithe de 1995."}
  hilliness: {label: Cnocúlacht timpeall tithe, description: "Meánfhána na talún laistigh de thart ar 500m de thithe, mar chéatadán (ardaíonn fána 10% 10m in aghaidh gach 100m).", caveats: "Fána a ríomhadh le modh Horn ar ghreille 50m, ó OS Terrain 50 sa Bhreatain Mhór agus ó shamhail talún 50m OSNI i dTuaisceart Éireann; tagann figiúr na hÉireann ó Copernicus GLO-30, samhail dromchla ina gcuireann foirgnimh agus crainn airde leis, mar sin taispeánann bailte agus coillte na hÉireann beagán níos cnocúla ná mar atá an talamh féin. Is éasca siúl agus rothaíocht ar thalamh níos cothroime; ní chuireann an dath in iúl go bhfuil ceachtar acu níos fearr."}
  elevation: {label: Airde os cionn leibhéal na farraige, description: "Meánairde tithe os cionn leibhéal na farraige, i méadair, ón ngreille talún 50m.", caveats: "Airde na cille 50m a bhfuil gach teach laistigh di; tagann figiúr na hÉireann ó shamhail dromchla, a chuireann airde foirgneamh agus crann leis. Ní fearr ard ná íseal; ní dhéanann scála na ndathanna ach na ceantair a chur in ord."}
  storm_overflow_spills: {label: Doirteadh séarachais in aice láimhe, description: "Na huaireanta sa bhliain a dhoirt sceithirí stoirme laistigh de 2km de thithe séarachas isteach in aibhneacha agus san fharraige, curtha le chéile (Monatóireacht ar Fhad Teagmhas na Gníomhaireachta Comhshaoil).", caveats: "Monatóireacht na gcuideachtaí uisce féin ar asraon gach sceithire thar an mbliain féilire is déanaí, sula ngrúpáiltear doirteadh ina ndoirteadh comhairthe; tuairiscítear níos lú ná an fhíorfhigiúr i gcás sceithire a d'oibrigh a mhonatóir ar feadh níos lú ná 90% den bhliain. Sroicheann doirteadh an abhainn síos le sruth, rud a d'fhéadfadh a bheith níos faide ná 2km ó na tithe a chomhairtear anseo. Sasana amháin, mar téann tuairisceáin na Breataine Bige chuig Natural Resources Wales agus ní fhoilsíonn Albain, Tuaisceart Éireann ná Éire taifead bliantúil iomlán."}
  bathing_water_distance: {label: Fad go huisce snámha, description: "Fad ó thithe go dtí an t-uisce snámha ainmnithe is gaire (trá, loch nó stráice abhann a ndéantar monatóireacht air do shnámhóirí), i gciliméadair.", caveats: "An fad i líne dhíreach go dtí an pointe samplála (i dTuaisceart Éireann lár an limistéir ainmnithe). Ní chomhairtear ach uiscí snámha ainmnithe, mar sin ní chomhairtear trá nó loch breá nach bhfuil ainmnithe; stopann an cuardach ag 100km."}
  bathing_water_class: {label: Cáilíocht uisce snámha in aice láimhe, description: "Aicme an uisce snámha ainmnithe is gaire laistigh de 10km de thithe, ó 4 (Ar fheabhas) trí Maith agus Leordhóthanach go 1 (Lag), don séasúr is déanaí.", caveats: "Aicme an uisce snámha is gaire do gach teach, meánaithe thar thithe an cheantair; níl aon luach ag ceantar a bhfuil ceann laistigh de 10km ag níos lú ná leath de na tithe. Bunaítear na haicmí ar cheithre shéasúr de shamplaí (trí cinn d'uiscí a ainmníodh ó 2022 i leith), agus tras-scríobhadh cinn Thuaiscirt Éireann ó fhógra bliantúil DAERA."}
  river_status: {label: Sláinte aibhneacha agus locha in aice láimhe, description: "Stádas na habhann nó an locha is gaire laistigh de 2km de thithe faoin gCreat-Treoir Uisce, ó 5 (Ard) trí Maith, Measartha agus Lag go 1 (Olc).", caveats: "Stádas na habhann nó an locha is gaire do gach teach, meánaithe thar thithe an cheantair; níl aon luach ag ceantar a bhfuil ceann laistigh de 2km ag níos lú ná leath de na tithe. Stádas éiceolaíoch i Sasana (2025), sa Bhreatain Bheag (2024, eatramhach), i dTuaisceart Éireann (2018, an ceann is déanaí atá ar fáil go hoscailte) agus in Éirinn (2019–2024); stádas foriomlán in Albain (2024), an t-aon aicme a fhoilsíonn SEPA go hoscailte. Ní chomhairtear ach na comhlachtaí uisce a rangaíonn na gníomhaireachtaí, mar sin ní chomhairtear sruthanna beaga ná locháin."}
  tree_canopy: {label: Clúdach crann timpeall tithe, description: "Sciar den talamh laistigh de 500m de thithe a rangaíonn clúdach talún satailíte mar chlúdach crann (ESA WorldCover, 10m).", caveats: "Áirítear cill 10m mar chlúdach crann nuair is crainn is mó atá inti, mar sin tá a luach thart ar dhá oiread luach shuirbhé Forest Research ar chlúdach na gcrann (a shamplaíonn pointí) agus na toghranna á rangú ar an mbealach céanna den chuid is mó; ní aimsítear crainn ghairdín aonair ná fálta sceiche. Fágtar uisce agus cealla neamhmhapáilte as iomlán na talún, mar sin déantar teach cois farraige a mheas de réir na talún taobh thiar de."}
  light_pollution: {label: Solas na hoíche, description: "Meánradaíocht oíche laistigh de 1km de thithe, ó chomhiomlán bliantúil satailíte VIIRS (nW/cm²/sr).", caveats: "Ciallaíonn níos gile níos mó soilsithe sráide agus foirgneamh agus mar sin radharc níos lú ar spéir na hoíche; leanann sé an dlús agus tá dhá thaobh leis, agus is é sin an fáth a dtaispeántar é ach nach scóráiltear é. Tá an satailít dall ar an gcuid ghorm de sholas LED, mar sin léitear sráideanna a tiontaíodh le déanaí níos dorcha ná mar a fheictear iad."}
  iod_outdoors: {label: Timpeallacht chónaithe amuigh IoD 2025, description: "Cáilíocht aeir agus timpistí tráchta bóthair (fofhearann IoD 2025)."}
  hospital_ae_distance: {label: Fad chuig an rannóg éigeandála is gaire, description: "Meánfhad díreach ó thithe chuig an rannóg éigeandála is gaire faoi stiúir comhairleora.", caveats: "Tagann rannóga na hAlban ó liosta Public Health Scotland; tagann rannóga Shasana agus na Breataine Bige ó ospidéil OpenStreetMap a bhfuil rannóg éigeandála clibeáilte orthu, agus d'fhéadfadh roinnt aonad mionghortuithe a bheith ina measc. Is é 50km an luach atá ag tithe gan aon rud laistigh de 50km díobh, uasteorainn an chuardaigh, ní fad tomhaiste."}
  hospital_distance: {label: Fad chuig an gcúram éigeandála is gaire, description: "Meánfhad díreach ó thithe chuig an rannóg éigeandála nó an t-aonad mionghortuithe is gaire.", caveats: "Is é 50km an luach atá ag tithe gan aon rud laistigh de 50km díobh, uasteorainn an chuardaigh, ní fad tomhaiste."}
  gp_distance: {label: Fad chuig an gcleachtas dochtúra teaghlaigh is gaire, description: "Meánfhad díreach ó thithe chuig an gcleachtas dochtúra teaghlaigh is gaire."}
  patients_per_gp: {label: Othair in aghaidh an dochtúra teaghlaigh, description: "Othair chláraithe in aghaidh an dochtúra teaghlaigh cháilithe lánaimseartha ag na cleachtais a úsáideann cónaitheoirí.", caveats: "Ní áirítear dochtúirí teaghlaigh faoi oiliúint; fágtar cleachtais a thuairiscíonn níos lú ná dochtúir teaghlaigh lánaimseartha amháin as an meán."}
  gp_quality: {label: Rátálacha cleachtas dochtúirí teaghlaigh, description: "Rátálacha CQC na gcleachtas dochtúirí teaghlaigh a bhfuil cónaitheoirí cláraithe leo, ualaithe de réir an lín a úsáideann gach ceann.", caveats: "Is é Maith an rátáil atá ag formhór na gcleachtas, agus tá roinnt blianta d'aois ag roinnt de na rátálacha."}
  care_homes: {label: Tithe altranais dea-rátáilte in aice láimhe, description: "Leapacha i dtithe altranais a rátáil CQC Maith nó Sármhaith laistigh de 5km, ualaithe de réir faid."}
  pharmacy_distance: {label: Fad chuig an gcógaslann is gaire, description: "Meánfhad díreach ó thithe chuig an gcógaslann phobail NHS is gaire.", caveats: "Ní áirítear cleachtais dochtúirí teaghlaigh tuaithe a dháileann cógais iad féin. Tagann cógaslanna na Breataine Bige ó OpenStreetMap, mar níl liosta NWSSP inléite ag meaisín."}
  dentist_distance: {label: Fad chuig an bhfiaclóir NHS is gaire, description: "Meánfhad díreach ó thithe chuig an gcleachtas fiaclóireachta is gaire a bhfuil conradh NHS aige.", caveats: "Ní fhoilsítear mar shonraí oscailte cibé an nglacann cleachtas le hothair nua NHS."}
  primary_school_quality: {label: Bunscoileanna maithe in aice láimhe, description: "Cáilíocht na dtrí bhunscoil stáit is gaire (Ofsted agus torthaí), agus na cinn is gaire ag comhaireamh níos mó.", caveats: "Is cumasc d'Ofsted (60%) agus de thorthaí Eochairchéim 2 mar chéatadánach (40%) an cháilíocht; léiríonn torthaí na daltaí a ghlactar isteach chomh maith leis an teagasc. Ní hionann gaireacht agus ligean isteach; glacann scoileanna a bhfuil ró-éileamh orthu daltaí isteach de réir limistéir ionghabhála nó creidimh. Níl sé ar fáil sa Bhreatain Bheag, in Albain ná i dTuaisceart Éireann, ar náisiúin iad nach bhfoilsíonn aon torthaí bunscoile ná gráid chigireachta."}
  secondary_school_quality: {label: Meánscoileanna maithe in aice láimhe, description: "Cáilíocht na dtrí mheánscoil stáit is gaire (cigireachtaí agus torthaí), agus na cinn is gaire ag comhaireamh níos mó.", caveats: "Is cumasc d'Ofsted (60%) agus de Ghnóthachtáil 8 mar chéatadánach (40%) an cháilíocht; ní fhoilsítear Dul Chun Cinn 8 do 2024/25. Sa Bhreatain Bheag, áit nach bhfoilsítear torthaí in aghaidh na scoile ná gráid chigireachta, seasann scór pointí Capped 9 na comhairle in ionad gach scoile ina ceantar (marcáilte mar broadcast_lad). In Albain is é cáilíocht gach scoile meánscór taraife na ndaltaí a fhágann an scoil mar chéatadánach laistigh d'Albain; ní fhoilsítear aon ghráid chigireachta mar shonraí oscailte."}
  school_choice: {label: Rogha scoileanna maithe, description: "Bunscoileanna stáit maithe laistigh de 2km agus meánscoileanna laistigh de 5km, ualaithe de réir cáilíochta agus faid."}
  primary_results: {label: Torthaí bunscoile in aice láimhe, description: "Sciar de dhaltaí a shroicheann an caighdeán a bhfuiltear ag súil leis sa léitheoireacht, sa scríbhneoireacht agus sa mhatamaitic ag bunscoileanna stáit laistigh de 2km (meán 3 bliana), ualaithe de réir faid.", caveats: "Léiríonn torthaí cúlra na ndaltaí chomh maith leis an teagasc; ní fhoilsítear tomhais dul chun cinn do 2024/25."}
  secondary_results: {label: Torthaí meánscoile in aice láimhe, description: "Meánscór Gnóthachtáil 8 ag meánscoileanna stáit laistigh de 5km, ualaithe de réir faid.", caveats: "Léiríonn torthaí cúlra na ndaltaí chomh maith leis an teagasc; ní fhoilsítear Dul Chun Cinn 8 do 2024/25 ná do 2025/26."}
  nursery_access: {label: Naíonraí maithe in aice láimhe, description: "Naíonraí, réamhscoileanna agus ranganna naíonra scoile laistigh de 1km, gach ceann ualaithe de réir a ghráid chigireachta agus faid.", caveats: "Ní aimsítear suíomh feighlithe leanaí (coinníonn Ofsted a seoltaí siar). Sa Bhreatain Bheag tagann naíonraí ó OpenStreetMap (ní fhoilsíonn CIW aon liosta soláthraithe) agus meastar gur cáilíocht mheánach atá iontu; cuirtear ranganna naíonra scoile san áireamh ó liosta scoileanna na Breataine Bige. In Albain ualaítear gach naíonra de réir a ghráid ón Care Inspectorate."}
  connectivity_overall: {label: Nascacht iomlán, description: "Scór nascachta DfT thar gach modh taistil agus ceann scríbe."}
  connectivity_public_transport: {label: Nascacht iompair phoiblí, description: "Scór nascachta DfT d'iompar poiblí chuig gach ceann scríbe."}
  connectivity_walking: {label: Insiúltacht, description: "Scór nascachta DfT do shiúl chuig gach ceann scríbe."}
  cycle_infrastructure: {label: Rianta agus lánaí rothaíochta in aice láimhe, description: "Ciliméadair de rothbhealaí, de rianta rothaíochta agus de lánaí rothaíochta péinteáilte in aghaidh an km² laistigh de 1km de thithe (OpenStreetMap).", caveats: "Bonneagar rothaíochta mar a mhapálann OpenStreetMap é, atá níos iomláine i gcathracha: rothbhealaí, cosáin ina bhfuil rothaíocht ainmnithe, agus lánaí nó rianta taobh le bóthar (comhairtear lána ar an dá thaobh de shráid uair amháin). Ní chomhairtear cosáin choisithe roinnte gan an t-ainmniú ná sráideanna ciúine."}
  street_connectivity: {label: Nascacht sráideanna, description: "Acomhail sráideanna agus cosán in aghaidh an km² laistigh de 1km de thithe (OpenStreetMap).", caveats: "Is acomhal é áit a dtagann trí dheireadh nó níos mó de shráideanna nó de chosáin ar féidir siúl orthu le chéile, mar sin áirítear T ach ní áirítear dhá shráid a thagann le chéile ceann le ceann; fágtar cabhsaí agus pasáistí carrchlóis ar lár. Faigheann greille sráideanna luach ard agus eastát cúl-de-sac luach íseal, mura mapáiltear cosáin siúil tríd an eastát."}
  connectivity_cycling: {label: Nascacht rothaíochta, description: "Scór nascachta DfT do rothaíocht chuig gach ceann scríbe."}
  access_deprivation: {label: Rochtain ar sheirbhísí (SIMD agus NIMDM), description: "Fearann rochtana geografaí Innéacs Ildíothachta na hAlban 2020 (agus fearann gaireacht seirbhísí NIMDM 2017 i dTuaisceart Éireann): amanna tiomána agus iompair phoiblí chuig dochtúirí teaghlaigh, scoileanna, siopaí, oifigí poist agus stáisiúin pheitril, tugtha chuig criosanna 2021 agus 2022.", caveats: "Seasann sé in ionad tomhais nascachta DfT, a chlúdaíonn Sasana agus an Bhreatain Bheag amháin; scór bunaithe ar rangú in Albain, mar sin deir sé cén chaoi a gcuirtear ceantar i gcomparáid leis an gcuid eile d'Albain."}
  station_distance: {label: Fad chuig an stáisiún is gaire, description: "Meánfhad díreach ó thithe chuig an stad iarnróid, meitreo nó trama is gaire.", caveats: "Is é 50km an luach atá ag tithe gan aon rud laistigh de 50km díobh, uasteorainn an chuardaigh, ní fad tomhaiste."}
  rail_service: {label: Seirbhís iarnróid in aice láimhe, description: "Iontrálacha agus imeachtaí bliantúla stáisiúin (ORR) laistigh de 2km de thithe, ualaithe de réir faid agus sáithithe, sa chaoi go gcomhaireann stáisiún gnóthach in aice láimhe níos mó ná stad beag.", caveats: "Stáisiúin phríomhlíne amháin (áirítear stadanna meitreo agus trama sa tomhas faid); seasann úsáid in ionad minicíochta seirbhíse, rud nach gceadaíonn ceadúnas an amchláir dúinn a ríomh."}
  bus_frequency: {label: Minicíocht busanna, description: "Busanna san uair (laethanta na seachtaine, 07:00–19:00) ag an stad is gnóthaí laistigh de 400m de thithe.", caveats: "Busanna de réir amchláir ar ghnáthlá Máirt. Taispeántar é ach ní scóráiltear é, mar go gclúdaíonn scór nascachta DfT (a scóráiltear) rochtain bus cheana féin (ρ ≈ 0.82). Tá foilsiú chuig an Bus Open Data Service deonach in Albain, mar sin tá roinnt oibritheoirí in Albain ar iarraidh."}
  bus_access: {label: Seirbhís bus in aice láimhe, description: "Busanna san uair (laethanta na seachtaine, 07:00–19:00) ag an stad is gnóthaí laistigh de 400m de thithe, ó amchláir Transport for Ireland; seasann sé in ionad an scóir nascachta nach bhfuil ag Éirinn.", caveats: "Busanna de réir amchláir ar ghnáthlá Máirt, gach oibritheoir sa bhfotha sonraí náisiúnta. Seasann sé in ionad scóir nascachta DfT, a chuireann siúl, rothaíocht, tiomáint agus iompar poiblí chuig poist agus seirbhísí san áireamh; is tanaí an pictiúr a thugann busanna amháin."}
  gigabit_broadband: {label: Leathanbhanda gigibheart, description: "Sciar de thithe ar féidir leo leathanbhanda ar chumas gigibhirt a fháil (snáithín iomlán nó cábla)."}
  slow_broadband: {label: Tithe gan leathanbhanda cuibheasach, description: "Sciar de thithe nach féidir leo leathanbhanda 10 Mbit/s a fháil ó líne sheasta ná ó gan sreang seasta."}
  well_run_pubs: {label: Tithe tábhairne dea-reáchtáilte in aice láimhe, description: "Tithe tábhairne laistigh de shiúlóid 15 nóiméad a bhfuil rátáil sláinteachais bia 4 nó 5 acu ó na trí bliana seo caite, ualaithe de réir faid.", caveats: "Tomhaiseann rátálacha sláinteachais cé chomh maith is atá teach tábhairne á reáchtáil, ní an bheoir ná an t-atmaisféar. Déanann scéim sláinteachais na hAlban grádú ar Pass nó Improvement Required in ionad 0–5 agus déanann sí cigireacht ar thimthriall níos faide, mar sin ansin áirítear teach tábhairne mar dhea-reáchtáilte nuair a fuair sé Pass laistigh de na cúig bliana seo caite."}
  food_and_drink: {label: Caiféanna agus bialanna, description: "Caiféanna agus bialanna laistigh de 800m, ualaithe de réir faid."}
  supermarket_distance: {label: Fad chuig an ollmhargadh is gaire, description: "Meánfhad díreach ó thithe chuig an ollmhargadh is gaire."}
  everyday_services: {label: Seirbhísí laethúla laistigh de 15 nóiméad, description: "Sciar de na seacht gcineál seirbhíse laethúla (cleachtas dochtúra teaghlaigh, cógaslann, ollmhargadh, bunscoil, oifig an phoist, páirc nó clós súgartha, agus iompar poiblí minic) atá ag an ngnáth-theach laistigh de 1.2 km, timpeall 15 nóiméad siúil i líne dhíreach.", caveats: "Sroicheadh i líne dhíreach, ní am siúil, mar sin ní fheictear abhainn ná iarnród idir teach agus siopa (tá líonra siúil pleanáilte). Ciallaíonn iompar minic stad a bhfuil dhá imeacht ar a laghad san uair aige i rith an lae ar laethanta na seachtaine nó stáisiún iarnróid, meitreo nó trama. Níl aon liosta scoileanna ullmhaithe d'Éirinn, mar sin déantar a tithe a thomhas thar na sé chineál eile. Is gach foirgneamh iad tithe na hÉireann in ionad pointí cód poist, mar sin faigheann tuath scaipthe na hÉireann luach níos ísle ná tuath na Breataine."}
  library_distance: {label: Fad go leabharlann, description: "Meánfhad i líne dhíreach ó thithe go dtí an leabharlann phoiblí is gaire (OpenStreetMap).", caveats: "Leabharlanna mar a mhapálann OpenStreetMap iad; d'fhéadfadh liosta comhairle a bheith níos iomláine. Stopann an cuardach ag 20 km; is é 20 km an fad a áirítear do theach nach bhfuil aon cheann chomh gar sin dó, agus marcáiltear ceantar nach bhfuil aon cheann ag formhór a thithe mar cheantar atá 20 km ar a laghad ar shiúl."}
  post_office_distance: {label: Fad go hoifig an phoist, description: "Meánfhad i líne dhíreach ó thithe go dtí oifig an phoist is gaire (OpenStreetMap).", caveats: "Oifigí poist mar a mhapálann OpenStreetMap iad, cuntair taobh istigh de shiopaí san áireamh nuair a bhíonn siad mapáilte; níl cinn Thrá Móire mapáilte. Stopann an cuardach ag 20 km; is é 20 km an fad a áirítear do theach nach bhfuil aon cheann chomh gar sin dó, agus marcáiltear ceantar nach bhfuil aon cheann ag formhór a thithe mar cheantar atá 20 km ar a laghad ar shiúl."}
  shops: {label: Siopaí in aice láimhe, description: "Siopaí de gach cineál laistigh de 800m, ualaithe de réir faid."}
  leisure: {label: Áiseanna spóirt agus aclaíochta, description: "Ionaid spóirt, giomanna agus linnte snámha atá ar oscailt don phobal laistigh de 2km, ualaithe de réir faid (OpenStreetMap).", caveats: "Áiseanna mapáilte, mar sin áirítear ionad fóillíochta baile uair amháin pé acu cé mhéad halla atá ann; fágtar linnte snámha ar lár mar is linnte príobháideacha gairdín an chuid is mó díobh siúd atá mapáilte. Is é clár Active Places Sport England (leisure_facilities) an tras-seiceáil i Sasana."}
  leisure_facilities: {label: Áiseanna spóirt (Active Places), description: "Hallaí spóirt, giomanna, linnte, stiúideonna, cúirteanna agus páirceanna atá ar oscailt don phobal laistigh de 2km i gclár Active Places Sport England, ualaithe de réir faid."}
  swimming_pool_distance: {label: Fad chuig an linn snámha phoiblí is gaire, description: "Meánfhad díreach ó thithe chuig an linn snámha is gaire atá ar oscailt don phobal."}
  culture: {label: "Leabharlanna, pictiúrlanna, amharclanna agus músaeim", description: "Leabharlanna, pictiúrlanna, amharclanna, ionaid ealaíon, músaeim agus dánlanna laistigh de 2km."}
  fast_food: {label: Siopaí mearbhia in aice láimhe, description: "Siopaí mearbhia laistigh de 800m."}
  gambling: {label: Siopaí geallghlacadóra agus casaínónna in aice láimhe, description: "Siopaí geallghlacadóra, ionaid chearrbhachais agus casaínónna laistigh de 800m."}
  house_price: {label: Praghas tí tipiciúil, description: "Praghas díola meánach thar an 12 mhí seo caite, cobhsaithe i dtreo an cheantair máguaird nuair is beag díolachán atá ann.", caveats: "Faigheann praghsanna níos ísle scór níos inacmhainne; léiríonn an scála praghas, ní luach. In Albain foilsíonn Registers of Scotland meánacha bliantúla do gach crios sonraí 2011 (an bhliain féilire is déanaí, thart ar dhá bhliain taobh thiar de chomhad an Land Registry), ceilte nuair a bhíonn níos lú ná cúig dhíolachán ann; aistrítear iad chuig criosanna 2022 tríd an tábla comhfhreagrais cód poist, agus glacann crios gan phraghas praghas a chrios idirmheánaigh."}
  housing_condition: {label: Bail na tithíochta, description: "Fearann tithíochta an innéacs díothachta (tithe i ndroch-chaoi nó gan téamh lárnach; in Albain, plódú agus gan téamh lárnach; i dTuaisceart Éireann, an timpeallacht mhaireachtála)."}
  price_change: {label: Athrú ar phraghsanna tithe, description: "Athrú ar an bpraghas díola meánach, an 12 mhí seo caite i gcomparáid leis an 12 mhí roimhe sin.", caveats: "Luaineach nuair is beag díolachán atá ann; in Albain agus i dTuaisceart Éireann is idir blianta féilire atá an t-athrú, agus níl aon luach ag toghroinn i dTuaisceart Éireann a bhfuil a meán ceilte i gceachtar den dá bhliain."}
  council_tax: {label: Cáin chomhairle (ráta Bhanda D na comhairle), description: "Muirear bliantúil na comhairle ar theach Bhanda D, lena n-áirítear muirir chontae, phóilíní, dóiteáin agus paróiste ar an meán; an ráta mar a chéile a fhoilsíonn gach comhairle.", caveats: "Is mar a chéile é do gach comharsanacht i gceantar comhairle; braitheann bille tí ar a bhanda. Díorthaítear bandaí na Breataine Bige ó mheán Bhanda D gach údaráis trí na cóimheasa reachtúla a úsáid."}
  domestic_rates: {label: Rátaí tí (teach tipiciúil), description: "Bille rátaí tí bliantúil do theach ag meánluach caipitil an cheantair, ón ráta réigiúnach agus ó ráta ceantair na comhairle (Tuaisceart Éireann).", caveats: "Muirearaíonn Tuaisceart Éireann rátaí ar luach caipitil tí in ionad cáin chomhairle de réir bandaí; is bille do theach i lár mheascán luachanna 2016 an cheantair an bille a thaispeántar, mar sin athraíonn sé le luachanna áitiúla chomh maith leis an ráta sa phunt."}
  council_tax_typical: {label: Cáin chomhairle (teach tipiciúil anseo), description: "An méid a íocann teach tipiciúil sa cheantar i gcáin chomhairle, muirear gach banda ualaithe de réir an lín tithe sa cheantar atá sa bhanda sin.", caveats: "Úsáideann sé muirear na comhairle do gach banda agus meascán bandaí an cheantair, mar sin is é thart ar dhá thrian de ráta Bhanda D na comhairle atá i gceantar de thithe sraithe Bhanda A; ní áirítear lascainí ná díolúintí."}
  price_to_income: {label: Praghas i gcomparáid le hioncam áitiúil, description: "Praghas tí tipiciúil roinnte ar mheánioncam glan teaghlaigh an cheantair.", caveats: "Meastachán bunaithe ar shamhail is ea an t-ioncam don cheantar níos leithne (MSOA), do 2022–23."}
  new_builds: {label: Tithe a tógadh ó 2000, description: "Sciar de thithe a tógadh in 2000 nó ina dhiaidh."}
  period_homes: {label: Tithe a tógadh roimh 1919, description: "Sciar de thithe a tógadh roimh 1919."}
  lower_band_homes: {label: Tithe i mbandaí cánach comhairle A–B, description: "Sciar de thithe sa dá bhanda cánach comhairle is ísle (na tithe is saoire ag luachanna 1991)."}
  income_deprivation: {label: Díothacht ioncaim, description: "Sciar de chónaitheoirí ar ioncam íseal (fearann ioncaim an innéacs díothachta).", caveats: "Sa Bhreatain Bheag is é an ráta táscaire \"daoine i ndíothacht ioncaim\" WIMD 2025 (StatsWales), an tomhas atá taobh thiar de scór an fhearainn."}
  pobal_deprivation: {label: Rachmas agus díothacht (innéacs Pobal HP), description: "Innéacs díothachta coibhneasta Pobal HP na toghroinne ó Dhaonáireamh 2022 (dífhostaíocht, oideachas, aicme shóisialta, tuismitheoirí aonair, tionacht agus plódú); ciallaíonn níos airde níos saibhre.", caveats: "Foilsithe do thoghranna (thart ar 1,500 duine); tá leagan an Cheantair Bhig ceadúnaithe. Seasann sé in ionad an tomhais ar dhíothacht ioncaim mar sciar, nach bhfoilsíonn Éire faoi leibhéal an chontae."}
  employment_deprivation: {label: Díothacht fostaíochta, description: "Sciar de chónaitheoirí in aois oibre atá dífhostaithe dá n-ainneoin féin (fearann fostaíochta an innéacs díothachta).", caveats: "Sa Bhreatain Bheag is é an ráta táscaire \"daoine in aois oibre i ndíothacht fostaíochta\" WIMD 2025 (StatsWales), an tomhas atá taobh thiar de scór an fhearainn."}
  claimant_rate: {label: Ráta éilitheoirí, description: "Cónaitheoirí ag éileamh sochar a bhaineann le dífhostaíocht, mar sciar de na daoine 16–64 (an mhí is déanaí).", caveats: "Ní scóráiltear é mar go leanann sé díothacht ioncaim IoD go dlúth (ρ≈0.9), ach tá sé i bhfad níos nuaí (míosúil). Áiríonn sé éilitheoirí Universal Credit i mbun oibre ar phá íseal ar gá dóibh breis oibre a lorg."}
  household_income: {label: Ioncam teaghlaigh, description: "Meánioncam glan teaghlaigh sa cheantar níos leithne (MSOA), roimh chostais tithíochta."}
  health_deprivation: {label: Sláinte agus míchumas, description: "Bás roimh am, tinneas agus míchumas (fearann díothachta sláinte agus míchumais an innéacs díothachta).", caveats: "Tógtha chun aois a chur san áireamh, murab ionann agus sláinte féintuairiscithe, a fhágann go mbreathnaíonn ceantair de dhaoine fásta óga níos fearr ná mar is cuí."}
  life_expectancy: {label: Ionchas saoil, description: "Ionchas saoil ag breith sa cheantar níos leithne (MSOA), meán fear agus ban, 2019–23.", caveats: "Taispeántar é ach ní scóráiltear é, mar go dtomhaiseann fearann sláinte IoD (a scóráiltear) beagnach an rud céanna ar scála níos míne."}
  good_health: {label: Dea-shláinte (féintuairiscithe), description: "Cónaitheoirí a thuairiscíonn a sláinte mar mhaith nó an-mhaith (Daonáireamh 2021; 2022 in Albain).", caveats: "Níl coigeartú déanta ar son aoise, mar sin is cosúil gurb iad na ceantair mac léinn is sláintiúla."}
  imd: {label: Innéacs Ildíothachta, description: "Scór díothachta iomlán; gan scór mar forluíonn a fhearainn ar tháscairí eile."}
  population_density: {label: Dlús daonra, description: "Cónaitheoirí in aghaidh an chiliméadair chearnaigh (Daonáireamh 2021; 2022 in Albain)."}
  households_with_children: {label: Teaghlaigh le leanaí cleithiúnacha, description: "Sciar de theaghlaigh le leanaí cleithiúnacha (Daonáireamh 2021; 2022 in Albain)."}
  aged_65_plus: {label: Cónaitheoirí 65 nó níos sine, description: "Sciar de chónaitheoirí atá 65 bliana d'aois nó níos sine (Daonáireamh 2021; 2022 in Albain)."}
  owner_occupied: {label: Tithe úinéir-áitithe, description: "Sciar de theaghlaigh ar leo a dteach go hiomlán nó le morgáiste (Daonáireamh 2021; 2022 in Albain)."}
  no_car: {label: Teaghlaigh gan charr, description: "Sciar de theaghlaigh gan charr ná veain (Daonáireamh 2021; 2022 in Albain)."}
  sustainable_commute: {label: "Siúl, rothaíocht nó iompar poiblí chun na hoibre", description: "Sciar d'oibrithe a thaistealaíonn chun na hoibre de shiúl na gcos, ar rothar nó ar iompar poiblí (Daonáireamh 2021, le linn srianta COVID-19; 2022 in Albain)."}
  sunshine: {label: Grian, description: "Uaireanta de sholas geal na gréine sa bhliain, meán 1991–2020 (HadUK-Grid, 1km).", caveats: "Greille 1km a ríomhadh trí idirshuíomh ó thaifeadáin gréine, mar sin déantar cnoic agus cóstaí a mhaolú; insíonn meáin tríocha bliain cad is gnách ann, ní cad a thug aon bhliain áirithe."}
  wet_days: {label: Laethanta fliucha, description: "Laethanta sa bhliain le 1mm báistí ar a laghad, meán 1991–2020.", caveats: "Comhairtear laethanta, ní méideanna, mar sin tá an chuma ar áit cheobhránach go bhfuil sí níos fliuche ná áit a bhfuil an méid céanna báistí aici i níos lú cithanna troma; taispeántar báisteach i milliméadair lena taobh."}
  summer_warmth: {label: Teas an tsamhraidh, description: "Meánteocht uasta laethúil ó Mheitheamh go Lúnasa, meán 1991–2020 (°C).", caveats: "Meastar gur fearr níos teo anseo; taispeántar na laethanta os cionn 25°C lena taobh dóibh siúd ar fearr leo gan iad a bheith ann."}
  winter_mildness: {label: Séimhe an gheimhridh, description: "Meánteocht íosta laethúil ó Nollaig go Feabhra, meán 1991–2020 (°C).", caveats: "Teochtaí íosta na hoíche, a chinneann sioc agus billí téimh; tá cuma níos séimhe ar chóstaí agus ar chathracha ná ar na cnoic atá taobh thiar díobh."}
  rainfall: {label: Báisteach, description: "Báisteach sa bhliain i milliméadair, meán 1991–2020."}
  rainfall_total: {label: Báisteach bhliantúil, description: "Meánbháisteach sa bhliain, 1991–2020, ó ghreille 1 km Met Éireann; seasann sé in ionad laethanta fliucha.", caveats: "Iomlán na báistí, ní cé chomh minic a bhíonn báisteach ann; leanann na tairseacha iad siúd do laethanta fliucha na Ríochta Aontaithe (freagraíonn 120 agus 200 lá do thart ar 800 agus 1,600 mm ar fud greille na Ríochta Aontaithe)."}
  air_frost_days: {label: Laethanta sioc aeir, description: "Laethanta sa bhliain nuair a thiteann teocht an aeir faoi 0°C, meán 1991–2020."}
  summer_days: {label: Laethanta samhraidh, description: "Laethanta sa bhliain nuair a shroicheann an teocht 25°C, meán 1991–2020."}
  wind_speed: {label: Gaoth, description: "Meánluas na gaoithe ag 10m, meán 1991–2020."}
  snow_days: {label: Laethanta le sneachta ina luí, description: "Laethanta sa bhliain le sneachta ar an talamh ag 9rn, meán 1991–2020."}
  future_hot_days: {label: Laethanta teo samhraidh i ndomhan 2°C níos teo, description: "Laethanta sa bhliain le huasteocht os cionn 30°C nuair a bheidh an domhan 2°C níos teo, ó réamh-mheastacháin áitiúla UKCP18 Oifig na hAimsire.", caveats: "Réamh-mheastachán don MSOA, don Chrios Idirmheánach nó don cheantar toghcháin dúiche, cóipeáilte chuig gach ceantar beag laistigh de (meastachán don chomharsanacht, ní don cheantar beag); is lá teo samhraidh é lá os cionn 30°C in aon mhí, an t-airmheán de sé rith samhaltaithe déag UKCP18, mar sin tá luach 0 ag cuid mhór den tuaisceart ag 2°C agus insíonn an comhaireamh cé chomh minic a thiocfadh laethanta den sórt sin, ní cé chomh te is atá an áit."}
  gp_list_size: {label: Othair in aghaidh an chleachtais dochtúra teaghlaigh in aice láimhe, description: "Othair chláraithe in aghaidh an chleachtais ag na cleachtais dochtúirí teaghlaigh in aice le tithe, ualaithe de réir faid.", caveats: "Othair in aghaidh an chleachtais, ní in aghaidh an dochtúra: d'fhéadfadh go leor dochtúirí teaghlaigh a bheith i gcleachtas mór. An tomhas macánta nuair nach bhfoilsítear líon na ndochtúirí teaghlaigh (gach áit seachas Sasana)."}
  allotment_distance: {label: Fad chuig na leithdháiltí is gaire, description: "Meánfhad díreach ó thithe chuig na leithdháiltí nó an spás fáis pobail is gaire.", caveats: "An fad go dtí an láithreán, seachas cibé an bhfuil ceapach saor ann; bíonn liostaí feithimh blianta ar fad i go leor bailte. Tagann láithreáin Thuaiscirt Éireann agus na hÉireann ó OpenStreetMap."}
  radon_potential: {label: Tithe i limistéar ard radóin, description: "Sciar na dtithe i gcearnóga greille ina meastar go mbeidh breis is 10% de thithe os cionn leibhéal gnímh an radóin (atlas táscach BGS agus UKHSA; léarscáil radóin an EPA in Éirinn).", caveats: "Mapáil táscach de réir cearnóige 1km (10km in Éirinn), ní tomhas; tugann cuardach cód poist UKHSA nó tástáil EPA leibhéal an tí féin, agus is féidir leibhéil arda a laghdú."}
  ev_charging: {label: Pointí luchtaithe poiblí in aice láimhe, description: "Láithreáin luchtaithe feithiclí leictreacha poiblí laistigh de 1.5km de thithe, ar an meán (OpenStreetMap, ESB ar oileán na hÉireann, Open Charge Map).", caveats: "Áiríonn sé láithreáin luchtaithe, ní soicéid ná a luas, ó OpenStreetMap, ó líonra ESB ar oileán na hÉireann agus ó sholáthraithe Open Charge Map a bhfuil ceadúnas oscailte acu (an ceann deireanach sin ach amháin nuair a bhíonn eochair ag an tógáil); dúnadh clár náisiúnta pointí luchtaithe na Ríochta Aontaithe in 2024."}
  listed_buildings: {label: Foirgnimh liostaithe in aice láimhe, description: "Foirgnimh liostaithe laistigh de 1km de thithe, in aghaidh an km² (Historic England, Cadw, Historic Environment Scotland agus an Roinn Pobal; in Éirinn, an Fardal Náisiúnta d'Oidhreacht Ailtireachta ag rátáil réigiúnach nó níos airde).", caveats: "Dlús foirgneamh cosanta, mar chomhartha de charachtar stairiúil; ní deir sé aon rud faoi bhail na dtithe, agus áiríonn figiúr na hÉireann moltaí an fhardail seachas taifid reachtúla na gcomhairlí."}

