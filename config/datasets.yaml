  format: gpkg
  landing_page: https://datamap.gov.wales/layers/inspire-wg:Cadw_ListedBuildings
  description: Every listed building in Wales as a point, with its grade and its English and Welsh names.
  licence: OGL-3.0
  attribution: "Cadw listed buildings © Hawlfraint y Goron / Crown copyright, Welsh Government, licensed under the Open Government Licence v3.0."
  cadence: adhoc
  size_hint: 30k points

hes_listed:
  coverage: [S]
  title: Listed buildings by category (Historic Environment Scotland)
  theme: amenities
  access:
    type: arcgis_layer
    url: https://inspire.hes.scot/arcgis/rest/services/HES/Listed_Buildings/MapServer/0
    fields: [ENT_REF, ENT_TITLE, CATEGORY]
    geometry: point
  format: parquet
  landing_page: https://portal.historicenvironment.scot/spatialdownloads
  description: Every listed building in Scotland as a point, with its category (A, B or C) and designation reference.
  licence: OGL-3.0
  attribution: "© Historic Environment Scotland. Listed buildings data licensed under the Open Government Licence v3.0."
  cadence: adhoc
  size_hint: 67k points in 14 ranges
  notes: The INSPIRE server cannot page by offset, so the fetcher reads ranges of object ids.

dfc_listed:
