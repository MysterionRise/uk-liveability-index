  access:
    type: http
    url: "https://api.os.uk/downloads/v1/products/OpenUPRN/downloads?area=GB&format=CSV&redirect"
  format: zip
  extract: ["*.csv"]
  landing_page: https://www.ordnancesurvey.co.uk/products/os-open-uprn
  description: Every Unique Property Reference Number in Great Britain with its coordinates, the property points behind the address products.
