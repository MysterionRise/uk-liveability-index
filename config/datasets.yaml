  theme: environment
  access:
    type: http
    url: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{tile}_Map.tif
    # 3° tiles named by their south-west corner: Great Britain from the Scillies to
    # Shetland (Northern Ireland sits in N54W009 too)
    tiles: [N48W009, N48W006, N48W003, N48E000, N51W006, N51W003, N51E000, N54W009, N54W006,
            N54W003, N57W009, N57W006, N57W003, N60W003]
  format: tif
  landing_page: https://esa-worldcover.org/en/data-access
  description: Land cover on a 10m grid from Sentinel-1 and Sentinel-2 imagery of 2021 (tree cover, shrubland, grassland, cropland, built-up, bare, water and more).
  licence: CC-BY-4.0
  attribution: "© ESA WorldCover project 2021 / Contains modified Copernicus Sentinel data (2021) processed by ESA WorldCover consortium"
  cadence: static
  period: "2021"
  size_hint: 1.2GB in 14 tiles

viirs_vnl:
  coverage: [E, W, S, N]
  title: VIIRS annual night-time lights (Earth Observation Group VNL v2.2)
  theme: environment
  access:
    type: manual
    instructions: >-
      Register for a free Earth Observation Group account at
      https://eogdata.mines.edu/products/register/, open
      https://eogdata.mines.edu/nighttime_light/annual/v22/, take the latest year's
      VNL_npp_<year>_global_vcmslcfg_*.average_masked.dat.tif.gz and gunzip it.
    expect: ["VNL_*average_masked*.tif"]
  format: tif
  landing_page: https://eogdata.mines.edu/products/vnl/
  description: Annual average night-time radiance (nW/cm²/sr) on a 15 arc-second grid from the VIIRS day/night band, cleaned of clouds, fires and background noise.
  licence: CC-BY-4.0
  licence_verified: true  # EOG_products_CC_License.pdf: VNL is CC BY 4.0; the notice below is its Exhibit 1 wording
  attribution: "This product was made utilizing VIIRS Nighttime Lights (VNL v2.2) data produced by the Earth Observation Group, Payne Institute for Public Policy, Colorado School of Mines."
  cadence: annual
  period: "2025"
  size_hint: 1GB (global)
  notes: Downloads sit behind a free login, so this is a manual source; the light_pollution context indicator is skipped when the file is absent.

os_open_uprn:
