  theme: environment
  access:
    type: ckan
    api: https://ckan.publishing.service.gov.uk/api/3/action
    package: event-duration-monitoring-storm-overflows-annual-returns
    resource_regex: "EDM_\\d{4}_Storm_Overflow_Annual_Return\\.zip"
  format: zip
  extract: ["*all water and sewerage companies*.xlsx"]
  landing_page: https://www.data.gov.uk/dataset/19f6064d-7356-466f-844e-d20ea10ae9fd/event-duration-monitoring-storm-overflows-annual-returns
  description: Every storm overflow of England's water and sewerage companies with its outlet's grid reference, the total duration and the counted number of its spills in the year, and the share of the year its monitor worked.
  licence: OGL-3.0
  attribution: "© Environment Agency copyright and/or database right. Event Duration Monitoring storm overflow annual returns, licensed under the Open Government Licence v3.0."
