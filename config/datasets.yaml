    type: http
    url: https://cdn.esb.ie/media-staging/docs/default-source/ecars/its-data-ecars-sites/its-data-ecars-sites-roi-ni.csv
  format: csv
  landing_page: https://data.gov.ie/dataset/esb-ev-public-charging-network
  description: Every ESB public charging site on the island with its chargers, connector types and power, and its coordinates.
  licence: CC-BY-4.0
  attribution: "ESB ecars public charging network data, ESB, licensed under CC BY 4.0."
  cadence: adhoc
  size_hint: 130KB
