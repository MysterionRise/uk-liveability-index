defra_noise_road_lden:
  coverage: [E]
  title: Defra strategic noise mapping round 4, road traffic noise (Lden, all roads)
  theme: environment
  access:
    type: wcs
    url: https://environment.data.gov.uk/spatialdata/road-noise-all-metrics-england-round-4/wcs
    coverage_id: 562c9d56-7c2d-4d42-83bb-578d6e97a517__Road_Noise_Lden_England_Round_4_All
  format: tif
  landing_page: https://environment.data.gov.uk/dataset/562c9d56-7c2d-4d42-83bb-578d6e97a517
  description: Modelled annual average day-evening-night road traffic noise (Lden, dB) on a 10m grid for 2021, every road inside agglomerations and major roads elsewhere.
  licence: OGL-3.0
  attribution: "Contains public sector information licensed under the Open Government Licence v3.0 (Defra strategic noise mapping, round 4)."
  cadence: adhoc
  size_hint: 6GB in 56 tiles
  notes: Fetched as 8192-pixel deflated GeoTIFF tiles over the WCS (the service times out above that). Cells with no mapped source hold 0 dB, so unmapped minor roads outside agglomerations read as quiet.

