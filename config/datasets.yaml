osm_england:
  coverage: [E]
  title: OpenStreetMap England extract (Geofabrik)
  theme: amenities
  access: {type: http, url: "https://download.geofabrik.de/europe/united-kingdom/england-latest.osm.pbf"}
  format: pbf
  landing_page: https://download.geofabrik.de/europe/united-kingdom/england.html
  description: Pubs, cafés, restaurants, shops, libraries, leisure and other amenities mapped by OpenStreetMap contributors.
  licence: ODbL-1.0
  attribution: "© OpenStreetMap contributors, available under the Open Database Licence (ODbL)."
  cadence: daily
  size_hint: 1.6GB

overture_pubs:
  coverage: [E, W, S, N]
  title: Overture Maps places, bars and pubs (United Kingdom)
  theme: amenities
  access:
    type: overture
    theme: places
    kind: place
    bbox: [-8.7, 49.8, 1.9, 60.9]
    where: "basic_category = 'bar'"
    select:
      - id
      - names.primary AS name
      - taxonomy.primary AS category
      - confidence
      - operating_status
      - (bbox.xmin + bbox.xmax) / 2 AS lon
      - (bbox.ymin + bbox.ymax) / 2 AS lat
  format: parquet
  landing_page: https://docs.overturemaps.org/guides/places/
  description: Bars and pubs from Overture Maps Places (Meta, Microsoft, Foursquare, AllThePlaces), with a confidence that each still exists.
  licence: CDLA-Permissive-2.0
  attribution: "Overture Maps Foundation, Places (CDLA-Permissive-2.0; includes Foursquare data under Apache-2.0 and AllThePlaces data under CC0)."
  cadence: monthly
  size_hint: 5MB
  notes: The bounding box also covers Ireland and a corner of France; staging keeps the active nations.

active_places:
  coverage: [E]
  title: Sport England Active Places (sports facilities)
  theme: amenities
  access:
    type: arcgis_item
    query: 'title:"GIS Active Places Power Facility" AND owner:SportEngland_ActivePlaces'
    title_regex: '^GIS Active Places Power Facility$'
    item_type: Feature Service
    pin: 1e189022e7064e0e9b1bdaadef6d3b78
    mode: featureserver
    layer: 1
    fields: [facilityid, siteid, facilitytype, facilitysubtype, facstatus, accessibilitygroupstr, accessibilitytypestr, managementgroupstr, easting, northing]
  format: parquet
  landing_page: https://www.activeplacespower.com/
  description: Every sports facility in England (pools, sports halls, gyms, pitches, courts, studios, ...) with its status and who can use it.
  licence: CC-BY-4.0
  attribution: "Contains Data © Sport England (Active Places), licensed under CC BY 4.0."
  cadence: monthly
  size_hint: 1.5MB

fsa_fhrs:
  coverage: [E, W, S, N]
  title: Food Standards Agency food hygiene ratings (all establishments)
  theme: amenities
  access: {type: http, url: "https://safhrsprodstorage.blob.core.windows.net/opendatafileblobstorage/FHRS_All_en-GB.csv"}
  format: csv
  landing_page: https://ratings.food.gov.uk/open-data
  description: Every food business inspected in the UK with its hygiene rating (0–5; pass or improvement required under Scotland's scheme), type and location.
  licence: OGL-3.0
  attribution: "Food Standards Agency food hygiene rating data, licensed under the Open Government Licence v3.0."
  cadence: daily
  size_hint: 300MB

# ---------------------------------------------------------------------------------------
# Housing & affordability
# ---------------------------------------------------------------------------------------

msoa_income:
  coverage: [E, W]
  title: ONS income estimates for small areas (MSOA)
  theme: housing
  access:
    type: html_link
    page: https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/earningsandworkinghours/datasets/smallareaincomeestimatesformiddlelayersuperoutputareasenglandandwales
    steps: [{pattern: 'href="(/file\?uri=[^"]*/financialyearending\d{4}/[^"]*\.xlsx)"', order: desc}]
  format: xlsx
  description: Model-based mean household income per MSOA, total and net, before and after housing costs.
  licence: OGL-3.0
  attribution: *ons
  cadence: adhoc
  period: "financial year ending 2023"
  size_hint: 3MB

council_tax:
  coverage: [E]
  title: Council Tax levels set by local authorities in England
  theme: housing
  access:
    type: govuk_attachment
    path: government/statistics/council-tax-levels-set-by-local-authorities-in-england-2026-to-2027
    attachment_regex: 'Tables_1-9_\d{4}-\d{2}\.ods$'
  format: ods
  description: Average Band D council tax per billing authority, including adult social care and parish precepts.
  licence: OGL-3.0
  attribution: "Ministry of Housing, Communities and Local Government, Council Tax levels, licensed under the Open Government Licence v3.0."
  cadence: annual
  period: "2026/27"
  size_hint: 100KB
  notes: The page path names the financial year; update it each April.

voa_ctsop:
  coverage: [E, W]
  title: VOA Council Tax stock of properties by band and build period (LSOA)
  theme: housing
  access:
    type: govuk_attachment
    path: government/statistics/council-tax-stock-of-properties-2026
    attachment_regex: 'CTSOP_4_1\.zip$'
  format: zip
  description: Dwellings per LSOA by Council Tax band and the period they were built.
  licence: OGL-3.0
  attribution: "Valuation Office Agency, Council Tax: stock of properties, licensed under the Open Government Licence v3.0."
  cadence: annual
  size_hint: 75MB zipped
  notes: The page path names the year; update it each September.

# ---------------------------------------------------------------------------------------
# Community & wellbeing
# ---------------------------------------------------------------------------------------

claimant_count:
  coverage: [E, W]
  title: Claimant count by LSOA (Nomis)
  theme: community
  access:
    type: nomis
    dataset: NM_162_1
    params:
      geography: TYPE151
      date: latest
      gender: "0"
      age: "0"
      measure: "1"
      measures: "20100"
      select: date_name,geography_code,obs_value
  format: csv
  landing_page: https://www.nomisweb.co.uk/datasets/ucjsa
  description: People claiming unemployment-related benefits (Universal Credit searching for work, or JSA), latest month.
  licence: OGL-3.0
  attribution: *ons
  cadence: monthly
  size_hint: 2MB


