  attribution: "Contains Met Office data licensed under the Open Government Licence v3.0. Contains OS and ONS data © Crown copyright and database right 2026."
  cadence: adhoc
  period: "UKCP18 projections (2001–2020 baseline)"
  size_hint: 100KB
