  title: Gigabit and FTTP broadband coverage by Electoral Division (ComReg)
  theme: transport
  access:
    type: arcgis_item
    query: 'title:"Ireland Gigabit Statistics Public Data View" AND owner:open_comreg'
    title_regex: 'Ireland Gigabit Statistics Public Data View'
    item_type: Feature Service
    pin: d57d56df83f142989c21a670593c9065
    mode: featureserver
    layer: 3
    fields: [ED_ID_STR, ED_ENGLISH, COUNTY_CODE, Premise_Count_Public_View, Gigabit_Passed_PCT_Public_View, Gigabit_NBI_Passed_PCT_Public_View, Gigabit_Active_PCT_Public_View]
  format: parquet
  landing_page: https://datamaps-comreg.hub.arcgis.com/
  description: The share of premises in each CSO Electoral Division passed by a gigabit-capable network (and taking one up), from ComReg's quarterly analysis of operators' returns against Eircodes; the Small Area layer carries premise counts only.
