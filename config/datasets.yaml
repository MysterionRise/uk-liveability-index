# Dataset registry: one entry per source, validated by lix_core.config.DatasetSpec.
#
# `lix resolve` turns each `access` block into a concrete URL and records it in
# config/datasets.lock.json; `lix fetch` downloads what the lockfile says into
# data/raw/{slug}/. ONS Open Geography items are deleted when a new version is
# published, so they are found by search (query + title_regex), with `pin` as fallback.
#
# Licences: only open licences are allowed (OGL, ODbL, CC-BY, CDLA, Apache, CC0).
# Set licence_verified: false until the licence has been checked against the source.

x-ons-attribution: &ons
  "Source: Office for National Statistics licensed under the Open Government Licence v3.0. Contains OS data © Crown copyright and database right 2026."

# ---------------------------------------------------------------------------------------
# Geography backbone
# ---------------------------------------------------------------------------------------

nspl:
  coverage: [E, W, S, N]
  title: National Statistics Postcode Lookup (latest)
  theme: geography
  access:
    type: arcgis_item
    query: 'title:"National Statistics Postcode Lookup" AND owner:ONSGeography_data'
    title_regex: '^National Statistics Postcode Lookup \([A-Z][a-z]+ \d{4}\)$'
    item_type: CSV Collection
    pin: 9d8364ebae8b4439aa66cda440e54fc8
    mode: data
  format: zip
  # The zip also holds a .txt copy and per-area CSVs (2.7 GB unpacked); take only these
  extract: ["Data/NSPL_*_UK.csv", "Documents/*.csv"]
  landing_page: https://geoportal.statistics.gov.uk/search?q=PRD_NSPL
  description: Postcode to OA/LSOA/MSOA 2021, LAD, region, police force area and coordinates.
  licence: OGL-3.0
  attribution: "Source: Office for National Statistics licensed under the Open Government Licence v3.0. Contains OS data © Crown copyright and database right 2026. Contains Royal Mail data © Royal Mail copyright and database right 2026. Contains GeoPlace data © Local Government Information House Limited copyright and database right 2026."
  cadence: quarterly
  size_hint: 185MB zipped, 1GB extracted

lsoa_boundaries:
  coverage: [E, W]
  title: LSOA 2021 boundaries (BGC, generalised 20m, clipped)
  theme: geography
  access:
    type: arcgis_item
    query: 'title:"Lower layer Super Output Areas (December 2021) Boundaries EW BGC" AND owner:ONSGeography_data'
    title_regex: '^Lower layer Super Output Areas \(December 2021\) Boundaries EW BGC \(V\d+\)$'
    item_type: Feature Service
    pin: 68515293204e43ca8ab56fa13ae8a547
    mode: hub_export
    export_format: geoPackage
  format: gpkg
  description: LSOA 2021 polygons for England and Wales; source for map tiles and point-in-polygon.
  licence: OGL-3.0
  attribution: *ons
  cadence: static
  period: "Census 2021 geography"
  size_hint: 50MB

lsoa_boundaries_bsc:
  coverage: [E, W]
  title: LSOA 2021 boundaries (BSC, super generalised 200m, clipped)
  theme: geography
  priority: P2
  access:
    type: arcgis_item
    query: 'title:"Lower layer Super Output Areas (December 2021) Boundaries EW BSC" AND owner:ONSGeography_data'
    title_regex: '^Lower layer Super Output Areas \(December 2021\) Boundaries EW BSC \(V\d+\)$'
    item_type: Feature Service
    pin: 04c65a08ecff4858bffc16e9ca9356f4
    mode: hub_export
    export_format: geoPackage
  format: gpkg
  description: Lightweight LSOA 2021 polygons for quick plots.
  licence: OGL-3.0
  attribution: *ons
  cadence: static
  period: "Census 2021 geography"
  size_hint: 16MB
  notes: Nothing in the pipeline reads it (the tiles simplify the BGC set); kept for notebooks.

msoa_boundaries:
  coverage: [E, W]
  title: MSOA 2021 boundaries (BGC, generalised 20m, clipped)
  theme: geography
  access:
    type: arcgis_item
    query: 'title:"Middle layer Super Output Areas (December 2021) Boundaries EW BGC" AND owner:ONSGeography_data'
    title_regex: '^Middle layer Super Output Areas \(December 2021\) Boundaries EW BGC \(V\d+\)$'
    item_type: Feature Service
    pin: 6b282db29762450881ed5159259a6e4e
    mode: featureserver
    fields: [MSOA21CD]
    geometry: polygon
  format: gpkg
  description: MSOA 2021 polygons; the map's middle zoom level.
  licence: OGL-3.0
  attribution: *ons
  cadence: static
  period: "Census 2021 geography"
  size_hint: 22MB

lad_boundaries:
  coverage: [E, W, S, N]
  title: Local Authority District boundaries (latest, BUC)
  theme: geography
  access:
    type: arcgis_item
    query: 'title:"Local Authority Districts" AND title:"Boundaries UK BUC" AND owner:ONSGeography_data'
    title_regex: '^Local Authority Districts \([A-Z][a-z]+ \d{4}\) Boundaries UK BUC$'
    item_type: Feature Service
    pin: fe180cafba734c6c8c5ad41ee960d30b
    mode: featureserver
    geometry: polygon
  format: gpkg
  description: Local authority polygons (ultra generalised); the map's outer zoom level.
  licence: OGL-3.0
  attribution: *ons
  cadence: annual
  size_hint: 1MB

lsoa_centroids:
  coverage: [E, W]
  title: LSOA 2021 population-weighted centroids
  theme: geography
  access:
    type: arcgis_item
    query: 'title:"Lower layer Super Output Areas (December 2021) EW Population Weighted Centroids" AND owner:ONSGeography_data'
    title_regex: '^Lower layer Super Output Areas \(December 2021\) EW Population Weighted Centroids$'
    item_type: Feature Service
    pin: 32729e42d05e4e23bc7e43a36aa4ae8b
    mode: featureserver
    fields: [LSOA21CD]
    geometry: point
  format: parquet
  description: Where each LSOA's residents live on average; origin point for access metrics.
  licence: OGL-3.0
  attribution: *ons
  cadence: static
  period: "Census 2021 geography"
  size_hint: 1MB

oa_lookup:
  coverage: [E, W]
  title: Output Area 2021 to LSOA to MSOA to LAD exact-fit lookup
  theme: geography
  access:
    type: arcgis_item
    query: 'title:"Output Area (2021) to LSOA to MSOA to LAD (December 2021) Exact Fit Lookup" AND owner:ONSGeography_data'
    title_regex: '^Output Area \(2021\) to LSOA to MSOA to LAD \(December 2021\) Exact Fit Lookup in EW \(V\d+\)$'
    item_type: Feature Service
    pin: b9ca90c10aaa4b8d9791e9859a38ca67
    mode: featureserver
    fields: [OA21CD, LSOA21CD, LSOA21NM, MSOA21CD, MSOA21NM, LAD22CD, LAD22NM]
  format: parquet
  description: Census geography hierarchy; maps OA-level data (e.g. Ofcom broadband) to LSOAs.
  licence: OGL-3.0
  attribution: *ons
  cadence: static
  period: "Census 2021 geography"
  size_hint: 10MB

lsoa11_lsoa21:
  coverage: [E, W]
  title: LSOA 2011 to LSOA 2021 exact-fit lookup
  theme: geography
  access:
    type: arcgis_item
    query: 'title:"LSOA (2011) to LSOA (2021) to Local Authority District (2022) Exact Fit Lookup" AND owner:ONSGeography_data'
    title_regex: '^LSOA \(2011\) to LSOA \(2021\) to Local Authority District \(2022\) Exact Fit Lookup for EW \(V\d+\)$'
    item_type: Feature Service
    pin: cbfe64cc03d74af982c1afec639bafd1
    mode: featureserver
    fields: [LSOA11CD, LSOA21CD, CHGIND]
  format: parquet
  description: Converts data published on 2011 LSOAs (U unchanged, S split, M merged, X irregular).
  licence: OGL-3.0
  attribution: *ons
  cadence: static
  period: "Census 2021 geography"
  size_hint: 2MB

ruc_2021:
  coverage: [E, W]
  title: Rural Urban Classification (2021) of LSOAs
  theme: geography
  access:
    type: arcgis_item
    query: 'title:"Rural Urban Classification (2021) of LSOAs in EW" AND owner:ONSGeography_data'
    title_regex: '^Rural Urban Classification \(2021\) of LSOAs in EW$'
    item_type: Feature Service
    pin: 9dbf7613cbb147b8bb8627ddb3568cff
    mode: featureserver
    fields: [LSOA21CD, RUC21CD, RUC21NM, Urban_rural_flag]
  format: parquet
  description: Urban/rural class per LSOA; lets scores compare like with like.
  licence: OGL-3.0
  attribution: *ons
  cadence: static
  period: "2021"
  size_hint: 2MB


pop_lsoa_mye:
  coverage: [E, W]
  title: ONS mid-year population estimates for LSOAs (England and Wales)
  theme: geography
  access:
    type: html_link
    page: https://www.ons.gov.uk/peoplepopulationandcommunity/populationandmigration/populationestimates/datasets/lowersuperoutputareamidyearpopulationestimatesnationalstatistics
    steps: [{pattern: 'href="(/file\?uri=[^"]*/mid\d{4}[^"]*/sapelsoabroadage[^"]*\.xlsx)"', order: desc}]
  format: xlsx
  description: Usual resident population of every 2021 LSOA in England and Wales at 30 June, by broad age group and sex. The latest year is the backbone population and the denominator of per-head indicators in both nations.
  licence: OGL-3.0
  attribution: *ons
  cadence: annual
  period: "mid-2024"
  size_hint: 13MB


msoa_names:
  coverage: [E, W]
  title: House of Commons Library MSOA names
  theme: geography
  access:
    type: http
    url: https://houseofcommonslibrary.github.io/msoanames/MSOA-Names-Latest2.csv
  format: csv
  landing_page: https://houseofcommonslibrary.github.io/msoanames/
  description: Human-friendly neighbourhood names for each MSOA (e.g. "Hillside" for Adur 001).
  licence: OGL-3.0
  attribution: "House of Commons Library MSOA Names, licensed under the Open Parliament Licence v3.0. Contains OS data © Crown copyright and database right 2026."
  cadence: adhoc
  size_hint: 1MB
  notes: Published under the Open Parliament Licence, which mirrors OGL v3.0.

os_open_names:
  coverage: [E, W, S]
  title: OS Open Names
  theme: geography
  access:
    type: http
    url: https://api.os.uk/downloads/v1/products/OpenNames/downloads?area=GB&format=CSV&redirect
  format: zip
  extract: ["Data/*.csv", "Doc/*.csv"]
  landing_page: https://www.ordnancesurvey.co.uk/products/os-open-names
  description: Gazetteer of places, roads and postcodes; powers place search ("near Leeds").
  licence: OGL-3.0
  attribution: "Contains OS data © Crown copyright and database right 2026."
  cadence: quarterly
  size_hint: 103MB zipped

life_expectancy:
  coverage: [E]
  title: Life expectancy at birth by MSOA (OHID Fingertips)
  theme: community
  access:
    type: http
    url: "https://fingertips.phe.org.uk/api/all_data/csv/by_indicator_id?indicator_ids=93283&child_area_type_id=3"
  format: csv
  landing_page: https://fingertips.phe.org.uk/profile/local-health
