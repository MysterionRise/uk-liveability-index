# (#126) and public chargers beyond OpenStreetMap (#35, #124)
# ---------------------------------------------------------------------------------------

nhle_listed:
  coverage: [E]
  title: National Heritage List for England, listed building points (Historic England)
  theme: amenities
  access:
    type: arcgis_item
    pin: 767f279327a24845bf47dfe5eae9862b
    mode: featureserver
    layer: 0
    fields: [ListEntry, Name, Grade, Easting, Northing]
    geometry: none
  format: parquet
  landing_page: https://opendata-historicengland.hub.arcgis.com/
  description: Every listed building in England as a point (grade I, II* or II), with its list entry and grid reference.
  licence: OGL-3.0
  attribution: "© Historic England 2026. Contains Ordnance Survey data © Crown copyright and database right 2026. The Historic England GIS Data contained in this material was obtained in October 2026."
  cadence: monthly
  size_hint: 380k rows in 190 pages
  notes: The layer is multipoint, so the eastings and northings travel as fields rather than geometry; the hub item is pinned (it belongs to Historic England's hub, which the ONS geoportal search does not reach).

cadw_listed:
  coverage: [W]
  title: Cadw listed buildings (DataMapWales)
  theme: amenities
  access:
    type: wfs
    url: https://datamap.gov.wales/geoserver/ows
    typename: inspire-wg:Cadw_ListedBuildings
