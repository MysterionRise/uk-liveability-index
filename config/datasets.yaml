# ---------------------------------------------------------- terrain (v0.7.0, #128)
# Slope and height around homes: OS Terrain 50 for Great Britain and OSNI's 50 m DTM for
# Northern Ireland (both terrain models, 50 m), Copernicus GLO-30 for Ireland (a 30 m
# surface model: buildings and trees raise it; Tailte Éireann's DTM is not open).

os_terrain_50:
  coverage: [E, W, S]
  title: OS Terrain 50, height grid of Great Britain
  theme: environment
  access:
    type: http
    url: "https://api.os.uk/downloads/v1/products/Terrain50/downloads?area=GB&format=ASCII+Grid+and+GML+%28Grid%29&redirect"
  format: zip
  extract: ["data/*/*.zip"]  # one zip per 10 km tile, read through /vsizip/
  landing_page: https://www.ordnancesurvey.co.uk/products/os-terrain-50
  description: Ordnance Survey's terrain model of Great Britain, heights on a 50m grid in 10km tiles (ASCII grid).
  licence: OGL-3.0
  attribution: "Contains OS data © Crown copyright and database right 2026, licensed under the Open Government Licence v3.0."
  cadence: annual
  size_hint: 160MB
  notes: Published every July; the outer zip holds one zip per tile, which the fetcher unpacks and the stager reads in place.

osni_dtm_50m:
  coverage: [N]
  title: OSNI Open Data 50m digital terrain model
  theme: environment
  access:
    type: ckan
    api: https://admin.opendatani.gov.uk/api/3/action
    package: osni-open-data-50m-dtm
    resource_regex: "osni_opendata_50m_dtm\\.zip$"
  format: zip
  extract: ["*.csv"]
  landing_page: https://admin.opendatani.gov.uk/dataset/osni-open-data-50m-dtm
  description: Heights of Northern Ireland on a 50m grid, as X, Y, Z points in the Irish Grid (Land & Property Services).
  licence: OGL-3.0
  attribution: "Contains public sector information licensed under the Open Government Licence v3.0, © Crown copyright, Land & Property Services (Ordnance Survey of Northern Ireland)."
  cadence: static
  size_hint: 37MB (130MB of CSV)

copernicus_dem_glo30:
  coverage: [I]
  title: Copernicus DEM GLO-30 (surface model), Ireland
  theme: environment
  access:
    type: http
    url: "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_{tile}_00_DEM/Copernicus_DSM_COG_10_{tile}_00_DEM.tif"
    # 1° tiles named by their south-west corner; three all-sea tiles do not exist
    tiles: [N51_00_W006, N51_00_W008, N51_00_W009, N51_00_W010, N51_00_W011,
            N52_00_W006, N52_00_W007, N52_00_W008, N52_00_W009, N52_00_W010, N52_00_W011,
            N53_00_W006, N53_00_W007, N53_00_W008, N53_00_W009, N53_00_W010, N53_00_W011,
            N54_00_W006, N54_00_W007, N54_00_W008, N54_00_W009, N54_00_W010, N54_00_W011,
            N55_00_W006, N55_00_W007, N55_00_W008, N55_00_W009]
  format: tif
  landing_page: https://registry.opendata.aws/copernicus-dem/
  description: The Copernicus 30m digital surface model (heights of the ground with buildings and trees on it), 2021 release, in 1° cloud-optimised GeoTIFF tiles.
  licence: Copernicus-DEM
  attribution: "Produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved."
  cadence: static
  period: "2021"
  size_hint: 384MB in 27 tiles
  notes: Free for any use under the Copernicus DEM licence, which requires the notice above on derived products and disclaims liability (the data is provided as is, without warranty); not OGL or CC BY, so it is its own licence id.

# ------------------------------------------------ storm overflows (v0.7.0, #83)
ea_edm_annual:
