  attribution: "FTTP and Gigabit data © An Coimisiún um Rialáil Cumarsáide | Commission for Communications Regulation (Creative Commons Licence); boundaries © Central Statistics Office."
  cadence: quarterly
  size_hint: 500KB

met_eireann_temp_9120:
  coverage: [I]
  title: Long-term air temperature averages 1991–2020, 1 km grids (Met Éireann)
  theme: climate
  access: {type: http, url: "https://www.met.ie/cms/assets/uploads/2024/07/IE_TEMP_9120_V2.zip"}
  format: zip
  extract: ["*.txt"]
  landing_page: https://www.met.ie/climate/30-year-averages
  description: Monthly, seasonal and annual mean, maximum and minimum air temperature for 1991–2020 on a 1 km grid over Ireland (Climatological Note 23), on the Irish Grid.
  licence: CC-BY-4.0
  licence_verified: false
  attribution: "Met Éireann, long-term air temperature averages 1991–2020; © Met Éireann, reused under CC BY 4.0 as Met Éireann's data on data.gov.ie is."
  cadence: static
  period: "1991–2020 averages"
  size_hint: 3MB zipped
  notes: The zip's readme says only "(c) copyright Met Éireann"; the same product line's 1981–2010 grids are published on data.gov.ie under CC BY 4.0. Met Éireann has been asked to confirm; until then the licence is recorded as unverified and the fetch warns.

met_eireann_rr_9120:
  coverage: [I]
  title: Long-term rainfall averages 1991–2020, 1 km grids (Met Éireann)
  theme: climate
  access: {type: http, url: "https://www.met.ie/cms/assets/uploads/2024/07/IE_RR_9120_V2.zip"}
  format: zip
  extract: ["*.txt"]
  landing_page: https://www.met.ie/climate/30-year-averages
  description: Monthly, seasonal and annual rainfall totals for 1991–2020 on a 1 km grid over Ireland (Climatological Note 22), on the Irish Grid; no rain-day or sunshine grids are published.
  licence: CC-BY-4.0
  licence_verified: false
  attribution: "Met Éireann, long-term rainfall averages 1991–2020; © Met Éireann, reused under CC BY 4.0 as Met Éireann's data on data.gov.ie is."
  cadence: static
  period: "1991–2020 averages"
  size_hint: 2.5MB zipped
  notes: See met_eireann_temp_9120 on the licence.

# Ireland's recorded crime: counts by Garda station (CSO, from PULSE) spread over the
# Census 2011 Garda sub-district polygons by population

cso_cja11:
  coverage: [I]
  title: Recorded crime incidents by Garda station, type of offence and year (CSO, CJA11)
  theme: safety
  access: {type: http, url: "https://ws.cso.ie/public/api.restful/PxStat.Data.Cube_API.ReadDataset/CJA11/CSV/1.0/en"}
  format: csv
  landing_page: https://data.cso.ie/table/CJA11
  description: Recorded crime incidents at each of the 564 Garda stations by offence group (ICCS) and year, 2003 to the latest full year, under the new Garda operating model; statistics under reservation, compiled from PULSE.
  licence: CC-BY-4.0
  attribution: "Central Statistics Office, Recorded Crime (statistics under reservation), licensed under CC BY 4.0."
  cadence: quarterly
  size_hint: 30MB

cso_garda_subdistricts:
  coverage: [I]
  title: Garda sub-district boundaries, Census 2011 boundary files (CSO)
  theme: safety
  access: {type: http, url: "https://www.cso.ie/en/media/csoie/census/census2011boundaryfiles/Garda_Sub_Districts.zip"}
  format: zip
  extract: ["*.shp", "*.shx", "*.dbf", "*.prj", "*.cpg"]
  landing_page: https://data.gov.ie/dataset/census-2011-boundary-files
  description: The 563 Garda sub-districts of 2011 (one per station) with their Irish names and 2011 census populations, on the Irish Grid; the areas each station's crime is spread over.
  licence: CC-BY-4.0
  attribution: "Central Statistics Office, Census 2011 boundary files (Garda sub-districts), licensed under CC BY 4.0."
  cadence: static
  period: "2011 sub-districts"
  size_hint: 26MB

garda_station_aliases:
  coverage: [I]
  title: Garda station names matched to the 2011 sub-districts (curated)
  theme: safety
  access: {type: curated, path: config/data/garda_station_aliases.csv}
  format: csv
  description: The 82 station names in the CSO's crime table that differ from the 2011 sub-district names (Irish forms, spellings, "Co. Clare" suffixes, stations opened since), each with its sub-district and county.
  licence: CC0-1.0
  attribution: "Curated for this index (CC0 1.0)."
  cadence: adhoc
  size_hint: 3KB


