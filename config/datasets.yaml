  theme: environment
  access:
    type: http
    url: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{tile}_Map.tif
    # 3° tiles named by their south-west corner; England and Wales for now (Scotland and
    # Northern Ireland add N54W009, N57W009, N57W006, N57W003 and N60W003)
    tiles: [N48W009, N48W006, N48W003, N48E000, N51W006, N51W003, N51E000, N54W006, N54W003]
  format: tif
