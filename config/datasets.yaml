overture_pubs:
  coverage: [E, W]
  title: Overture Maps places, bars and pubs (England area)
  theme: amenities
  access:
    type: overture
    theme: places
    kind: place
    bbox: [-6.5, 49.8, 1.9, 55.9]
    where: "basic_category = 'bar'"
    select:
      - id
      - names.primary AS name
      - taxonomy.primary AS category
      - confidence
      - operating_status
      - (bbox.xmin + bbox.xmax) / 2 AS lon
      - (bbox.ymin + bbox.ymax) / 2 AS lat
  format: parquet
  landing_page: https://docs.overturemaps.org/guides/places/
  description: Bars and pubs from Overture Maps Places (Meta, Microsoft, Foursquare, AllThePlaces), with a confidence that each still exists.
  licence: CDLA-Permissive-2.0
  attribution: "Overture Maps Foundation, Places (CDLA-Permissive-2.0; includes Foursquare data under Apache-2.0 and AllThePlaces data under CC0)."
  cadence: monthly
  size_hint: 5MB
  notes: The bounding box also covers Wales, southern Scotland and a corner of France; staging keeps England.

