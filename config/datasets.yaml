  theme: environment
  access:
    type: manual
    instructions: >-
      Register for a free Earth Observation Group account at
      https://eogdata.mines.edu/products/register/, open
      https://eogdata.mines.edu/nighttime_light/annual/v22/, take the latest year's
      VNL_npp_<year>_global_vcmslcfg_*.average_masked.dat.tif.gz and gunzip it.
    expect: ["VNL_*average_masked*.tif"]
  format: tif
  landing_page: https://eogdata.mines.edu/products/vnl/
  description: Annual average night-time radiance (nW/cm²/sr) on a 15 arc-second grid from the VIIRS day/night band, cleaned of clouds, fires and background noise.
  licence: CC-BY-4.0
  licence_verified: false
  attribution: "Earth Observation Group, Payne Institute for Public Policy, Colorado School of Mines (VIIRS VNL v2.2, from NOAA/NASA Suomi NPP data)."
  cadence: annual
  size_hint: 1GB (global)
