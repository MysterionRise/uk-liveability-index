  access:
    type: arcgis_item
    pin: 9e4fe229900147c7a405f33724517278
    mode: featureserver
    layer: 0
    fields: [CODE, NAME, HSD_8100_median, HSD_0120_median, HSD_15_median, HSD_2_median, HSD_3_median, HSD_4_median]
  format: parquet
  landing_page: https://climatedataportal.metoffice.gov.uk/datasets/9e4fe229900147c7a405f33724517278
