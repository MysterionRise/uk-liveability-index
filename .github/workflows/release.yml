name: Release

# Pushing a v* tag runs the CI checks, publishes the api and web images to GitHub's
# container registry (linux/amd64 and linux/arm64, built on native runners) and creates a
# draft GitHub release with notes from CHANGELOG.md. The data pack ships separately as a
# monthly data release (scripts/data-release.sh); the notes name the one this code reads,
# and the job fails when no data release of this code's serve schema exists yet. Then
# release-smoke.yml checks the draft end to end before it is published.
# A tag with a pre-release suffix is a rehearsal: v0.7.2-rc.1 runs all of this, publishes
# images tagged 0.7.2-rc.1 that testers can pull (`latest` stays where it is) and drafts a
# GitHub pre-release titled "release candidate", with the notes of 0.7.2 so far. It is the
# only way to run this workflow before the real tag: no pull request exercises it (#253).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        image: [api, web]
        platform: [amd64, arm64]
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mysterionrise/uk-liveability-index-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest only; the merge job below tags the multi-platform image
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      - name: Save the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform }}
          path: digests/*
          retention-days: 1

  images:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mysterionrise/uk-liveability-index-${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.1.0 → 0.1.0, plus latest; a pre-release (v0.7.2-rc.1 → 0.7.2-rc.1) does not move
      # latest. The rule is written out here (`latest=false` turns the action's own off)
      # so that it does not rest on what `latest=auto` means in the action's next major
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Tag the multi-platform image
        working-directory: digests
        run: |
          # shellcheck disable=SC2046 # split on purpose: a -t per tag, an image per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # A pre-release takes the notes of the version it rehearses (v0.7.2-rc.1 → 0.7.2),
      # or what is under "Unreleased" while that version has no heading yet
      - name: Release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${tag%%-*}"
          # The section under "## [name]" up to the next "## ["
          section() {
            awk -v heading="## [$1]" '
              index($0, heading) == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md
          }
          has_text() { grep -q '[^[:space:]]' "$1"; }
          : > notes.md
          section "$version" > section.md
          where="## [$version]"
          if [ "$tag" != "$version" ]; then
            has_text section.md || section Unreleased > section.md
            where="$where or ## [Unreleased]"
            {
              echo "A pre-release of $version for testing: \`LIX_VERSION=$tag make up\` runs its"
              echo "images, and \`latest\` stays on the last full release. The notes of $version so far:"
            } > notes.md
          fi
          has_text section.md || { echo "CHANGELOG.md has nothing under $where"; exit 1; }
          cat section.md >> notes.md

      # Code releases carry no data pack: they read the newest data release with the serve
      # schema this code understands. None yet means the schema was bumped without a data
      # release of the new schema: cut one (make refresh, make data-release) before tagging
      - name: Name the data release this code reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          schema="$(sed -n 's/^SERVE_SCHEMA_VERSION = //p' core/src/lix_core/config.py)"
          data_tag="$(python3 scripts/data_release.py latest --schema "$schema")"
          printf '\n### Data\n\nReads data release [%s](https://github.com/%s/releases/tag/%s) (serve schema %s): `make data-download` fetches it.\n' \
            "$data_tag" "$GITHUB_REPOSITORY" "$data_tag" "$schema" >> notes.md

      # A tag with a suffix is drafted as a GitHub pre-release, so that publishing it never
      # makes it the repository's latest release; v0.7.2-rc.1 is titled
      # "v0.7.2 release candidate 1"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$GITHUB_REF_NAME"
          kind=()
          case "$GITHUB_REF_NAME" in
            *-rc.*) title="${GITHUB_REF_NAME%%-rc.*} release candidate ${GITHUB_REF_NAME##*-rc.}"; kind=(--prerelease) ;;
            *-*) kind=(--prerelease) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" "${kind[@]}" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${kind[@]}" \
              --title "$title" --notes-file notes.md
          fi
