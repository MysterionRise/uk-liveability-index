name: Release

# Pushing a v* tag runs the CI checks, publishes the api and web images to GitHub's
# container registry (linux/amd64 and linux/arm64, built on native runners) and creates a
# draft GitHub release with notes from CHANGELOG.md. The data pack ships separately as a
# monthly data release (scripts/data-release.sh); the notes name the one this code reads,
# and the job fails when no data release of this code's serve schema exists yet. Then
# release-smoke.yml checks the draft end to end before it is published.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        image: [api, web]
        platform: [amd64, arm64]
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mysterionrise/uk-liveability-index-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest only; the merge job below tags the multi-platform image
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      - name: Save the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform }}
          path: digests/*
          retention-days: 1

  images:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mysterionrise/uk-liveability-index-${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.1.0 → 0.1.0, plus latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Tag the multi-platform image
        working-directory: digests
        run: |
          # shellcheck disable=SC2046 # split on purpose: a -t per tag, an image per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section under "## [version]" up to the next "## ["
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }

      # Code releases carry no data pack: they read the newest data release with the serve
      # schema this code understands. None yet means the schema was bumped without a data
      # release of the new schema: cut one (make refresh, make data-release) before tagging
      - name: Name the data release this code reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          schema="$(sed -n 's/^SERVE_SCHEMA_VERSION = //p' core/src/lix_core/config.py)"
          data_tag="$(python3 scripts/data_release.py latest --schema "$schema")"
          printf '\n### Data\n\nReads data release [%s](https://github.com/%s/releases/tag/%s) (serve schema %s): `make data-download` fetches it.\n' \
            "$data_tag" "$GITHUB_REPOSITORY" "$data_tag" "$schema" >> notes.md

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
