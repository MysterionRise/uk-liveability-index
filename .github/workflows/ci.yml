name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The release workflow runs the same checks before publishing images
  workflow_call:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Test
        run: uv run pytest -v
      - name: Coverage gate (every theme keeps half its weight in every nation)
        run: uv run lix validate config

      - name: API contracts are up to date
        run: |
          uv run python -m lix_api.schemas
          git diff --exit-code contracts/

      - name: Generated source docs and attribution are up to date (make docs)
        run: uv run lix docs --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Generated types match the API contracts
        run: |
          npm run types
          git diff --exit-code lib/contracts.gen.ts

      - name: Generated design tokens match lib/palette.ts
        run: |
          npm run tokens
          git diff --exit-code app/tokens.gen.css

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - name: Unit tests (incl. scoring parity with Python)
        run: npm test

  e2e:
    # Browser tests on the committed demo dataset (Leeds + Brighton, `make demo-data`)
    # with the scripted assistant: no data download and no LLM key needed
    runs-on: ubuntu-latest
    env:
      LIX_DATA_DIR: ${{ github.workspace }}/fixtures/demo
      LIX_MODEL: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check the demo dataset
        run: uv run lix validate serve --dir fixtures/demo/serve

      - name: Playwright
        working-directory: web
        run: npx playwright test --reporter=line

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7
