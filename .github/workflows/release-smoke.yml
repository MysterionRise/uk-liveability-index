name: Release smoke test

# A release as a new user gets it: the published images and the newest data release the
# code reads (or a given one), no model key, on a fresh Linux (amd64) machine. Run it on
# the draft: gh workflow run release-smoke.yml -f tag=v0.4.0 [-f data_tag=data-2026-10]
# [-f ref=master] (ref: where the test code comes from, when the tag's own needs a fix)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.4.0
        required: true
      data_tag:
        description: "Data release to test with (default: the newest compatible one)"
        required: false
      ref:
        description: "Commit or branch to run the smoke test from (default: the tag)"
        required: false

permissions:
  contents: write # reading a draft release needs write access
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Download the data pack from its data release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DATA_TAG: ${{ inputs.data_tag }}
        run: |
          # Only set DATA_TAG when one was given: an empty variable would stop the lookup
          if [ -n "$INPUT_DATA_TAG" ]; then export DATA_TAG="$INPUT_DATA_TAG"; fi
          make data-download

      # In case the packages are still private
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the published images (no .env, so no model key)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          export LIX_VERSION="${TAG#v}"
          docker compose pull api web proxy
          make up
          docker compose images

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Playwright smoke test
        working-directory: web
        env:
          LIX_SMOKE: "1"
          LIX_E2E_STACK: docker
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test smoke --reporter=line

      - if: failure()
        run: docker compose logs --tail 200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-results
          path: web/test-results/
          retention-days: 7
