name: Bug report
description: Something in the app, the API, the assistant or the pipeline does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Paste error text in a code block.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit (the About page shows it), and the data release if you know it.
      placeholder: v0.7.2, data-2026-11
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Map or page
        - Assistant
        - API or MCP server
        - Pipeline (make refresh, lix commands)
        - Docker or quickstart
        - Documentation
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Browser and operating system, or Docker and Node/Python versions for the pipeline.
