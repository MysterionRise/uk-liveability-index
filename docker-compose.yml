# Local deployment: `make up` after building data (`make build-data`) or downloading the
# data pack (`make data-download`). LIX_SERVE_DIR picks the data: ./data/serve by default,
# ./fixtures/demo/serve for the small demo dataset.
#   proxy   the one published address: web app, API and data files   http://localhost:3000
#   api     REST + assistant (AG-UI) + MCP (reached through the proxy)
#   web     the front end (reached through the proxy)
# Images come from GitHub's registry (make up pulls them) or are built here (make up BUILD=1).
# Profiles: `--profile build` for the pipeline, `--profile local-llm` for Ollama.

services:
  api:
    image: ghcr.io/mysterionrise/uk-liveability-index-api:${LIX_VERSION:-0.3.2}
    build: { context: ., dockerfile: docker/api.Dockerfile }
    # Values come from the shell or ./.env (see .env.example); unset ones stay empty
    environment:
      LIX_MODEL: ${LIX_MODEL:-openrouter:anthropic/claude-haiku-5.5}
      LIX_REPLAY_DELAY: ${LIX_REPLAY_DELAY:-0}
      LIX_FALLBACK_MODELS: ${LIX_FALLBACK_MODELS:-openrouter:qwen/qwen3.8-27b}
      LIX_EFFORT: ${LIX_EFFORT:-low}
      # Caps (agent/runlog.py, agent/limits.py): per conversation, minute and day
      LIX_SESSION_TURNS: ${LIX_SESSION_TURNS:-30}
      LIX_RATE_PER_MINUTE: ${LIX_RATE_PER_MINUTE:-20}
      LIX_DAILY_BUDGET: ${LIX_DAILY_BUDGET:-1.00}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-UK Liveability Index}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
    volumes:
      - ${LIX_SERVE_DIR:-./data/serve}:/data/serve:ro
      - ./data/logs:/data/logs

  web:
    image: ghcr.io/mysterionrise/uk-liveability-index-web:${LIX_VERSION:-0.3.2}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_EXPOSE_MAP: ${LIX_EXPOSE_MAP:-0}
    environment:
      # Server-side relay from the CopilotKit runtime to the assistant
      AGENT_URL: http://api:8000/agent
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      api: { condition: service_healthy }

  proxy:
    image: caddy:2-alpine
    volumes:
      - ${LIX_SERVE_DIR:-./data/serve}:/srv:ro
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ["${LIX_PORT:-3000}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/data/manifest.json"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  pipeline:
    profiles: [build]
    build: { context: ., dockerfile: docker/pipeline.Dockerfile }
    volumes:
      - ./data:/data
      - ./config:/app/config
    command: ["--help"]

  ollama:
    profiles: [local-llm]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

volumes:
  ollama:
