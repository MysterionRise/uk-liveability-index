# Workspace root. Packages: core/ (shared paths, config, scoring), pipeline/ (data
# pipeline and `lix` CLI); api/ (FastAPI + agent) and web/ (Next.js) come later.
[project]
name = "uk-liveability-index"
version = "0.3.2"
description = "UK Liveability Index — multi-factor scoring of English neighbourhoods at LSOA level"
requires-python = ">=3.11"
dependencies = [
    "lix-core",
    "lix-pipeline",
    "lix-api",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pydantic-evals>=2.50",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpserver>=1.1",
    "pytest-socket>=0.7",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "pipeline", "api"]

[tool.uv.sources]
lix-core = { workspace = true }
lix-pipeline = { workspace = true }
lix-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["lix_core", "lix_pipeline", "lix_api"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "pipeline/tests", "api/tests"]
# Test files share basenames across packages; importlib mode avoids module clashes
addopts = "--import-mode=importlib --allow-hosts=127.0.0.1"
asyncio_mode = "auto"
